name: WD LIVE OFFICE 자동 QA

on:
  push:
    branches:
      - main
    paths:
      - wd-live-office-test.html
      - .github/workflows/live-office-qa.yml
  workflow_dispatch:
    inputs:
      target_url:
        description: 검수할 기존 HTTPS TEST 주소
        required: false
        default: https://admin.wdwave.kr/wd-live-office-test.html
        type: string

permissions:
  contents: read

jobs:
  live-office-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WD_QA_URL: ${{ inputs.target_url || 'https://admin.wdwave.kr/wd-live-office-test.html' }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 배포 화면 TEST 번호 자동 확인
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TEST="$(grep -oE '<title>[^<]*TEST [0-9]+' wd-live-office-test.html | grep -oE 'TEST [0-9]+' | awk '{print $2}' | tail -1)"
          if [ -z "$EXPECTED_TEST" ]; then
            echo "저장소 TEST 번호를 찾지 못했습니다."
            exit 1
          fi
          EXPECTED_SHA="$(sha256sum wd-live-office-test.html | awk '{print $1}')"
          echo "WD_EXPECTED_TEST=$EXPECTED_TEST" >> "$GITHUB_ENV"
          echo "저장소 기준 TEST $EXPECTED_TEST · 파일 해시 $EXPECTED_SHA · Pages 반영 대기"

          for attempt in $(seq 1 48); do
            LIVE_FILE="$RUNNER_TEMP/wd-live-office-live.html"
            if curl -fsSL --max-time 15 "$WD_QA_URL?qa_commit=${GITHUB_SHA}" -o "$LIVE_FILE"; then
              LIVE_TEST="$(grep -oE '<title>[^<]*TEST [0-9]+' "$LIVE_FILE" | grep -oE 'TEST [0-9]+' | awk '{print $2}' | tail -1 || true)"
              LIVE_SHA="$(sha256sum "$LIVE_FILE" | awk '{print $1}')"
            else
              LIVE_TEST=""
              LIVE_SHA=""
            fi
            if [ "$LIVE_TEST" = "$EXPECTED_TEST" ] && [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "배포 화면 TEST $LIVE_TEST · 최신 파일 해시 일치"
              exit 0
            fi
            echo "$attempt/48 · 현재 TEST ${LIVE_TEST:-미확인} · 최신 파일 반영 대기"
            sleep 10
          done

          echo "Pages 배포 화면이 저장소의 TEST $EXPECTED_TEST 최신 파일과 일치하지 않습니다."
          exit 1

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: QA 패키지 설치
        run: npm install --no-audit --no-fund

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 라이브오피스 자동 QA
        run: npm run qa:live-office

      - name: 화면·결과 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wd-live-office-TEST-${{ env.WD_EXPECTED_TEST }}-qa-${{ github.run_number }}
          path: |
            qa-artifacts/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
