<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설계사허브 · 월간 영업계획</title>
<style>
.wds2{--page:#f5f4f8;--paper:#fff;--ink:#20182f;--muted:#625773;--line:#e6deec;--purple:#593b87;--purple-dark:#472b71;--plum:#271938;--sheet:#f7f3fa;--tab-tray:#ede6f3;--chart-fill:#694b96;--chart-track:#eee8f5;--soft:#ece4f6;--green:#176050;--green-bg:#e5f2ed;--quiet:#f5f2f8;margin:0;background:var(--page);color:var(--ink);font:16px/1.55 Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
.wds2 *, .wds2 *::before, .wds2 *::after{box-sizing:border-box}
.wds2 h1,.wds2 h2,.wds2 h3,.wds2 p{margin:0}
.wds2 h1,.wds2 h2,.wds2 h3{letter-spacing:-.045em;line-height:1.25}
.wds2 h1{font-size:clamp(25px,4vw,38px)}
.wds2 h2{font-size:24px}
.wds2 h3{font-size:16px}
.wds2 button,.wds2 input,.wds2 select,.wds2 textarea{font:inherit;color:inherit}
.wds2 button,.wds2 summary{cursor:pointer}
.wds2 button{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:44px;padding:7px 13px;font-weight:700}
.wds2 button:hover{background:#f6f1fb}
.wds2 button.wds2-primary{border-color:var(--purple);background:var(--purple);color:#fff}
.wds2 button.wds2-primary:hover{background:var(--purple-dark)}
.wds2 button:disabled{opacity:.52;cursor:default}
.wds2 :focus-visible{outline:2px solid #6f4b9b;outline-offset:3px}
.wds2 [hidden]{display:none!important}
.wds2 input,.wds2 select,.wds2 textarea{width:100%;min-width:0;min-height:44px;padding:8px 10px;border:1px solid #d9cfe2;border-radius:10px;background:#fff}
.wds2 textarea{min-height:68px;resize:vertical}
.wds2 label{display:grid;gap:5px;font-size:14px;font-weight:650}
.wds2 .wds2-shell{width:min(1360px,calc(100% - 48px));margin:auto}
.wds2-brandbar{border-bottom:1px solid var(--line);background:#fff}
.wds2 .wds2-brandbar .wds2-shell{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:55px}
.wds2-brand{display:flex;align-items:center;gap:10px;font-weight:760;color:#3e2c58}
.wds2-brand b{background:var(--soft);color:var(--purple);border-radius:8px;padding:3px 7px;font:800 12px/1.8 system-ui,sans-serif}
.wds2-note{font-size:13px;color:var(--muted)}
.wds2 .wds2-page{padding:24px 0 40px}
.wds2-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.wds2-month-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.wds2-month-tools input{width:153px}
.wds2-overview{margin:16px 0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.wds2-overview-card{border:1px solid var(--line);background:#fff;border-radius:19px;padding:16px 20px;min-width:0}
.wds2-overview-card h2{font-size:20px;color:var(--purple)}
.wds2-overview-card.wds2-money-card h2{color:#fff}
.wds2-overview-card .wds2-row{gap:4px 8px}
.wds2-month-tools button{white-space:nowrap}
.wds2-money{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px 13px;align-items:center;margin-top:6px}
.wds2-ring{--sweep:0%;width:75px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--chart-fill) var(--sweep),var(--chart-track) 0);padding:7px}
.wds2-ring strong{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--purple);font-size:16px;font-variant-numeric:tabular-nums}
.wds2-money-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin:0}
.wds2-money-totals dt,.wds2-people dt{font-size:14px;color:#554b64}
.wds2-money-totals dd{margin:3px 0 0;font-weight:800;font-size:clamp(15px,1.8vw,24px);letter-spacing:-.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wds2-money-totals #wds2-signed{color:var(--purple)}
.wds2-money-totals #wds2-balance{color:var(--muted)}
.wds2-money-totals #wds2-balance[data-status=remaining]{color:#ad3e4d}
.wds2-money-totals #wds2-balance[data-status=met]{color:#176050}
.wds2-money-card{background:linear-gradient(130deg,#302044,#442864);border-color:transparent;color:#fff;box-shadow:0 9px 25px #2f164622}
.wds2-money-card .wds2-money-totals dt,.wds2-money-card #wds2-signed{color:#eadcf7}
.wds2-money-card #wds2-balance[data-status=remaining]{color:#ffc4ce}
.wds2-money-card #wds2-balance[data-status=met]{color:#caf0dd}
.wds2-money-card #wds2-balance:not([data-status=remaining],[data-status=met]){color:#eadcf7}
.wds2-money-card .wds2-ring{--chart-fill:#f4d58f;--chart-track:#ffffff35}
.wds2-money-card .wds2-ring strong{background:#302044;color:#fff}
.wds2-people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 0;text-align:center}
.wds2-people>div{min-width:0}
.wds2-people>div+div{border-inline-start:1px solid #ede8f2}
.wds2-people dt{font-weight:650}
.wds2-count-ring{--fill:0deg;--segment:360deg;--gap:0deg;display:grid;place-items:center;width:67px;aspect-ratio:1;margin:4px auto 0;padding:6px;border-radius:50%;background:conic-gradient(var(--chart-fill) var(--fill),var(--chart-track) 0)}
.wds2-count-ring[data-segmented=true]{background:repeating-conic-gradient(#fff 0deg var(--gap),transparent var(--gap) var(--segment)),conic-gradient(var(--chart-fill) var(--fill),var(--chart-track) 0)}
.wds2-count-value{display:grid;align-content:center;justify-items:center;gap:1px;width:100%;height:100%;border-radius:50%;background:#fff;color:var(--purple);line-height:1.1;font-variant-numeric:tabular-nums}
.wds2-count-value strong{font-size:18px;letter-spacing:-.04em}
.wds2-count-value small{font-size:12px;color:var(--muted)}
.wds2-board{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 4px 14px #2d1c4309;overflow:hidden}
.wds2-board-head{padding:18px 20px 15px}
.wds2-board-head h2{font-size:21px}
.wds2-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wds2-tools input{width:156px}
.wds2-table{width:100%;border-collapse:collapse;table-layout:fixed}
.wds2-table th{text-align:left;vertical-align:middle}
.wds2-table thead th{padding:13px 9px;color:#514260;background:#f7f4fa;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}
.wds2-table .wds2-customer-col{width:13%;padding-inline-start:17px}
.wds2-table .wds2-next-col{width:16%;padding-inline-start:12px}
.wds2-table .wds2-date-col{width:clamp(110px,10%,140px);padding-inline-start:12px;white-space:nowrap}
.wds2-table .wds2-step-head{text-align:center;font-weight:800;font-size:16px}
.wds2-table tbody td,.wds2-table tbody th{padding:13px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.wds2-table tbody tr[data-customer]{cursor:pointer}
.wds2-table tbody tr[data-customer]:is(:hover,[data-selected=true]){background:#faf7fd}
.wds2-table tbody tr:last-child td,.wds2-table tbody tr:last-child th{border-bottom:0}
.wds2-table tbody th{padding-inline-start:17px}
.wds2 button.wds2-person{border:none;background:transparent;text-align:left;padding:0;min-height:30px;color:#3b275a;font-size:18px}
.wds2 button.wds2-person:hover{text-decoration:underline}
.wds2-table tbody td.wds2-stage-cell{padding-inline:1px}
.wds2-step{--inset:9px;display:grid;align-content:center;justify-items:center;min-height:40px;padding-inline:10px 14px;background:#f1f0f3;color:#625d69;text-align:center;font-size:15px;font-weight:700}
.wds2 :is(.wds2-step,.wds2-tabs button){clip-path:polygon(0 0,calc(100% - var(--inset)) 0,100% 50%,calc(100% - var(--inset)) 100%,0 100%,var(--inset) 50%)}
.wds2 :is(.wds2-stage-cell:first-of-type .wds2-step,.wds2-tabs button:first-child){clip-path:polygon(0 0,calc(100% - var(--inset)) 0,100% 50%,calc(100% - var(--inset)) 100%,0 100%);padding-inline-start:5px}
.wds2-step[data-state=done]{background:#d5ecdf;color:#174b3a}
.wds2-stage-cell:nth-child(3) .wds2-step[data-state=done]{background:#c2e4d1}
.wds2-stage-cell:nth-child(4) .wds2-step[data-state=done]{background:#acdbc3}
.wds2-stage-cell:nth-child(5) .wds2-step[data-state=done]{background:#93cfb1}
.wds2-step[data-state=next]{background:#22805e;color:#fff;font-weight:800}
.wds2-step[data-state=closed]{background:#156650;color:#fff;font-weight:790}
.wds2-step[data-state=ended]{background:#f6d9dd;color:#922b3c;font-weight:790;line-height:1.25;padding-block:4px}
.wds2-step[data-state=skipped]{color:#6d6474}
.wds2-next{font-size:16px;font-weight:650;overflow-wrap:anywhere}
.wds2-date{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wds2-table tbody :is(td.wds2-next,td.wds2-date){padding-inline:12px}
.wds2-table tr[data-no-followup] .wds2-next{color:var(--muted)}
.wds2-empty{text-align:center;color:var(--muted);padding:23px!important}
.wds2-old summary{padding:10px 0;font-weight:690;color:#493568}
.wds2-view-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px;margin-bottom:18px;border:1px solid var(--line);border-radius:13px;background:#fff}
.wds2 .wds2-view-tabs button{min-height:48px;border-color:transparent;border-radius:8px;color:#4b4660;font-size:17px}
.wds2 .wds2-view-tabs button[aria-selected=true]{background:#ede8f6;color:#443062}
.wds2-results-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wds2-results-tools label{display:flex;align-items:center;gap:7px}
.wds2-results-tools select{width:auto;min-height:36px;padding-block:4px}
.wds2-results-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}
.wds2-results-cards article,.wds2-results-section{border:1px solid var(--line);background:#fff;border-radius:19px;padding:18px}
.wds2-results-cards strong{display:block;margin:4px 0;font-size:23px;color:var(--purple)}
.wds2-results-section{margin-top:12px}
.wds2-results-section h2{font-size:20px}
.wds2-results-section h3{margin:13px 0 7px;color:var(--purple)}
.wds2-results-table-wrap{overflow-x:auto;margin-top:9px}
.wds2-results-table{width:100%;min-width:440px;border-collapse:collapse;text-align:left;font-size:15px}
.wds2-results-table :is(th,td){padding:11px 12px;border-bottom:1px solid var(--line)}
.wds2-results-table thead th{background:#f5eff8;color:var(--purple);white-space:nowrap}
.wds2-results-table td:last-child{white-space:nowrap}
.wds2-results-hint{margin-top:9px;color:var(--muted);font-size:14px}
@media(max-width:560px){.wds2-results-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wds2 dialog{max-height:min(90dvh,900px);color:var(--ink);background:#fbf9fd;border:1px solid #ded3ea;border-radius:16px;padding:0;box-shadow:0 14px 55px #2e194c40}
.wds2 dialog::backdrop{background:#21152c6b}
body.wds2:has(.wds2-detail[open]){overflow:hidden}
.wds2 dialog.wds2-detail{
 position:fixed;inset:14px 14px 14px auto;margin:0;
 width:min(780px,calc(100% - 28px));height:calc(100dvh - 28px);
 max-width:none;max-height:none;overflow:hidden;border:1px solid #e5ddeb;border-radius:16px;
 background:var(--sheet);box-shadow:-12px 8px 42px #24183038
}
.wds2 dialog.wds2-detail[open]{display:grid;grid-template-rows:auto minmax(0,1fr);animation:wds2-panel-in .23s ease-out}
.wds2 dialog.wds2-detail::backdrop{background:#20152968;backdrop-filter:blur(2px)}
@keyframes wds2-panel-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.wds2 dialog.wds2-detail[open]{animation:none}}
.wds2 .wds2-detail .wds2-modal-head{position:static;padding:0;background:var(--sheet);border-bottom:0}
.wds2-detail .wds2-modal-head .wds2-detail-identity{gap:6px 12px;padding:16px 22px;background:var(--plum);color:#fff}
.wds2-detail .wds2-modal-head .wds2-note{color:#e7daee;font-weight:680;font-size:13px}
.wds2-detail .wds2-modal-head h2{margin-top:3px;font-size:27px}
.wds2-detail-meta{display:flex;flex-wrap:wrap;gap:5px 14px;color:#f3eaf8;font-size:14px;margin-top:3px}
.wds2-detail .wds2-modal-head #wds2-detail-close{background:#ffffff12;border-color:#ffffff45;color:#fff;min-height:36px;padding:4px 11px;font-size:13px}
.wds2-detail .wds2-modal-head #wds2-detail-close:hover{background:#ffffff25}
.wds2-detail-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 20px 24px}
.wds2-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:16px 20px 0;padding:5px;background:var(--tab-tray);border:1px solid var(--line);border-radius:13px}
.wds2 .wds2-tabs button{--inset:11px;position:relative;min-width:0;min-height:50px;padding:6px 13px 8px;background:#fff;border:0;color:#513c64;border-radius:0;font-size:16px;line-height:1.25}
.wds2 .wds2-tabs button[data-state=done]{background:#e2d6ef;color:var(--purple-dark)}
.wds2 .wds2-tabs button[data-state=next]{background:#583982;color:#fff}
.wds2 .wds2-tabs button[data-state=closed]{background:#e2f2e9;border-color:#cde7d9;color:#236344}
.wds2 .wds2-tabs button[data-state=ended]{background:#f8e7eb;border-color:#eed0da;color:#87415a}
.wds2 .wds2-tabs button:hover{box-shadow:inset 0 0 0 1px #8d75ab}
.wds2 .wds2-tabs button[aria-selected=true]{font-weight:800}
.wds2 .wds2-tabs button[aria-selected=true]::after{content:"";position:absolute;inset:auto 7px 2px;height:2px;border-radius:2px;background:var(--purple)}
.wds2 .wds2-tabs button[data-state=next][aria-selected=true]::after{background:#f3e5ff}
.wds2 .wds2-tabs button:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #9c7cbb}
.wds2-card-body{display:grid;gap:11px}
.wds2-panel-group{min-width:0;margin:0;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:#fff}
.wds2-panel-group h3{font-size:17px;margin-bottom:9px}
.wds2-panel-group summary{color:#453060;font-weight:720}
.wds2-panel-group[open] summary{margin-bottom:9px}
.wds2-detail label{font-size:15px}
.wds2-detail .wds2-status:empty{display:none}
.wds2-detail .wds2-status{margin-top:12px}
.wds2-detail .wds2-form-actions{margin-top:3px}
.wds2-small{width:min(450px,calc(100% - 24px))}
.wds2 .wds2-modal-head{position:sticky;z-index:1;top:0;background:#34264d;color:#fff;padding:15px 21px}
.wds2-modal-head .wds2-note{color:#efe6f7}
.wds2-modal-head button{background:#ffffff14;border-color:#ffffff50;color:#fff}
.wds2-modal-head button:hover{background:#ffffff2d}
.wds2-modal-body{padding:15px 21px 18px}
.wds2-small .wds2-modal-body{display:grid;gap:12px}
.wds2-customer-picker{display:grid;gap:6px}
.wds2-customer-matches{max-height:176px;overflow:auto;display:grid;gap:5px}
.wds2-customer-matches:empty,.wds2-customer-picker .wds2-note:empty{display:none}
.wds2 .wds2-customer-matches button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;text-align:left}
.wds2-customer-matches small{font-size:13px;font-weight:550;color:var(--muted)}
.wds2-form-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.wds2-contact{display:grid;gap:12px}
.wds2-contact-summary{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff}
.wds2-contact-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px}
.wds2-contact-card-head h3{font-size:17px}
.wds2 .wds2-contact-card-head button{min-width:36px;min-height:36px;padding:0;color:var(--purple);font-size:20px;line-height:1}
.wds2-contact-summary .wds2-contact-table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:left}
.wds2-contact-table col:last-child{width:43%}
.wds2-contact-table :is(th,td){padding:10px 14px;overflow-wrap:anywhere}
.wds2-contact-table th{background:#ede6f3;color:#514260;font-size:14px;font-weight:670}
.wds2-contact-table td{font-size:16px;font-weight:720}
.wds2-contact-date-cell{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.wds2 .wds2-contact-date-cell button{min-height:36px;padding:4px 9px;font-size:14px;white-space:nowrap}
.wds2-contact-plan,.wds2-contact-record,.wds2-contact-followup{display:grid;gap:9px}
.wds2-contact-record textarea{min-height:200px}
.wds2-contact-record label:has(input[type=date]){max-width:210px}
.wds2-contact-record{gap:13px}
.wds2-contact-record>button,.wds2-contact-plan>button{justify-self:end}
.wds2-contact-record .wds2-contact-followup{grid-template-columns:minmax(0,1fr) minmax(0,176px)}
@media(max-width:520px){.wds2-contact-record .wds2-contact-followup{grid-template-columns:1fr}}

.wds2-fields{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.wds2-status{min-height:1.4em;margin-top:5px;color:#4b3670;font-size:13px}
@media(max-width:760px){
 .wds2 .wds2-shell{width:calc(100% - 22px)}
 .wds2 .wds2-page{padding-top:15px}
 .wds2-overview{grid-template-columns:minmax(0,1fr);margin:11px 0}
 .wds2-overview-card{padding:11px 12px}
 .wds2-board-head{display:grid;padding:12px}
 .wds2-tools input{flex:1 1 118px;width:118px}
 .wds2-tools button{padding:6px 8px;font-size:13px}
 .wds2-table,.wds2-table tbody,.wds2-table thead{display:block}
 .wds2-table thead tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 8px;background:#f7f4fa}
 .wds2-table thead :is(.wds2-customer-col,.wds2-next-col,.wds2-date-col){position:absolute;inline-size:1px;block-size:1px;clip-path:inset(50%);overflow:hidden;padding:0}
 .wds2-table thead th{padding:7px 2px;border:0}
 .wds2-table .wds2-step-head{font-size:12px}
 .wds2-table tbody tr[data-customer]{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;align-items:center;padding:8px 9px 10px;border-top:1px solid #eee9f3}
 .wds2-table tbody td,.wds2-table tbody th{border:0;padding:0}
 .wds2-table tbody th{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:6px}
 .wds2-table tbody :is(td.wds2-next,td.wds2-date){grid-row:3;padding:3px 0 0}
 .wds2-table tbody td.wds2-next{grid-column:1/3}
 .wds2-table tbody td.wds2-date{grid-column:3/-1;text-align:right;font-size:13px}
 .wds2-table tbody tr[data-no-followup] :is(td.wds2-next,td.wds2-date){display:none}
 .wds2-step{--inset:6px;min-height:34px;font-size:12px;padding-inline:4px 6px}
 .wds2-table .wds2-empty{display:block}
 .wds2-table tr:has(.wds2-empty){display:block}
}
@media(max-width:560px){
 .wds2 dialog.wds2-detail{inset:0;width:100%;height:100dvh;border:0;border-radius:0}
 .wds2-detail .wds2-modal-head .wds2-detail-identity{padding-inline:16px}
 .wds2-tabs{margin-inline:14px}
 .wds2-detail-scroll{padding-inline:16px}
}
@media(max-width:440px){
 .wds2-money{grid-template-columns:62px minmax(0,1fr);gap:8px}
 .wds2-ring{width:60px;padding:6px}
 .wds2-count-ring{width:62px;padding:5px}
 .wds2-money-totals{gap:4px}
 .wds2-money-totals dt{font-size:11px}
 .wds2-money-totals dd{font-size:13px}
 .wds2 .wds2-small .wds2-modal-head,.wds2-small .wds2-modal-body{padding-inline:12px}
 .wds2 .wds2-tabs button{--inset:7px;min-height:46px;padding-inline:8px;font-size:13px}
 .wds2-contact-table :is(th,td){padding-inline:7px}
 .wds2-contact-table td{font-size:14px}
 .wds2-fields{grid-template-columns:1fr}
}
.wds2-stage-compact .wds2-panel-group{padding:13px 14px}
.wds2-stage-compact textarea,.wds2-decision-fields ~ label textarea{min-height:82px}
.wds2-compare-sheet{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.wds2-compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.wds2-compare-side{min-width:0;padding:15px 16px}
.wds2-compare-side+.wds2-compare-side{border-inline-start:1px solid var(--line)}
.wds2-compare-heading{display:flex;align-items:center;flex-wrap:wrap;min-height:36px;gap:6px;margin-bottom:10px}
.wds2-compare-heading h3{margin-right:auto;font-size:17px}
.wds2 .wds2-compare-heading select{width:auto;max-width:48%;min-height:34px;padding:3px 6px;font-size:14px}
.wds2-insurer-type{color:var(--purple);background:var(--sheet);border-radius:6px;padding:2px 5px;font-size:12px}
.wds2-compare-side input[inputmode=numeric]{font-weight:700;font-variant-numeric:tabular-nums}
.wds2-premium-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f1eaf7;padding:9px 16px;color:var(--purple-dark);font-size:15px}
.wds2-premium-summary output{font-weight:750;font-size:17px}
.wds2-compare-notes{padding:12px 16px 14px}
.wds2-direction-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.wds2 .wds2-compare-notes textarea{min-height:72px}
.wds2 .wds2-direction-head .wds2-proposal-done{font-size:14px;margin:0}
.wds2-compare-form .wds2-stage-footer{border-top:1px solid var(--line);padding:12px 2px}
.wds2-compare-form .wds2-stage-footer>label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:auto}
.wds2-compare-form .wds2-stage-footer input{width:148px}
.wds2-pdf-field{display:grid;gap:5px;margin-top:8px}
.wds2-pdf-field .wds2-note:empty{display:none}
.wds2 .wds2-pdf-drop{position:relative;display:grid;place-items:center;padding:8px;min-height:43px;border:1px dashed #cbb9e2;border-radius:9px;background:#f7f2fb;color:var(--purple);font-size:14px;cursor:pointer}
.wds2 .wds2-pdf-drop:hover{background:#eee5f8}
.wds2 .wds2-pdf-drop:focus-within{outline:2px solid #6f4b9b;outline-offset:2px}
.wds2 .wds2-pdf-drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.wds2-pdf-list{display:grid;gap:4px;max-height:88px;overflow:auto;margin:0;padding:0;list-style:none}
.wds2-pdf-list li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 5px 4px 8px;border-radius:7px;background:#f8f4fa;font-size:13px;overflow-wrap:anywhere}
.wds2-pdf-list small{display:block;color:var(--muted)}
.wds2 .wds2-pdf-list button{min-height:29px;padding:2px 6px;white-space:nowrap;color:var(--purple);font-size:13px}
.wds2 .wds2-proposal-done{display:flex;align-items:center;gap:8px;margin-top:9px}
.wds2 .wds2-proposal-done input{width:17px;height:17px;min-height:0;accent-color:var(--purple)}
.wds2-compare-conditions{margin-top:8px;font-size:14px}
.wds2-compare-conditions textarea{margin-top:3px}
.wds2-stage-footer{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;padding:9px 0}
.wds2-stage-footer label,.wds2-round-panel>label{width:min(185px,100%)}
.wds2-round-header,.wds2-round-choices{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wds2-round-header{justify-content:space-between;margin-bottom:12px}
.wds2 .wds2-round-header button{min-height:36px;padding:4px 9px;font-size:14px}
.wds2 .wds2-round-header button[aria-pressed=true]{background:var(--tab-tray);border-color:#c9b5df;color:var(--purple-dark)}
.wds2-round-panel>.wds2-fields{margin-top:8px}
.wds2-decision-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0;padding:0;border:0}

.wds2 .wds2-decision-choices label{position:relative;display:grid;cursor:pointer}
.wds2 .wds2-decision-choices input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wds2-decision-choices span{display:grid;place-items:center;min-height:44px;padding:4px;border:1px solid var(--line);border-radius:9px;text-align:center}
.wds2-decision-choices input:checked+span{background:var(--purple);color:#fff;border-color:var(--purple)}
.wds2-decision-choices input:focus-visible+span{outline:2px solid #6f4b9b;outline-offset:2px}
.wds2-decision-fields{margin:11px 0}
.wds2 #wds2-policy-form label[for]{display:block;margin-bottom:-8px}
.wds2 #wds2-policy-feedback:empty{display:none}
@media(max-width:620px){
  .wds2-compare-grid{grid-template-columns:minmax(0,1fr)}

}

}

.wds2 .wds2-round-title input{width:150px;min-height:36px}
.wds2 .wds2-round-notes{grid-template-columns:1fr;gap:12px;margin:14px 0}
.wds2 .wds2-round-notes textarea{min-height:82px}
.wds2-company-picker{margin:8px 0;color:var(--purple);font-size:14px}
.wds2-company-picker summary{padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.wds2-company-list{max-height:180px;overflow:auto;padding:6px;background:var(--sheet)}
.wds2-company-list fieldset{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));border:0;margin:4px 0;min-width:0;padding:4px}
.wds2-company-list legend{font-weight:700}
.wds2 .wds2-company-list label{display:flex;align-items:center;gap:5px;font-size:13px}
.wds2 .wds2-company-list input{min-height:0;width:16px;height:16px;accent-color:var(--purple)}

.wds2-brandbar,#wds2-view-tabs{display:none!important}

.wds2 .wds2-compare-form h3{font-size:19px;margin:0;color:var(--plum)}
.wds2 .wds2-compare-form textarea{min-height:64px}
.wds2 .wds2-compare-form .wds2-pdf-drop{min-height:37px}
.wds2 .wds2-company-entry{display:flex;align-items:flex-end;gap:8px}
.wds2 .wds2-company-entry label{flex:1}
.wds2 .wds2-carrier-tags{display:flex;flex-wrap:wrap;gap:6px}
.wds2 .wds2-carrier-tags>span{display:inline-flex;align-items:center;gap:7px;border-radius:7px;background:#f1ebf7;padding:3px 7px;margin-top:6px}
.wds2 .wds2-carrier-tags button{background:transparent;border:0;min-height:28px;padding:1px 5px}
.wds2 .wds2-premium-summary{border-radius:7px}
.wds2-page{margin:0 auto;padding:12px}
</style>
</head>
<body class="wds2">
<header class="wds2-brandbar" hidden><div class="wds2-shell"><div class="wds2-brand"><b>WD</b> 설계사허브</div><div class="wds2-row"><span class="wds2-note"></span><button type="button" id="wds2-archive-connect">저장 폴더 연결</button></div></div></header>
<main class="wds2-shell wds2-page">
  <div class="wds2-view-tabs" id="wds2-view-tabs" role="tablist" aria-label="영업관리 메뉴">
    <button type="button" id="wds2-view-plan" role="tab" aria-selected="true" aria-controls="wds2-view-plan-panel">이번 달 영업계획</button>
    <button type="button" id="wds2-view-results" role="tab" aria-selected="false" aria-controls="wds2-view-results-panel" tabindex="-1">계약·실적</button>
  </div>
  <section id="wds2-view-plan-panel" role="tabpanel" aria-labelledby="wds2-view-plan">
  <div class="wds2-row">
    <h1>이번 달 영업계획</h1>
    <div class="wds2-month-tools">
      <input id="wds2-month" type="month" aria-label="영업월">
      <button class="wds2-primary" id="wds2-goal-open" type="button">＋ 영업계획 수립</button>
    </div>
  </div>
  <section class="wds2-overview" aria-label="월간 목표와 달성">
    <article class="wds2-overview-card wds2-money-card">
      <h2>신계약 월보험료</h2>
      <div class="wds2-money">
        <div id="wds2-ring" class="wds2-ring" aria-label="월보험료 달성률"><strong id="wds2-rate"></strong></div>
        <dl class="wds2-money-totals">
          <div><dt>목표 금액</dt><dd id="wds2-amount"></dd></div>
          <div><dt>체결 금액</dt><dd id="wds2-signed"></dd></div>
          <div><dt>남은 목표</dt><dd id="wds2-balance"></dd></div>
        </dl>
      </div>
    </article>
    <article class="wds2-overview-card">
      <h2>고객 목표와 달성</h2>
      <dl class="wds2-people">
        <div><dt>상담 완료</dt><dd id="wds2-metric-consult" class="wds2-count-ring"></dd></div>
        <div><dt>제안 완료</dt><dd id="wds2-metric-proposal" class="wds2-count-ring"></dd></div>
        <div><dt>체결</dt><dd id="wds2-metric-signed" class="wds2-count-ring"></dd></div>
      </dl>
    </article>
  </section>
  <section class="wds2-board" aria-labelledby="wds2-board-title">
    <div class="wds2-row wds2-board-head">
      <h2 id="wds2-board-title">영업할 고객 <span class="wds2-note" id="wds2-count"></span></h2>
      <div class="wds2-tools">
        <input id="wds2-search" type="search" placeholder="고객 이름 찾기" aria-label="고객 이름 찾기">
        <button class="wds2-primary" id="wds2-add" type="button">＋ 고객 추가</button>
      </div>
    </div>
    <table class="wds2-table" aria-label="고객별 영업 4단계와 결과">
      <thead><tr id="wds2-head"></tr></thead><tbody id="wds2-rows"></tbody>
    </table>
  </section>
  <p class="wds2-status" id="wds2-page-status" role="status"></p>
  </section>
  <section id="wds2-view-results-panel" role="tabpanel" aria-labelledby="wds2-view-results" hidden>
    <div class="wds2-row">
      <h1>계약·실적</h1>
      <div class="wds2-results-tools">
        <label>집계 기간<select id="wds2-result-period"><option value="month">선택한 달</option><option value="year">선택한 해</option><option value="all">전체</option></select></label>
        <span class="wds2-note" id="wds2-result-month"></span>
        <button type="button" id="wds2-result-month-change">영업월 변경</button>
      </div>
    </div>
    <div class="wds2-results-cards" id="wds2-result-cards"></div>
    <section class="wds2-results-section" aria-labelledby="wds2-result-list-title">
      <div class="wds2-row">
        <h2 id="wds2-result-list-title">계약 목록</h2>
        <div class="wds2-results-tools"><label>보험 종류<select id="wds2-result-type"><option value="">전체</option><option>손해보험</option><option>생명보험</option><option>자동차보험</option></select></label></div>
      </div>
      <div class="wds2-results-table-wrap">
        <table class="wds2-results-table">
          <thead><tr><th scope="col">계약일</th><th scope="col">고객명</th><th scope="col">보험 종류</th><th scope="col">보험사</th><th scope="col">상품명</th><th scope="col">보험료</th></tr></thead>
          <tbody id="wds2-result-rows"></tbody>
        </table>
      </div>
      <h3>보험사별 체결</h3>
      <p class="wds2-results-hint" id="wds2-result-carriers"></p>
    </section>
    <section class="wds2-results-section" aria-labelledby="wds2-incentive-title">
      <h2 id="wds2-incentive-title">시책 지급 예상</h2>
      <p class="wds2-results-hint">등록된 시책이 없어요.</p>
    </section>
  </section>
</main>

<dialog class="wds2-small" id="wds2-goal-dialog" aria-labelledby="wds2-goal-title">
  <header class="wds2-row wds2-modal-head"><h2 id="wds2-goal-title">영업계획 수립</h2><button type="button" data-close="wds2-goal-dialog">닫기</button></header>
  <form class="wds2-modal-body" id="wds2-goal-form">
    <label>신계약 월보험료 목표 (원)<input id="wds2-goal-value" inputmode="numeric" required placeholder="예 1,000,000"></label>
    <div class="wds2-fields">
      <label>상담 목표 (명)<input id="wds2-goal-consult" type="number" min="1" step="1" placeholder="선택"></label>
      <label>제안 목표 (명)<input id="wds2-goal-proposal" type="number" min="1" step="1" placeholder="선택"></label>
      <label>체결 목표 (명)<input id="wds2-goal-signed" type="number" min="1" step="1" placeholder="선택"></label>
    </div>
    <p class="wds2-status" id="wds2-goal-status" role="status"></p>
    <div class="wds2-form-actions"><button type="submit" class="wds2-primary">월 목표 저장</button></div>
  </form>
</dialog>
<dialog class="wds2-small" id="wds2-add-dialog" aria-labelledby="wds2-add-title">
  <header class="wds2-row wds2-modal-head"><h2 id="wds2-add-title">이번 달 고객 추가</h2><button type="button" data-close="wds2-add-dialog">닫기</button></header>
  <form class="wds2-modal-body" id="wds2-add-form">
    <div class="wds2-customer-picker">
      <label>기존 고객 검색<input id="wds2-add-query" type="search" placeholder="고객 이름으로 검색" maxlength="50" autocomplete="off" aria-controls="wds2-add-matches" autofocus></label>
      <p class="wds2-note" id="wds2-add-feedback" role="status"></p>
      <div class="wds2-customer-matches" id="wds2-add-matches"></div>
    </div>
    <label>연락 목적<select id="wds2-add-reason"></select></label>
    <label hidden>연락 목적 직접 입력<input id="wds2-add-reason-custom" maxlength="100"></label>
    <label>연락 예정일<input id="wds2-add-date" type="date"></label>
    <div class="wds2-form-actions"><button type="submit" class="wds2-primary" id="wds2-add-submit" disabled>계획에 추가</button></div>
  </form>
</dialog>
<dialog class="wds2-detail" id="wds2-detail" aria-labelledby="wds2-detail-name">
  <header class="wds2-modal-head">
    <div class="wds2-row wds2-detail-identity">
      <div>
        <p class="wds2-note" id="wds2-detail-status"></p>
        <h2 id="wds2-detail-name"></h2>
        <div class="wds2-detail-meta"><span id="wds2-detail-age"></span><span id="wds2-detail-phone"></span></div>
      </div>
      <button type="button" id="wds2-detail-close">닫기</button>
    </div>
    <div class="wds2-tabs" id="wds2-tabs" role="tablist" aria-label="고객 영업 단계"></div>
  </header>
  <div class="wds2-detail-scroll" id="wds2-detail-scroll">
    <div id="wds2-stage-panels"></div>
    <p class="wds2-status" id="wds2-detail-message" role="status"></p>
  </div>
</dialog>
<dialog class="wds2-small" id="wds2-policy-dialog" aria-labelledby="wds2-policy-title">
  <header class="wds2-row wds2-modal-head">
    <div><h2 id="wds2-policy-title">가입보험 등록</h2><p class="wds2-note" id="wds2-policy-customer"></p></div>
    <button type="button" data-close="wds2-policy-dialog">닫기</button>
  </header>
  <form class="wds2-modal-body" id="wds2-policy-form">
    <label id="wds2-final-label">확정할 제안서<select id="wds2-final-source"></select></label>
    <label>보험 종류<select id="wds2-policy-type" required></select></label>
    <label id="wds2-purpose-row">보험 구분<select id="wds2-purpose"><option value="">선택</option><option value="health">보장성</option><option value="indemnity">실손</option><option value="savings">저축성</option></select></label>
    <label id="wds2-subtype-row" hidden>저축성 구분<select id="wds2-subtype"><option value="whole_life">종신</option><option value="annuity">연금</option></select></label>
    <div id="wds2-auto-fields" hidden><label>차량번호<input id="wds2-plate"></label><label>시작일<input id="wds2-start" type="date"></label><label>만기일<input id="wds2-expiry" type="date"></label></div>
    <label>보험사<input id="wds2-policy-carrier" required></label>
    <label>상품명<input id="wds2-policy-product" required></label>
    <label for="wds2-policy-premium" id="wds2-policy-premium-caption">월보험료 (원)</label>
    <input id="wds2-policy-premium" inputmode="numeric" required>
    <p class="wds2-status" id="wds2-policy-feedback" role="status"></p>
    <div class="wds2-form-actions"><button type="submit" class="wds2-primary">등록하고 마무리</button></div>
  </form>
</dialog>
<script>
const steps = [
  {name:'연락'},
  {name:'자료 비교·제안'},
  {name:'제안 조율'},
  {name:'최종 결정'}
];
const decisionStage = steps.length-1;
const finishedLabels = ['연락 단계 종료','자료 비교·제안 단계에서 종료','제안 조율에서 종료','최종 결정에서 종료'];
const contactPurposes = ['안부 연락','보장 점검','갱신·만기 안내','보장 보완 상담','신규 가입 상담','제안 후 확인','계약 후 관리','보험금 청구 안내'];
const customPurpose = '__custom';

const $ = id => document.getElementById('wds2-' + id);
const asWon = amount => amount.toLocaleString('ko-KR') + '원';
const formatDay = offset => {
  const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
  const date = new Date(today+'T00:00:00Z');
  date.setUTCDate(date.getUTCDate()+offset);
  return date.toISOString().slice(0,10);
};
const today = formatDay(0);
const currentMonth = today.slice(0,7);
let selected;
let activeTab;
let activeView = 'plan';
const customerDirectory = new Map();
const months = new Map();
const revisions = new Map();
const monthTotals = new Map();
let hub;
let ready = false;
const monthBoard = () => months.get($('month').value);
const nameOrder = new Intl.Collator('ko-KR',{numeric:true});
const isSigned = client => client.result==='체결';
const endStage = client => client.endStage ?? decisionStage;
const metrics = {consult:client=>client.consulted,proposal:client=>client.proposed,signed:isSigned};

function stageState(client,index) {
  if(client.result) {
    if(index===endStage(client)) return isSigned(client) ? 'closed' : 'ended';
    if(index>endStage(client)) return 'skipped';
  }
  if(index<client.completed) return 'done';
  if(client.result) return 'skipped';
  return index===client.completed ? 'next' : 'waiting';
}
const stateLabels = {done:'✓ 완료',next:'진행 중',waiting:'대기',closed:'계약 완료',ended:'종료',skipped:'미진행'};

function make(tag,text='',className='') {
  const item = document.createElement(tag);
  if(text) item.textContent = text;
  if(className) item.className = className;
  return item;
}

function drawTableHead() {

    column.scope = 'col';

    return column;

function drawOverview(board,clients) {
  const signed = monthTotals.get($('month').value)??0;
  const rate = board ? Math.round(signed/board.goal*100) : 0;
  $('amount').textContent = board ? asWon(board.goal) : '미설정';
  $('signed').textContent = asWon(signed);
  const remaining = board ? Math.max(0,board.goal-signed) : 0;
  $('balance').textContent = board ? asWon(remaining) : '—';
  $('balance').dataset.status = board ? (remaining>0 ? 'remaining' : 'met') : '';
  $('rate').textContent = board ? rate+'%' : '—';
  $('ring').style.setProperty('--sweep',Math.min(100,rate)+'%');
  for(const [key,match] of Object.entries(metrics)) {
    const achieved = clients.filter(match).length;
    const target = board?.targets[key];
    drawCountRing($('metric-'+key),achieved,target);
  }
}

function drawCountRing(ring,achieved,target) {
  const segment = target ? 360/target : 360;
  const gap = Math.min(4,segment*.18);
  const fill = target ? Math.min(achieved,target)*segment : 0;
  ring.style.setProperty('--segment',segment+'deg');
  ring.style.setProperty('--gap',gap+'deg');
  ring.style.setProperty('--fill',fill+'deg');
  ring.dataset.segmented = String(target>1);
  const centre = make('span','','wds2-count-value');
  centre.append(make('strong',achieved+'명'),make('small',target ? '/ '+target+'명' : '목표 미설정'));
  ring.replaceChildren(centre);
}

function draw() {
  if(activeView==='results') drawContracts();
  const board = monthBoard();
  const clients = board?.clients ?? [];
  drawOverview(board,clients);
  $('add').disabled = !board;
  $('count').textContent = clients.length+'명';
  const query = $('search').value.trim().replace(/\s+/g,'');
  const visible = clients
    .filter(client=>client.name.replace(/\s+/g,'').includes(query))
    .sort((first,second)=>nameOrder.compare(first.name,second.name));
  const rows = $('rows');
  rows.replaceChildren();
  if(!visible.length) {
    const row = make('tr');
    const cell = make('td',board ? '표시할 고객이 없어요.' : '월 목표를 정하면 이달 영업할 고객을 추가할 수 있어요.','wds2-empty');
    cell.colSpan = steps.length+3;
    row.append(cell);
    rows.append(row);
    return;
  }
  for(const client of visible) rows.append(clientRow(client));
}

function selectView(view,focus = false) {
  activeView = view;
  for(const key of ['plan','results']) {
    const enabled = key===view;
    $('view-'+key).setAttribute('aria-selected',String(enabled));
    $('view-'+key).tabIndex = enabled ? 0 : -1;
    $('view-'+key+'-panel').hidden = !enabled;
  }
  if(view==='results') drawContracts();
  if(focus) $('view-'+view).focus();
}

function drawContracts() {
  const month = $('month').value || currentMonth;
  const period = $('result-period').value || 'month';
  const prefix = period==='all' ? '' : period==='year' ? month.slice(0,4) : month;
  const contracts = Array.from(months.values()).flatMap(board=>board.clients)
    .filter(client=>isSigned(client) && client.decisionDate?.startsWith(prefix))
    .sort((first,second)=>second.decisionDate.localeCompare(first.decisionDate) || nameOrder.compare(first.name,second.name));
  const groups = [
    ['전체',contracts,'계약 완료'],
    ...insuranceTypes.map(type=>[type,contracts.filter(client=>client.contractType===type),type==='자동차보험'?'연보험료':'월보험료'])
  ];
  $('result-month').textContent = prefix;
  $('result-cards').replaceChildren(...groups.map(([label,group,unit],index)=>{
    const card = make('article');
    const premium = group.reduce((total,client)=>total+client.premium,0);
    card.append(make('b',label),make('strong',group.length+'건'),make('p',index===0 ? unit : unit+' '+asWon(premium),'wds2-note'));
    return card;
  }));
  const type = $('result-type').value;
  const visible = type ? contracts.filter(client=>client.contractType===type) : contracts;
  const rows = $('result-rows');
  rows.replaceChildren();
  const carriers = new Map();
  for(const contract of visible) {
    const row = make('tr');
    const carrier = contract.contractCarrier || '미입력';
    const unit = contract.contractType==='자동차보험' ? '연 ' : '월 ';
    const values = [contract.decisionDate,contract.name,contract.contractType || '미분류',carrier,contract.contractProduct || '—',unit+asWon(contract.premium)];
    row.append(...values.map(value=>make('td',value)));
    rows.append(row);
    carriers.set(carrier,(carriers.get(carrier) ?? 0)+1);
  }
  if(!visible.length) {
    const row = make('tr');
    const message = make('td','해당 기간에 확인된 계약이 없어요.');
    message.colSpan = 6;
    row.append(message);
    rows.append(row);
  }
  $('result-carriers').textContent = Array.from(carriers,([name,count])=>name+' '+count+'건').join(' · ') || '—';
}

function clientRow(client) {
  const row = make('tr');
  row.dataset.customer = client.id;
  row.dataset.selected = String(selected===client);
  row.onclick = ()=>openClient(client);
  const head = make('th');

  button.type = 'button';
  button.setAttribute('aria-controls','wds2-detail');
  button.setAttribute('aria-expanded',String(selected===client));
  button.onclick = event=>{event.stopPropagation();openClient(client);};
  head.append(button);
  row.append(head);
  steps.forEach((step,index)=>{
    const cell = make('td','','wds2-stage-cell');
    const state = stageState(client,index);
    const caption = state==='ended' ? finishedLabels[index]
      : ({done:'✓',waiting:'–',skipped:'–'}[state] ?? stateLabels[state]);
    const status = make('span',caption,'wds2-step');
    status.dataset.state = state;
    status.setAttribute('aria-label',state==='ended' ? caption : step.name+' '+stateLabels[state]);
    cell.append(status);

  });

  } else dateCell.textContent = '–';

  return row;

function purposePicker(select,custom,customLabel,initial = '') {
  select.replaceChildren(new Option('목적 선택',''),...contactPurposes.map(reason=>new Option(reason,reason)),new Option('기타 · 직접 입력',customPurpose));
  select.value = initial && !contactPurposes.includes(initial) ? customPurpose : initial;
  custom.value = select.value===customPurpose ? initial : '';
  const update = ()=>{
    const editing = select.value===customPurpose;
    customLabel.hidden = !editing;
    custom.required = editing;
  };
  select.onchange = ()=>{
    update();
    if(!customLabel.hidden) custom.focus();
  };
  update();
  return {update,value:()=>select.value===customPurpose ? custom.value.trim() : select.value};
}

function contactPlanEditor(client,onSave) {
  const form = make('form','','wds2-panel-group wds2-contact-plan');

function contactRecord(client) {
  const button = make('button',client.contactDate ? '연락 기록 보기' : '연락했어요','wds2-primary');
  button.type = 'button';
  button.setAttribute('aria-expanded','false');
  const form = make('form','','wds2-panel-group wds2-contact-record');
  form.hidden = true;
  const [dateLabel,date] = contactField('연락한 날짜','date',client.contactDate || today);
  const [noteLabel,note] = contactField('고객과 나눈 내용','textarea',client.contact);
  date.required = note.required = true;
  const deciding = client.completed===0 && !client.result;
  const outcome = make('select');
  const outcomeLabel = make('label','연락 후 결정');
  outcomeLabel.hidden = !deciding;
  outcome.required = deciding;
  outcome.append(new Option('선택',''),new Option('다음 단계로 진행','next'),new Option('여기서 마무리','end'));
  outcomeLabel.append(outcome);
  const task = make('div','','wds2-contact-followup');
  task.hidden = Boolean(client.result);
  const [taskLabel,nextAction] = contactField('다음 할 일','text',client.contactNextAction);
  const [taskDateLabel,nextDate] = contactField('다음 연락일','date',client.contactNextDate);
  nextAction.maxLength = 100;
  task.append(taskLabel,taskDateLabel);
  outcome.onchange = ()=>{task.hidden = Boolean(client.result) || outcome.value==='end';};
  const save = make('button','연락 기록 저장','wds2-primary');
  save.type = 'submit';
  form.append(dateLabel,noteLabel,outcomeLabel,task,save);
  button.onclick = ()=>{
    form.hidden = !form.hidden;
    button.setAttribute('aria-expanded',String(!form.hidden));
    if(!form.hidden) date.focus();
  };
  form.onsubmit = async event=>{
    event.preventDefault();
    if(!date.value || !note.value.trim() || (deciding && !outcome.value)) {
      $('detail-message').textContent = '연락한 날짜와 나눈 내용, 연락 후 결정을 확인해 주세요.';
      return;
    }
    const draft={...client};
    draft.contactDate = date.value;
    draft.contact = note.value.trim();
    draft.consulted = true;
    if(!draft.result && outcome.value!=='end') {
      const action = nextAction.value.trim();
      const scheduled = nextDate.value;
      if(deciding || action!==(draft.contactNextAction ?? '')) draft.action = action;
      if(deciding || scheduled!==(draft.contactNextDate ?? '')) draft.date = scheduled;
      draft.contactNextAction = action;
      draft.contactNextDate = scheduled;
    }
    if(deciding) {
      if(!draft.contactPlannedDate) draft.contactPlannedDate = draft.date;
      if(outcome.value==='next') {
        draft.completed = 1;

      } else {
        draft.result = '연락 종료';
        draft.endStage = 0;
        draft.decisionDate = date.value;
        draft.action = '';
        draft.date = '';

      }
    }
    if(!await saveClient(client,draft)) return;
    if(deciding){$('stage-'+decisionStage).replaceChildren(stageForm(decisionStage));syncEndStage(client);}
    $('stage-0').replaceChildren(contactPane(client));
    draw();
    syncClient();
    if(outcome.value==='next') showTab(1,true);
    $('detail-message').textContent = '연락 기록을 저장했어요.';
    void syncSavedNotes(client);
  };
  return {button,form};
}

function syncClient() {
  $('detail-name').textContent = selected.name;
  const profile = customerDirectory.get(selected.id);
  $('detail-age').textContent = '나이 '+(Number.isInteger(profile?.age) ? profile.age+'세' : '미입력');
  $('detail-phone').textContent = '연락처 '+(profile?.phone || '미입력');
  const stage = steps[selected.result ? endStage(selected) : selected.completed].name;
  $('detail-status').textContent = selected.result
    ? (isSigned(selected) ? '최종 결정 · 계약 완료' : finishedLabels[endStage(selected)])
    : stage+' · 진행 중';
  for(let index=0;index<steps.length;index++) {
    const tab = $('tab-'+index);
    const state = stageState(selected,index);
    tab.dataset.state = state;
    tab.setAttribute('aria-label',steps[index].name+' · '+stateLabels[state]);
    if(index>0 && index<decisionStage) $('stage-complete-'+index).hidden = Boolean(selected.result) || index!==selected.completed;
  }

function buildClient() {
  const tabs = [];
  const panels = [];
  steps.forEach((step,index)=>{
    const tab = make('button',step.name);
    tab.type = 'button';
    tab.id = 'wds2-tab-'+index;
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-controls','wds2-stage-'+index);
    tab.onclick = ()=>showTab(index);
    tabs.push(tab);
    const pane = make('section');
    pane.id = 'wds2-stage-'+index;
    pane.setAttribute('role','tabpanel');
    pane.setAttribute('aria-labelledby',tab.id);
    pane.tabIndex = 0;
    pane.append(index===0 ? contactPane(selected) : stageForm(index));
    panels.push(pane);
  });
  $('tabs').replaceChildren(...tabs);
  $('stage-panels').replaceChildren(...panels);
  syncClient();
}

function showTab(index,focus = false) {
  activeTab = index;
  for(let tabIndex=0;tabIndex<steps.length;tabIndex++) {
    const enabled = tabIndex===index;
    const tab = $('tab-'+tabIndex);
    tab.setAttribute('aria-selected',String(enabled));
    tab.tabIndex = enabled ? 0 : -1;
    $('stage-'+tabIndex).hidden = !enabled;
  }
  $('detail-scroll').scrollTop = 0;
  if(focus) $('tab-'+index).focus();
}

function stageCard(title,...content) {

function personPrefix(client) {
  const birth = customerDirectory.get(client.id)?.birthYear;
  if(!birth) throw Error('고객관리에서 출생연도를 확인한 뒤 PDF를 추가해 주세요.');
  return '[영업관리]'+client.name.replace(/[\\/:*?"<>|]/g,'')+(birth?'('+String(birth).slice(-2)+')':'');
}
function salesPdfName(client,slot,round,day=formatDay(0)) {
  const prefix=personPrefix(client);
  if(slot==='currentPdfs') return prefix+'현재보험보장분석_'+day.replaceAll('-','').slice(2)+'.pdf';
  if(slot==='proposalPdfs') return prefix+'_최초가입제안서.pdf';
  if(slot==='revisionPdfs' && Number.isInteger(round) && round>0) return prefix+'_'+round+'차조율가입제안서.pdf';
  if(slot==='confirmed') return prefix+'_확정가입제안서.pdf';
  throw Error('첨부 위치를 다시 확인해 주세요.');
}
function archiveBlob(name,blob,previous,source,client,month) {
  return hub.archive(name,blob,previous,source,{customerId:client.id,month});
}
function proposalVersions(client) {
  const versions=[];
  function add(label,files,carriers){
    for(const entry of files??[]) versions.push({label,entry,carriers});
  }
  add('최초 제안',client.proposalPdfs,client.proposalCompanies??[]);
  (client.coordinationRounds??[]).forEach((round,i)=>add((i+1)+'차 조율',round.files,round.companies??[]));
  return versions;
}
async function archiveStage(client,values,month) {
  const files=[...(values.currentPdfs??[]),...(values.proposalPdfs??[]),...(values.coordinationRounds??[]).flatMap(round=>round.files??[])];
  for(const entry of files){
    if(!entry.file || entry.archived) continue;
    entry.archived=await archiveBlob(entry.name,entry.file,entry.replaces,null,client,month);
    delete entry.replaces;
  }
}
async function syncSavedNotes(client,month=$('month').value) {
  try{
    const record=JSON.stringify(client,(key,value)=>['file','replaces','archiveRecord'].includes(key)?undefined:value,2);
    const prefix='[영업관리]'+client.name.replace(/[\\/:*?"<>|]/g,'')+
      (customerDirectory.get(client.id)?.birthYear?'('+String(customerDirectory.get(client.id).birthYear).slice(-2)+')':'');
    await archiveBlob(prefix+'_'+month+'_영업기록.json',new Blob([record],{type:'application/json'}),null,null,client,month);
  }catch(error){
    if(selected===client)$('detail-message').textContent='영업계획은 저장했어요. Drive 기록 복사 실패 · '+error.message;
  }
}
async function rememberBoard(month=$('month').value,board=months.get(month)){
  if(!ready) return false;
  const plan=JSON.parse(JSON.stringify(board,(key,value)=>key==='file'||key==='replaces'?undefined:value));
  try{
    revisions.set(month,await hub.savePlan(month,plan,revisions.get(month)??0));
    return true;
  } catch(error){
    const msg='저장하지 못했어요. '+error.message;
    for(const key of ['detail-message','page-status','goal-status','add-feedback','policy-feedback']) $(key).textContent=msg;
    return false;
  }
}
async function saveClient(client,values,month=$('month').value){
  const board=months.get(month);
  if(!board)return false;
  const updated={...client,...values};
  const next={...board,clients:board.clients.map(c=>c.id===client.id?updated:c)};
  if(!await rememberBoard(month,next))return false;
  Object.assign(client,values);
  return true;
}
async function refreshTotals(month){
  try{
    const rows=await hub.getSummary(month);
    monthTotals.set(month,rows.filter(row=>row.kind!=='자동차').reduce((sum,row)=>sum+(Number(row.premium)||0),0));
    if($('month').value===month) draw();
  }catch(error){$('page-status').textContent=error.message;}
}
async function restoreBoard(){
  $('goal-open').disabled=true;
  try{
    hub=parent.wd17Connect(window);
    if(!hub) throw Error('설계사허브 TEST에서 영업관리를 열어 주세요.');
    for(const customer of hub.getCustomers()) customerDirectory.set(customer.id,customer);
    for(const {month,plan,revision} of await hub.loadPlans()){
      months.set(month,plan); revisions.set(month,revision);
    }
    ready=true;
    $('goal-open').disabled=false;
    draw();
    await refreshTotals($('month').value);
  }catch(error){$('page-status').textContent=error.message;}
}
let companyListId=0;
function companyPicker(initial=[]) {
  const wrap=make('div','','wds2-insurers');
  const chosen=new Set(initial.filter(Boolean));
  const types=new Map(Object.entries(proposalCarriers).flatMap(([type,names])=>names.map(name=>[name,type])));
  const label=make('label','제안 보험사');
  const input=make('input');
  input.placeholder='보험사 이름 입력';
  const options=make('datalist');
  options.id='wds2-carriers-'+(++companyListId);
  input.setAttribute('list',options.id);
  for(const name of types.keys()) options.append(new Option(name,name));
  label.append(input);
  const add=make('button','회사 추가');
  add.type='button';
  const line=make('div','','wds2-company-entry');
  line.append(label,add);
  const chips=make('div','','wds2-carrier-tags');
  const feedback=make('small');
  feedback.setAttribute('role','status');
  function drawNames(){
    chips.replaceChildren(...[...chosen].map(name=>{
      const item=make('span');
      item.append(make('small',types.get(name)||'구분 미등록'),make('b',name));
      const remove=make('button','×');
      remove.type='button';
      remove.setAttribute('aria-label',name+' 삭제');
      remove.onclick=()=>{chosen.delete(name);drawNames();};
      item.append(remove);
      return item;
    }));
  }
  function insert(){
    const term=input.value.trim().replace(/\s+/g,'').toLowerCase();
    if(!term)return;
    const matches=[...types.keys()].filter(name=>name.toLowerCase().includes(term));
    const name=matches.find(name=>name.toLowerCase()===term)||(matches.length===1?matches[0]:null);
    if(!name){feedback.textContent=matches.length?'손해보험사 또는 생명보험사를 목록에서 선택해 주세요.':'등록된 보험사 이름을 확인해 주세요.';return;}
    chosen.add(name); input.value='';feedback.textContent='';drawNames();input.focus();
  }
  add.onclick=insert;
  input.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();insert();}};
  wrap.append(line,options,chips,feedback);
  drawNames();
  return {wrap,read:()=>[...chosen],types:()=>[...new Set([...chosen].map(name=>types.get(name)).filter(Boolean))]};
}

function pdfField(name,caption,initial=[],client,round=0) {
  const wrap = make('div','','wds2-pdf-field');
  const drop = make('label','＋ '+caption+' 추가','wds2-pdf-drop');
  const input = make('input');
  input.name = name;
  input.type = 'file';
  input.accept = '.pdf,application/pdf';
  input.multiple = false;
  drop.append(input);
  const list = make('ul','','wds2-pdf-list');
  const message = make('p','','wds2-note');
  message.setAttribute('role','status');
  const files = initial.map(record=>typeof record==='string' ? {name:record} : record);

  function render() {
    list.replaceChildren(...files.map((file,index)=>{
      const row = make('li');
      const label = make('span',file.name);
      if(file.carrier) label.append(make('small',file.carrier));
      const remove = make('button','삭제');
      remove.type = 'button';
      remove.setAttribute('aria-label',file.name+' 삭제');
      remove.onclick = ()=>{
        files.splice(index,1);
        message.textContent = '';
        render();
        input.focus();
      };
      row.append(label,remove);
      return row;
    }));
    list.hidden = files.length===0;
  }

  input.onchange = ()=>{
    const selectedFiles = Array.from(input.files ?? []);
    input.value = '';
    const pdfs=selectedFiles.filter(file=>file.type==='application/pdf'||/\.pdf$/i.test(file.name));
    if(pdfs.length){
      try{
        const canonical=salesPdfName(client,name,round);
        const renamed=new File([pdfs[0]],canonical,{type:'application/pdf',lastModified:pdfs[0].lastModified});
        const replaces=files[0]?.archived??files[0]?.replaces??initial?.[0]?.archived;
        files.splice(0,files.length,{name:canonical,file:renamed,replaces});
      }catch(error){message.textContent=error.message;return;}
    }
    message.textContent = pdfs.length<selectedFiles.length ? 'PDF 파일만 추가할 수 있어요.' : (pdfs.length?'저장하면 이 이름으로 Drive에 올라가요.':'');
    render();
  };
  render();
  wrap.append(drop,list,message);
  return {wrap,read:()=>files.slice()};
}

function comparisonPane(client) {
  const form = make('form','','wds2-card-body wds2-compare-form');

  const currentPdfs = pdfField('currentPdfs','보장분석 PDF',client.currentPdfs,client);
  const companies=companyPicker(client.proposalCompanies ?? [client.proposalCarrier]);
  const proposalPdfs=pdfField('proposalPdfs','제안서 PDF',client.proposalPdfs,client);
  const directionInput = make('textarea');
  directionInput.value = client.proposal ?? '';
  directionInput.name = 'proposal';
  const [before,beforeInput] = contactField('현재 월보험료 (원)','text',client.currentPremium?.toLocaleString('ko-KR') ?? '');
  const [after,afterInput] = contactField('제안 후 월보험료 (원)','text',client.newPremium?.toLocaleString('ko-KR') ?? '');
  beforeInput.name = 'currentPremium';
  afterInput.name = 'newPremium';
  beforeInput.inputMode = afterInput.inputMode = 'numeric';
  const difference = make('output','','wds2-compare-difference');
  const differenceRow = make('div','','wds2-premium-summary');
  differenceRow.append(make('span','월보험료 차이'),difference);
  function premiumValue(input) {
    const raw = input.value.trim();
    if(!raw) return null;
    const number = Number(raw.replaceAll(',',''));
    return /^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(raw) && Number.isSafeInteger(number) ? number : NaN;
  }
  function updateDifference() {
    const beforeValue = premiumValue(beforeInput);
    const afterValue = premiumValue(afterInput);
    if(!Number.isFinite(beforeValue) || !Number.isFinite(afterValue)) {
      difference.textContent = '—';
      return;
    }
    const change = afterValue-beforeValue;
    difference.textContent = change===0 ? '변동 없음' : asWon(Math.abs(change))+(change>0?' 증가':' 감소');
  }
  for(const input of [beforeInput,afterInput]) {
    input.oninput = updateDifference;
    input.onblur = ()=>{
      const value = premiumValue(input);
      if(Number.isFinite(value)) input.value = value.toLocaleString('ko-KR');
    };
  }
  updateDifference();
  const conditions = make('details','','wds2-compare-conditions');
  const comparison = make('textarea');
  comparison.name = 'comparison';
  comparison.value = client.comparison ?? '';
  comparison.setAttribute('aria-label','유지·변경 내용과 조건');
  conditions.append(make('summary','유지·변경 내용과 조건'),comparison);
  directionInput.setAttribute('aria-label','제안 방향');
  const current=stageCard('현재 보험',currentPdfs.wrap,before);
  const proposalSide=stageCard('새 제안서',proposalPdfs.wrap,after,companies.wrap);
  const notes=stageCard('제안 방향',directionInput,differenceRow,conditions);
  form.append(current,proposalSide,notes);
  return addStageSave(form,client,1,'comparisonNextDate',()=>{
    for(const input of [beforeInput,afterInput]) {
      if(Number.isNaN(premiumValue(input))) {
        $('detail-message').textContent = '월보험료를 원 단위 숫자로 입력해 주세요.';
        input.focus();
        return null;
      }
    }
    return {
      currentPdfs:currentPdfs.read(),proposalPdfs:proposalPdfs.read(),proposalCompanies:companies.read(),proposalType:companies.types().length===1?companies.types()[0]:'',proposalCarrier:companies.read().length===1?companies.read()[0]:'',
      proposal:directionInput.value.trim(),currentPremium:premiumValue(beforeInput),
      newPremium:premiumValue(afterInput),comparison:comparison.value.trim()
    };
  });
}

function coordinationPane(client) {
  const form = make('form','','wds2-card-body wds2-stage-compact');
  const toolbar = make('div','','wds2-round-header');
  const choices = make('div','','wds2-round-choices');
  choices.setAttribute('aria-label','조율 회차');
  const add = make('button','＋ 조율 추가');
  add.type = 'button';
  toolbar.append(choices,add);
  const body = make('div');
  const rounds = [];
  function showRound(index) {
    rounds.forEach((round,position)=>{
      round.panel.hidden = index!==position;
      round.button.setAttribute('aria-pressed',String(index===position));
    });
  }
  function addRound(record={},focus=false) {
    const index = rounds.length;
    const button = make('button',(index+1)+'차 조율');
    button.type = 'button';
    button.onclick = ()=>showRound(index);
    const panel = make('section','','wds2-round-panel wds2-panel-group');
    const [dateLabel,date] = contactField('작성일','date',record.date || formatDay(0));
    const [requestLabel,request] = contactField('고객 요청','textarea',record.request);
    request.name = 'coordinationRequest';
    const [adjustmentLabel,adjustment] = contactField('조정한 내용','textarea',record.adjustment);
    adjustment.name = 'coordinationAdjustment';
    const companies=companyPicker(record.companies ?? client.proposalCompanies ?? []);
    const pdf=pdfField('revisionPdfs','수정 제안서 PDF',record.files,client,index+1);
    const title=make('div','','wds2-round-title');
    title.append(make('h2',(index+1)+'차 조율'),dateLabel);
    const text = make('div','','wds2-fields wds2-round-notes');
    text.append(requestLabel,adjustmentLabel);
    panel.append(title,text,companies.wrap,pdf.wrap);
    rounds.push({panel,button,read:()=>({
      date:date.value,request:request.value.trim(),adjustment:adjustment.value.trim(),files:pdf.read(),companies:companies.read()
    })});
    choices.append(button);
    body.append(panel);
    choices.hidden=rounds.length<2;
    showRound(index);
    if(focus) request.focus();
  }
  const startingRounds = client.coordinationRounds ?? [{
    date:client.coordinationDate,request:client.coordination,adjustment:client.followup,files:client.revisionPdfs
  }];
  for(const record of startingRounds) addRound(record);
  add.onclick = ()=>addRound({},true);
  form.append(toolbar,body);
  return addStageSave(form,client,2,'coordinationNextDate',()=>({
    coordinationRounds:rounds.map(round=>round.read())
  }));
}

function syncEndStage(client) {
  const end = $('stage-'+decisionStage).querySelector('[name="endStage"]');
  if(!end.dataset.edited) end.value = String(client.completed);
}

function addStageSave(form,client,index,dateKey,read) {
  const bottom = make('div','','wds2-stage-footer');
  const [dateLabel,date] = contactField('다음 연락일 (선택)','date',client[dateKey]);
  const actions = make('div','','wds2-form-actions');
  const save = make('button','저장');
  save.type = 'button';
  const complete = make('button','저장하고 단계 완료','wds2-primary');
  complete.type = 'submit';
  complete.id = 'wds2-stage-complete-'+index;
  actions.append(save,complete);
  bottom.append(dateLabel,actions);
  form.append(bottom);

  async function store(advance) {
    if(save.disabled) return;
    if(advance && (client.result || index!==client.completed)) return;
    const previousDate = client[dateKey] ?? '';
    const values = read();
    if(!values) return;
    values[dateKey]=date.value;
    const month=$('month').value;
    if(!client.result && index===client.completed && (advance || date.value!==previousDate)){values.action='';values.date=date.value;}
    if(advance) {values.completed=client.completed+1;if(index===1)values.proposed=true;}
    const attached=[...(values.currentPdfs??[]),...(values.proposalPdfs??[]),...(values.coordinationRounds??[]).flatMap(r=>r.files)];
    save.disabled=complete.disabled=true;
    try{
      if(attached.length) await archiveStage(client,values,month);
      if(!await saveClient(client,values,month))return;
    }catch(error){
      $('detail-message').textContent=error.message;
      return;
    }finally{save.disabled=complete.disabled=false;}
    void syncSavedNotes(client,month);
    draw();
    if(selected!==client) return;
    syncClient();
    if(advance) {
      syncEndStage(client);
      showTab(index+1,true);
    }
    $('detail-message').textContent = advance ? '다음 단계로 이동했어요.' : '내용을 저장했어요.';
  }
  save.onclick = ()=>store(false);
  form.onsubmit = async event=>{event.preventDefault();store(true);};
  return form;
}

function decisionPane(client) {
  const form = make('form','','wds2-card-body');
  const resultChoices = make('fieldset','','wds2-decision-choices');
  resultChoices.append(make('legend','최종 결과'));
  const choices = decisionResults.map(result=>{
    const label = make('label');
    const radio = make('input');
    radio.type = 'radio';
    radio.name = 'result';
    radio.value = result;
    radio.checked = client.result===result;
    label.append(radio,make('span',result));
    resultChoices.append(label);
    return radio;
  });
  const [dateLabel,date] = contactField('결정일','date',client.decisionDate || today);
  date.name = 'decisionDate';
  date.required = true;
  const endLabel = make('label','마무리한 단계');
  const end = make('select');
  end.name = 'endStage';
  end.append(...steps.map((step,index)=>new Option(step.name,String(index))));
  end.value = String(client.endStage ?? client.completed);
  end.onchange = ()=>{end.dataset.edited = 'true';};
  endLabel.append(end);
  const fields = make('div','','wds2-fields wds2-decision-fields');
  fields.append(dateLabel,endLabel);
  const [noteLabel,note] = contactField('결정 메모 (선택)','textarea',client.decisionNote);
  note.name='decisionNote';
  const card = stageCard('결과 기록',resultChoices,fields,noteLabel);
  const actions = make('div','','wds2-form-actions');
  const save = make('button','마무리','wds2-primary');
  save.type = 'submit';
  actions.append(save);
  form.append(card,actions);
  const resultValue = ()=>choices.find(choice=>choice.checked)?.value ?? client.result ?? '';
  function update() {
    const result = resultValue();
    endLabel.hidden = !result || result==='체결';
    save.textContent = result==='체결' ? '가입보험 등록' : '마무리';
    save.disabled = !result;
  }
  choices.forEach(radio=>{radio.onchange = update;});
  update();
  form.onsubmit = async event=>{
    event.preventDefault();
    const result = resultValue();
    if(!result || !date.value) return;
    const values = {result,decisionDate:date.value,decisionNote:note.value.trim(),
      endStage:result==='체결'?decisionStage:Number(end.value)};
    if(result==='체결') openPolicyRegistration(client,values);
    else if(await finishDecision(client,{...values,premium:0})) void syncSavedNotes(client);
  };
  return form;
}

function openPolicyRegistration(client,decision) {
  const form = $('policy-form');
  const versions=proposalVersions(client);
  const source=$('final-source');
  source.replaceChildren(new Option('제안서 선택',''),...versions.map((v,i)=>new Option(v.label+' · '+v.entry.name,String(i))));
  source.value='';
  source.required=versions.length>0;
  $('final-label').hidden=!versions.length;
  const type = $('policy-type');
  type.replaceChildren(new Option('보험 종류 선택',''),...insuranceTypes.map(name=>new Option(name,name)));
  type.value = client.contractType || client.proposalType || '';
  const carrier = $('policy-carrier');
  carrier.value = client.contractCarrier || client.proposalCarrier || '';
  const product = $('policy-product');
  product.value = client.contractProduct ?? '';
  const premium = $('policy-premium');
  premium.value = isSigned(client) && client.premium ? client.premium.toLocaleString('ko-KR') : '';
  $('policy-customer').textContent = client.name+' · '+decision.decisionDate;
  $('policy-feedback').textContent = '';
  const updatePremiumLabel = ()=>{
    $('policy-premium-caption').textContent = type.value==='자동차보험'?'연보험료 (원)':'월보험료 (원)';
  };
  function policyFields(){
    const auto=type.value==='자동차보험';
    $('auto-fields').hidden=!auto;
    $('purpose-row').hidden=auto;
    $('subtype-row').hidden=auto||$('purpose').value!=='savings';
    updatePremiumLabel();
  }
  form.reset();
  $('final-source').value='';type.value=client.contractType||client.proposalType||'';
  carrier.value=client.contractCarrier||client.proposalCarrier||'';
  product.value=client.contractProduct||'';
  premium.value=client.premium?String(client.premium):'';
  $('start').value=decision.decisionDate;
  $('start').onchange=()=>{$('expiry').value=hub.suggestAutoExpiry($('start').value);};
  $('start').onchange();
  type.onchange=policyFields;$('purpose').onchange=policyFields;policyFields();
  updatePremiumLabel();
  form.onsubmit = async event=>{
    event.preventDefault();
    if(form.dataset.saving) return;
    const amount = parseAmount(premium.value.trim());
    if(!type.value || !carrier.value.trim() || !product.value.trim() || !amount) {
      $('policy-feedback').textContent = '보험 종류, 보험사, 상품명, 보험료를 확인해 주세요.';
      return;
    }
    const values={...decision,contractType:type.value,contractCarrier:carrier.value.trim(),contractProduct:product.value.trim(),premium:amount,action:'',date:''};
    const version=versions[Number(source.value)];
    if(versions.length && (!source.value || !version)){
      $('policy-feedback').textContent='확정할 제안서를 선택해 주세요.';return;
    }
    form.dataset.saving='true';
    try{
      if(versions.length){

        if(versions.length){
          const original=version.entry;
          values.confirmedSource=version.label;
          values.confirmedCompanies=version.carriers;
          values.confirmedPdf=await archiveBlob(salesPdfName(client,'confirmed'),original.file,client.confirmedPdf,original.archived,client,$('month').value);
        }
        await archiveStage(client,values,$('month').value);
      }
      const kind={손해보험:'손보',생명보험:'생보',자동차보험:'자동차'}[type.value];
      await hub.registerContract({customerId:String(client.id),date:decision.decisionDate,kind,insurer:values.contractCarrier,
        product:values.contractProduct,premium:amount,purpose:$('purpose').value,subtype:$('subtype').value,
        plate:$('plate').value,start:$('start').value,expiry:$('expiry').value});
      if(!await finishDecision(client,values))return;
      void syncSavedNotes(client);
      $('policy-dialog').close();
      await refreshTotals($('month').value);
    }catch(error){$('policy-feedback').textContent=error.name==='AbortError'?'저장을 취소했어요.':error.message;}
    finally{delete form.dataset.saving;}
  };
  $('policy-dialog').showModal();
}

async function finishDecision(client,values) {
  if(!await saveClient(client,{...values,action:'',date:''}))return false;
  draw();
  syncClient();
  $('detail-message').textContent = values.result==='체결' ? '가입보험을 등록했어요.' : '결과를 저장하고 마무리했어요.';
  return true;
}

function stageForm(index) {

function parseAmount(raw) {
  if(!/^\d[\d,]*$/.test(raw)) return 0;
  const value = Number(raw.replaceAll(',',''));
  return Number.isSafeInteger(value) && value>0 ? value : 0;
}

  $('add-submit').disabled = true;
  $('add-feedback').textContent = '';
  const results = $('add-matches');
  results.replaceChildren();
  const query = customerSearchTerm($('add-query').value);
  if(!query) return;

  const alreadyAdded = new Set(monthBoard()?.clients.map(client=>client.id));
  const matches = [...customerDirectory.values()]
    .filter(profile=>customerSearchTerm(profile.name).includes(query))
    .sort((first,second)=>nameOrder.compare(first.name,second.name));
  $('add-feedback').textContent = matches.length ? '' : '일치하는 고객이 없어요.';
  for(const profile of matches) {
    const button = make('button',profile.name);
    button.type = 'button';
    button.disabled = alreadyAdded.has(profile.id);
    const details = [profile.phone && '끝 '+profile.phone.slice(-4),button.disabled && '이번 달 추가됨'].filter(Boolean);
    if(details.length) button.append(make('small',details.join(' · ')));
    button.onclick = ()=>{
      customerToAdd = profile;
      $('add-query').value = profile.name;
      $('add-feedback').textContent = '고객을 선택했어요.';
      $('add-submit').disabled = false;
      $('add-query').focus();
      results.replaceChildren();
    };
    results.append(button);
  }
}

$('add-query').addEventListener('input',renderCustomerMatches);
$('add-query').addEventListener('keydown',event=>{
  if(event.key==='Enter' && !customerToAdd && !event.isComposing) event.preventDefault();
});
$('add').onclick = ()=>{
  $('add-form').reset();
  $('add-query').value = '';
  $('add-reason').value = '';
  addPurpose.update();
  renderCustomerMatches();
  $('add-dialog').showModal();
};
$('add-form').onsubmit = async event=>{
  event.preventDefault();
  const board = monthBoard();
  if(!customerToAdd || !board) return;
  const {id,name} = customerToAdd;
  if(board.clients.some(client=>client.id===id)) return;
  const contactPlannedDate = $('add-date').value;
  const client={id,name,reason:addPurpose.value(),completed:0,action:'',date:contactPlannedDate,contactPlannedDate};
  $('search').value = '';
  if(!await rememberBoard($('month').value,{...board,clients:[...board.clients,client]}))return;
  board.clients.push(client);
  $('add-dialog').close();
  $('page-status').textContent = name+' 고객을 월 계획에 추가했어요.';
  draw();
};
$('detail-close').onclick = ()=>closeClient();
$('detail').addEventListener('cancel',event=>{
  event.preventDefault();
  closeClient();
});
$('tabs').addEventListener('keydown',event=>{
  let next = activeTab;
  if(event.key==='ArrowRight') next = (activeTab+1)%steps.length;
  else if(event.key==='ArrowLeft') next = (activeTab+steps.length-1)%steps.length;
  else if(event.key==='Home') next = 0;
  else if(event.key==='End') next = steps.length-1;
  else return;
  event.preventDefault();
  showTab(next,true);
});
for(const button of document.querySelectorAll('[data-close]')) {
  button.onclick = ()=>document.getElementById(button.dataset.close).close();
}
drawTableHead();
draw();
restoreBoard();
</script>
</body>
</html>
