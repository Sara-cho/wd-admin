<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b3a">
<title>WD WAVE 쨌 蹂몄쭊 TALK TEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071b3a;--navy2:#0b2855;--navy3:#123a76;
  --ink:#172033;--muted:#687287;--line:#e3e8f0;--bg:#f4f7fb;--card:#fff;
  --blue:#1769ed;--blueSoft:#eaf2ff;
  --green:#1c9b63;--greenSoft:#eaf8f1;
  --violet:#6c46cc;--violetSoft:#f1edff;
  --orange:#d97706;--orangeSoft:#fff3e4;
  --teal:#168c8c;--tealSoft:#eaf8f7;
  --red:#cc4f4f;--redSoft:#fff0f0;
  --graySoft:#f2f4f7;
  --shadow:0 10px 30px rgba(22,34,54,.07);
  --shadow2:0 5px 16px rgba(22,34,54,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif}
body{min-height:100vh}
button,a,input,textarea,select{font:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(23,105,237,.20);outline-offset:2px}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* sidebar */
.sidebar{
  position:sticky;top:0;height:100vh;overflow:auto;padding:22px 15px 18px;
  background:linear-gradient(180deg,#061a39,#071b3a 55%,#05142d);color:#fff
}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px 18px;border-bottom:1px solid rgba(255,255,255,.10)}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#1789ff,#6c46d6);display:grid;place-items:center;font-size:12px;font-weight:950;box-shadow:0 10px 24px rgba(23,137,255,.24)}
.brand strong{display:block;font-size:18px;letter-spacing:.02em}.brand small{display:block;color:#95afd0;margin-top:2px;font-size:11px}
.navlabel{padding:19px 10px 6px;color:#7895ba;font-size:10px;font-weight:950;letter-spacing:.12em}
.nav{display:grid;gap:2px}
.nav button{width:100%;min-height:44px;border:0;background:transparent;color:#dce7f4;border-radius:11px;padding:10px 11px;text-align:left;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.active{background:linear-gradient(90deg,#0f67e8,#1b7aff);color:#fff;box-shadow:0 8px 22px rgba(15,103,232,.26)}
.nav .ico{font-size:17px;width:22px;text-align:center}
.side-bottom{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.10)}
.side-note{margin-top:12px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:11px;color:#a8bdd8;font-size:10.5px;line-height:1.6}
.side-admin{width:100%;min-height:44px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:10px;font-size:11px;font-weight:900}
.side-bottom .side-data{border-color:rgba(127,211,255,.72);background:rgba(23,105,237,.10);color:#e8f4ff}
.side-bottom .side-data:hover{background:rgba(23,105,237,.22);border-color:#8bc8ff}

/* main + topbar */
.main{min-width:0}
.topbar{
  min-height:68px;position:sticky;top:0;z-index:20;padding:9px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)
}
.identity strong{font-size:15px}.identity small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.topactions{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.topbtn{min-height:42px;padding:8px 11px;border:1px solid #dce2ec;background:#fff;color:#525c70;border-radius:10px;font-size:11px;font-weight:850}
.topbtn:hover{border-color:#bab0e6;color:var(--violet)}
.topbtn.ai{background:var(--violetSoft);border-color:#ddd3ff;color:#6542bf}
.topbtn.home{background:var(--blueSoft);border-color:#d4e4ff;color:#1d61c5}
.topbtn.wdhq-main-home{
  min-height:48px;
  padding:10px 17px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:1.5px solid #b9d4ff;
  border-radius:12px;
  background:#eef5ff;
  color:#135bb8;
  font-size:15px;
  font-weight:950;
  letter-spacing:-.02em;
  box-shadow:0 4px 12px rgba(37,99,235,.10);
  cursor:pointer;
}
.topbtn.wdhq-main-home:hover{
  background:#e4efff;
  border-color:#8fb8f5;
  color:#0d4f9f;
}
.wdhq-main-home-icon{
  width:24px;
  height:24px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 24px;
}
.wdhq-main-home-icon svg{display:block}
@media(max-width:620px){
  .topbtn.wdhq-main-home{
    min-height:46px;
    padding:9px 14px;
    font-size:14px;
  }
}
.topbtn.danger{color:#bc4e4e;border-color:#eed0d0}
.content{max-width:1460px;margin:0 auto;padding:25px 24px 42px}

/* page head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:15px}
.head h1{margin:0 0 5px;font-size:27px;letter-spacing:-.035em}
.head p{margin:0;color:var(--muted);font-size:12px}
.date{font-size:11px;color:#7d8798;text-align:right}

/* top metrics */
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.metric{min-height:110px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.metric:after{content:"";position:absolute;right:-19px;bottom:-25px;width:75px;height:75px;border-radius:50%;background:var(--soft,#eef3fb)}
.metric .k{font-size:11px;font-weight:950;color:var(--tone,#50627a)}
.metric .v{margin:8px 0 3px;font-size:26px;line-height:1.05;font-weight:950;letter-spacing:-.03em}
.metric .s{font-size:9.5px;color:#8690a0;line-height:1.4}
.metric.blue{--soft:var(--blueSoft);--tone:var(--blue)}
.metric.red{--soft:var(--redSoft);--tone:var(--red)}
.metric.green{--soft:var(--greenSoft);--tone:var(--green)}
.metric.violet{--soft:var(--violetSoft);--tone:var(--violet)}
.metric.teal{--soft:var(--tealSoft);--tone:var(--teal)}
.metric.orange{--soft:var(--orangeSoft);--tone:var(--orange)}

/* AI + today */
.control{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-bottom:17px}
.ai{
  min-height:154px;padding:20px 21px;border-radius:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#302363,#4f3a82 58%,#403070);box-shadow:var(--shadow)
}
.ai:after{content:"";position:absolute;width:220px;height:220px;right:-65px;top:-83px;border-radius:50%;border:1px solid rgba(255,255,255,.10);box-shadow:0 0 0 35px rgba(255,255,255,.035),0 0 0 70px rgba(255,255,255,.02)}
.ai>*{position:relative;z-index:2}
.ai .eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.10);font-size:10px;font-weight:900;color:#eee8ff}
.ai h2{font-size:20px;margin:10px 0 6px}.ai p{margin:0;color:#ddd6f2;font-size:11px;line-height:1.55;max-width:760px}
.airow{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.aibtn{min-height:39px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 10px;font-size:10.5px;font-weight:850}
.aibtn.primary{background:#f2ca4d;border-color:#f2ca4d;color:#3d2e0c}
.today{padding:17px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.today h2{font-size:16px;margin:0 0 8px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #edf0f4;font-size:10.5px}
.trow:first-of-type{border-top:0}.trow span{color:#7d8797;text-align:right}

/* sections */
.section{padding:19px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);margin-bottom:17px}
.sectionhead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:13px}
.sectionhead h2{margin:0;font-size:18px}.sectionhead p{margin:3px 0 0;color:#8590a2;font-size:10.5px}
.sectionhead small{color:#8b94a4;font-size:10px;text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#eef2f6;color:#627084}
.badge.ok{background:var(--greenSoft);color:#188256}.badge.wait{background:var(--orangeSoft);color:#a55f0c}.badge.plan{background:var(--violetSoft);color:#6946c3}

/* revenue */
.revenue{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.biz{min-height:178px;padding:16px;border:1px solid #e5e8ef;border-radius:15px;background:linear-gradient(180deg,#fff,#fbfcff);transition:.15s}
.biz:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 24px rgba(22,34,54,.08)}
.biztop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bizicon{width:44px;height:44px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:23px}
.biz h3{font-size:16px;margin:12px 0 5px}.biz p{margin:0;color:#788293;font-size:10.5px;line-height:1.55;min-height:34px}
.bizbtn{width:100%;min-height:40px;margin-top:12px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:9px;font-size:10.5px;font-weight:950}
.bizbtn:hover{background:var(--soft)}

/* operation grids */
.triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.group{border-top:3px solid var(--accent);padding-top:9px}
.gtitle{color:var(--accent);font-size:12px;font-weight:950;margin-bottom:8px}
.space{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:9px;align-items:center;padding:12px;border:1px solid #e5e9ef;border-radius:13px;background:#fff;margin-bottom:8px}
.space:hover{border-color:#d5d0ea;box-shadow:0 6px 16px rgba(22,34,54,.055)}
.sicon{width:40px;height:40px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.space h3{font-size:13px;margin:0 0 3px}.space p{font-size:9.5px;line-height:1.45;color:#7b8596;margin:0}
.open{min-height:36px;padding:7px 9px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;font-size:9.8px;font-weight:950;white-space:nowrap}
.subroom{margin:5px 0 8px 50px;padding:8px 9px;border-radius:9px;background:#f6f2ff;color:#6646bc;font-size:9.8px;font-weight:850;line-height:1.45}
.teamchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.teamchip{padding:3px 6px;border-radius:999px;background:#eef7f2;color:#30775a;font-size:8.8px;font-weight:900}

/* external links */
.extgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.ext{min-height:76px;padding:9px 6px;border:1px solid #e5e9ef;background:#fff;border-radius:12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.ext:hover{transform:translateY(-1px);border-color:#ccc2ee;box-shadow:0 6px 15px rgba(22,34,54,.05)}
.ext .ico{font-size:20px}.ext b{font-size:9.8px}.ext small{font-size:8.3px;color:#8a94a3}
.wdhq-homepage-modal{width:min(560px,100%)}
.wdhq-homepage-body{padding:22px}
.wdhq-homepage-body>p{margin:0 0 16px;color:#687287;font-size:13px;line-height:1.55}
.wdhq-homepage-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wdhq-homepage-option{min-height:112px;padding:18px;border:1px solid #dfe5ee;border-radius:14px;background:#fff;text-align:left;color:#172033;transition:.15s}
.wdhq-homepage-option:hover{transform:translateY(-2px);border-color:#8fb8f5;box-shadow:0 10px 24px rgba(22,34,54,.08)}
.wdhq-homepage-option span{display:block;font-size:26px;margin-bottom:10px}
.wdhq-homepage-option .wdhq-channel-logo{display:grid;width:38px;height:38px;margin:0 0 10px;place-items:center}
.wdhq-homepage-option .wdhq-channel-logo img{display:block;width:36px;height:36px;object-fit:contain}
.wdhq-homepage-option b{display:block;font-size:15px;margin-bottom:5px}
.wdhq-homepage-option small{display:block;color:#7d8798;font-size:11px;line-height:1.45}
@media(max-width:620px){
  .wdhq-homepage-options{grid-template-columns:1fr}
  .wdhq-homepage-option{min-height:94px}
}

/* quick */
.quick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.q{min-height:68px;border:1px solid #e5e9ef;background:#fff;border-radius:11px;padding:8px;text-align:center;font-size:9.5px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.q span{font-size:18px}

/* personal */
.personal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;align-items:center;padding:17px 19px;border:1px solid #d8d0f7;border-radius:18px;background:linear-gradient(135deg,#fcfaff,#f1edff);box-shadow:var(--shadow);margin-bottom:13px}
.personal .pk{font-size:9px;letter-spacing:.11em;color:#6e50c3;font-weight:950}.personal h2{font-size:17px;margin:5px 0 4px}.personal p{font-size:10.3px;color:#766f85;line-height:1.5;margin:0}
.personal button{min-height:40px;border:0;border-radius:9px;background:#6748bf;color:#fff;padding:9px 12px;font-size:10.5px;font-weight:950}
.safety{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px dashed #cfd5df;border-radius:13px;background:#fafbfc;color:#626c7d}
.safety b{font-size:10.5px}.safety span{font-size:9.5px;color:#8891a0}.safety button{min-height:36px;padding:7px 9px;border:1px solid #cfd5df;background:#fff;border-radius:8px;color:#646e80;font-size:9.5px;font-weight:900}
.footer{text-align:center;color:#8d96a4;font-size:9.5px;padding-top:14px}

/* modal */
.backdrop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(7,18,39,.52)}
.backdrop.show{display:flex}
.modal{width:min(920px,100%);max-height:90vh;overflow:hidden;background:#fff;border-radius:18px;box-shadow:0 26px 80px rgba(0,0,0,.24);display:flex;flex-direction:column}
.mhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.mhead h2{margin:0;font-size:17px}.close{width:42px;height:42px;border:0;border-radius:10px;background:#f0f2f6;color:#5c6678;font-size:20px}
.mbody{padding:16px 18px;overflow:auto}.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px;background:#fbfcfe}
.mbtn{min-height:42px;border:1px solid #dce2ea;background:#fff;border-radius:9px;padding:8px 11px;color:#566074;font-size:10.5px;font-weight:900}.mbtn.primary{background:#6546bf;border-color:#6546bf;color:#fff}
.hint{padding:10px 12px;border-radius:10px;background:#fff7e9;border:1px solid #f1d8b6;color:#8a5b1c;font-size:10px;line-height:1.55;margin-bottom:13px}
.formgrid{display:grid;grid-template-columns:180px minmax(0,1fr) 110px;gap:8px 10px;align-items:center}
.formgrid label{font-size:10px;font-weight:900;color:#536075}
.formgrid input{width:100%;min-height:42px;border:1px solid #dce2ea;border-radius:9px;padding:9px 10px;font-size:10.5px}
.state{display:inline-flex;justify-content:center;padding:5px 7px;border-radius:999px;font-size:8.8px;font-weight:950}.state.ok{background:var(--greenSoft);color:#188256}.state.verify{background:var(--orangeSoft);color:#9d5c0f}.state.plan{background:var(--violetSoft);color:#6747bc}
.sourceTable{width:100%;border-collapse:collapse;font-size:10px;min-width:720px}.sourceTable th,.sourceTable td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}.sourceTable th{color:#697488;background:#f8f9fb;position:sticky;top:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.checkline{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid #e4e8ef;border-radius:10px;margin-bottom:7px;font-size:10px;line-height:1.45}
.checkline input{width:18px;height:18px;flex:none}

/* toast */
.toast{position:fixed;right:18px;bottom:18px;z-index:90;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;padding:10px 12px;border-radius:10px;background:#152039;color:#fff;font-size:10px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:none}


.mobile-status,.mobile-quick{display:none}

@media(max-width:620px){
  body{background:#f5f7fb}
  .topbar{
    min-height:56px;padding:7px 10px;
    box-shadow:0 4px 14px rgba(18,32,54,.05)
  }
  .identity strong{font-size:13px}
  .topactions{gap:5px}
  .topbtn{min-height:38px;padding:7px 9px;font-size:9.5px;border-radius:9px}
  .topactions .topbtn.home,.topactions .topbtn.ai{display:inline-flex}
  .content{padding:14px 10px 82px}
  .head{margin-bottom:10px}
  .head h1{font-size:20px;line-height:1.25;margin-bottom:4px}
  .head p{font-size:10.5px;line-height:1.45}

  /* 紐⑤컮?쇱뿉?쒕뒗 6媛???移대뱶 ?????以??ㅽ겕濡??붿빟 */
  .metrics{display:none}
  .mobile-status{
    display:flex;gap:7px;overflow-x:auto;padding:1px 1px 9px;margin-bottom:5px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch
  }
  .mobile-status::-webkit-scrollbar{display:none}
  .mstat{
    flex:0 0 88px;min-height:66px;padding:10px 9px;border:1px solid var(--line);
    border-radius:12px;background:#fff;box-shadow:var(--shadow2)
  }
  .mstat span{display:block;color:#7a8496;font-size:9px;font-weight:850}
  .mstat b{display:block;margin-top:6px;font-size:18px;letter-spacing:-.03em}

  .control{gap:9px;margin-bottom:10px}
  .ai{min-height:0;padding:15px;border-radius:15px}
  .ai .eyebrow{font-size:9px}
  .ai h2{font-size:17px;margin:8px 0 5px}
  .ai p{font-size:10px;line-height:1.5}
  .airow{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .aibtn{min-height:40px;padding:7px;font-size:9.5px}
  .today{padding:13px;border-radius:15px}
  .today h2{font-size:14px}
  .trow{padding:8px 0;font-size:9.8px}

  .mobile-quick{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px
  }
  .mobile-quick button{
    min-height:64px;border:1px solid var(--line);border-radius:12px;background:#fff;
    color:#485469;font-size:9.5px;font-weight:900;box-shadow:var(--shadow2)
  }
  .mobile-quick span{display:block;font-size:20px;margin-bottom:4px}

  .section{padding:13px;border-radius:15px;margin-bottom:11px}
  .sectionhead{margin-bottom:10px}
  .sectionhead h2{font-size:16px}
  .sectionhead p{font-size:9.8px;line-height:1.4}
  .revenue{gap:8px}
  .biz{min-height:0;padding:13px;border-radius:13px}
  .bizicon{width:40px;height:40px;font-size:20px}
  .biz h3{font-size:14px;margin:9px 0 4px}
  .biz p{font-size:9.7px;min-height:0}
  .bizbtn{min-height:42px;margin-top:9px;font-size:10px}

  .triple{gap:8px}
  .group{padding-top:7px}
  .gtitle{font-size:11px;margin-bottom:6px}
  .space{padding:10px;border-radius:12px;margin-bottom:6px}
  .space h3{font-size:12px}.space p{font-size:9px}
  .sicon{width:38px;height:38px;font-size:18px}
  .space .open{min-height:40px;font-size:9.5px}
