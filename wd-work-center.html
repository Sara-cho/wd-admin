      </fieldset>`;return;
    }
    panel.innerHTML=`<fieldset class="wd91-menu-settings"><legend>2. 메뉴별 설정 · ${step+1}/${selected.length} · ${esc(label)}</legend>
      ${choices[menu]?libraryPermissionFields(menu,choices[menu],'libraryActions','libraryCategories'):
        '<p class="smallText">선택한 직원의 화면에 이 메뉴가 표시돼요.</p>'}
    </fieldset>`;
  };
  back.onclick=()=>{read();step--;paint();};
  paint();
  form.onsubmit=async event=>{
    event.preventDefault();
    if(button.disabled||currentUser!=='manager'||staffById(profile.id)!==profile)return;
    read();
    if(step<selected.length){step++;paint();return;}
    const {login,email,enabled}=connection;
    if((login||email||enabled)&&(!/^[a-z0-9_-]{1,96}$/.test(login)||!email)){
      status.textContent='계정을 연결하려면 본진 ID와 Google 계정을 모두 입력해 주세요.';return;
    }
    const next={...profile,visibleMenus:selected,libraryPermissions:Object.fromEntries(Object.entries(choices).map(([menu,value])=>[menu,selected.includes(menu)?value.actions:[]])),
      libraryCategoryAccess:Object.fromEntries(Object.entries(choices).map(([menu,value])=>[menu,selected.includes(menu)?value.categories:[]]))};
    button.disabled=true;back.disabled=true;
    let remoteSaved=false;
    try{
      if(login){await saveWorkCenterGrant(next,login,email,enabled);remoteSaved=true;}
      if(currentUser!=='manager'||staffById(profile.id)!==profile)return;
      persistStaffProfile(next,remoteSaved);

    }finally{button.disabled=false;back.disabled=false;}
  };
}

async function staffRecordRequest(token,query,body){
  if(!token)throw new Error('로그인 상태를 확인해 주세요.');
  const response=await fetch(adminAuthBase+'/rest/v1/'+staffRecordTable+'?'+query,{
    headers:{apikey:adminAuthPublic,Authorization:'Bearer '+token,...(body?{
      'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'
    }:{})},...(body?{method:'POST',body:JSON.stringify(body)}:{}),
    cache:'no-store',signal:AbortSignal.timeout(body?40000:15000)
  });
  if(!response.ok)throw new Error(response.status===404?'직원 서류 저장소 연결을 준비 중이에요.':'직원 서류 저장소에 연결하지 못했어요.');
  return response.json();
}

  if(currentUser!=='manager'||profile.archivedAt||staffById(profile.id)!==profile)throw new Error('선택한 직원 정보를 다시 확인해 주세요.');
  const query=new URLSearchParams({on_conflict:'staff_key,kind,slot',select:staffRecordColumns});
  const payload=(Array.isArray(fields)?fields:[{...fields,slot}]).map(row=>({staff_key:profile.id,kind,...row}));
  const rows=await staffRecordRequest(token,query,payload);
  if(rows.length!==payload.length)throw new Error('저장 결과를 확인하지 못했어요.');
  const view=staffRecordView;

    view.rows=[...selected,...view.rows.filter(item=>!selected.some(row=>row.kind===item.kind&&row.slot===item.slot))];
    view.error='';view.changed=true;
  }

async function staffRecordPayload(file){
  if(!file.size||file.size>staffRecordLimit||file.name.length>255)throw new Error('파일은 한 개당 5MB 이하로 선택해 주세요.');
  const bytes=new Uint8Array(await file.arrayBuffer());
  const hex=Array.from({length:256},(_,i)=>i.toString(16).padStart(2,'0'));
  const parts=[];
  for(let offset=0;offset<bytes.length;offset+=32768){
    parts.push(Array.from(bytes.subarray(offset,offset+32768),byte=>hex[byte]).join(''));
  }
  return {file_name:file.name,mime:file.type||'application/octet-stream',file_data:'\\x'+parts.join('')};
}

async function staffFileBlob(file){
  if(!file.cloud){
    const db=await openDB();
    try{return await new Promise((resolve,reject)=>{
      const request=db.transaction('files','readonly').objectStore('files').get(file.id);
      request.onsuccess=()=>resolve(request.result?.blob);
      request.onerror=()=>reject(request.error);
    });}finally{db.close();}
  }
  const token=currentUser==='manager'?await verifyManagerHqSession():await attendanceHqToken();
  const query=staffRecordQuery(file.cloud.staff_key,'file_data,mime');
  query.set('kind','eq.'+file.cloud.kind);
  query.set('slot','eq.'+file.cloud.slot);
  const [row]=await staffRecordRequest(token,query);
  if(!row?.file_data?.startsWith('\\x'))return null;
  const hex=row.file_data.slice(2),bytes=new Uint8Array(hex.length/2);
  for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(hex.slice(i*2,i*2+2),16);
  return new Blob([bytes],{type:row.mime});
}

async function downloadStaffFile(file){
  const generation=driveConnectGeneration;
  try{
    const blob=await staffFileBlob(file);
    if(generation!==driveConnectGeneration)return;
    if(!blob)throw new Error();
    const url=URL.createObjectURL(new Blob([blob],{type:'application/octet-stream'}));
    const link=document.createElement('a');
    link.href=url;link.download=file.name;link.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  }catch{if(generation===driveConnectGeneration)notify('파일을 다운로드하지 못했어요.');}
}

function staffContractView(profile,editing){
  const files=staffContractFiles(profile),view=staffRecordView?.staffId===profile.id?staffRecordView:null;
  return `<section class="wd107-contracts" aria-labelledby="staffContractTitle">
    <div class="wd105-permission-head"><h3 id="staffContractTitle">계약서</h3>
      ${editing&&!profile.archivedAt?'<button class="small" type="button" id="addStaffContract">파일 첨부</button><input type="file" id="staffContractFiles" accept=".pdf,.doc,.docx,.hwp,.hwpx,.png,.jpg,.jpeg" multiple hidden aria-label="계약서 파일">':''}</div>
    ${files.length?`<ul>${files.map((file,i)=>`<li><span>${esc(file.name)}</span><button type="button" class="small" data-contract-download="${i}" aria-label="${esc(file.name)} 다운로드">다운로드</button></li>`).join('')}</ul>`:'<p class="smallText">첨부된 계약서가 없어요.</p>'}
    <p class="smallText" id="staffRecordStatus" role="status"${view?.error?'':' hidden'}>${esc(view?.error||'')}</p>
  </section>`;
}
function bindStaffContracts(profile){
  if(!profile||currentUser!=='manager')return;
  const add=$('addStaffContract'),input=$('staffContractFiles');
  if(add&&input){
    add.onclick=()=>input.click();
    input.onchange=async()=>{
      const files=Array.from(input.files||[]);
      if(!files.length||add.disabled)return;
      if(files.some(file=>!/\.(pdf|docx?|hwpx?|png|jpe?g)$/i.test(file.name))||files.reduce((size,file)=>size+file.size,0)>staffRecordLimit){
        input.value='';return notify('PDF·Word·한글·이미지 파일을 한 번에 총 5MB 이하로 선택해 주세요.');
      }
      add.disabled=true;activeMaterialUploads++;
      const saveButton=$('saveStaffProfile');
      if(saveButton)saveButton.disabled=true;
      try{
        const rows=await Promise.all(files.map(async file=>({slot:crypto.randomUUID(),...await staffRecordPayload(file)})));
        await saveStaffRecord(profile,'contract',null,rows);
        if(input.isConnected){
          $('staffContractArea').innerHTML=staffContractView(profile,true);
          bindStaffContracts(profile);
        }
        notify('계약서를 등록했어요.');
      }catch(error){notify(error.message);}
      finally{activeMaterialUploads--;add.disabled=false;input.value='';if(saveButton)saveButton.disabled=false;}
    };
  }
  const files=staffContractFiles(profile);
  document.querySelectorAll('[data-contract-download]').forEach(button=>button.onclick=()=>{
    const file=files[Number(button.dataset.contractDownload)];
    if(file&&currentUser==='manager'&&managerStaffId===profile.id)void downloadStaffFile(file);
  });
}

let staffListRole='',staffListOrder='name',reportStaffListOrder='seniority',staffListQuery='';

function staffRosterPanel(id,profiles,selected,kind){
  const headingId=id+'Title',order=kind==='report'?reportStaffListOrder:staffListOrder;
  return `<section class="card wd113-staff-panel" aria-labelledby="${headingId}">
    <div class="wd58-panel-head"><h2 id="${headingId}">직원·스탭 <span class="pill">${profiles.filter(person=>!person.archivedAt).length}명</span></h2>
      ${kind==='profile'?'<button type="button" class="primary" id="addStaff">+ 인원 추가</button>':''}</div>
    <div class="wd113-staff-filters">
      <input type="search" id="staffRosterSearch" aria-label="직원·스탭 이름 검색" placeholder="이름 검색" value="${esc(staffListQuery)}">
      <select id="staffRoleFilter" aria-label="직원·스탭 직책 필터"><option value="">전체</option><option value="employee" ${staffListRole==='employee'?'selected':''}>직원</option><option value="staff" ${staffListRole==='staff'?'selected':''}>스탭</option></select>
      <select id="staffListOrder" aria-label="직원·스탭 정렬">${kind==='report'?`<option value="seniority" ${order==='seniority'?'selected':''}>오래 근무한 순</option>`:''}<option value="name" ${order==='name'?'selected':''}>이름순</option><option value="joined" ${order==='joined'?'selected':''}>최근 입사순</option></select>
    </div>
    <div class="wd113-staff-scroll wd135-work-scroll" id="${id}" tabindex="0" role="region" aria-labelledby="${headingId}">${staffRosterMarkup(profiles,selected,kind)}</div>
  </section>`;
}

function staffRosterMarkup(people,selected,kind){
  const management=kind==='profile',order=kind==='report'?reportStaffListOrder:staffListOrder;
  const seniorityDate=person=>person.joinedOn||(person.name==='박수진'?'0000-00-00':'9999-12-31');
  const attribute=management?'data-staff-profile':'data-'+kind+'-staff';
  const term=staffListQuery.trim().toLocaleLowerCase('ko');
  const sorted=people.filter(person=>
    (!staffListRole||(person.workType==='employee'?'employee':'staff')===staffListRole)&&person.name.toLocaleLowerCase('ko').includes(term))
    .sort((a,b)=>(order==='seniority'?seniorityDate(a).localeCompare(seniorityDate(b)):
      order==='joined'?String(b.joinedOn||'').localeCompare(String(a.joinedOn||'')):0)||a.name.localeCompare(b.name,'ko'));
  const active=sorted.filter(person=>!person.archivedAt),archived=sorted.filter(person=>person.archivedAt);
  const row=(id,name,role='',actions='')=>`<li class="${id===selected?'selected':''}">
    <button type="button" class="wd107-staff-pick" ${attribute}="${esc(id)}" aria-pressed="${id===selected}"><strong>${esc(name)}</strong>${role?`<small class="wd105-staff-role">${esc(role)}</small>`:''}</button>
    ${actions}</li>`;
  const rows=profiles=>profiles.map(person=>row(person.id,person.name,staffAccessLabel(person),management?
    `<button type="button" class="wd107-trash" ${person.archivedAt?'data-hide-staff':'data-delete-staff'}="${esc(person.id)}" aria-label="${esc(person.name)} ${person.archivedAt?'목록에서 제거':'삭제'}" title="${person.archivedAt?'목록에서 제거':'삭제'}">${staffTrashIcon}</button>`:'')).join('');
  return `${active.length?`<ul class="wd107-staff-list">${rows(active)}</ul>`:''}
    ${!active.length&&!archived.length?`<p class="smallText">${term||staffListRole?'조건에 맞는 직원·스탭이 없어요.':'등록된 직원·스탭이 없어요.'}</p>`:''}
    ${archived.length?`<details class="wd58-note" ${term||archived.some(person=>person.id===selected)?'open':''}><summary>보관된 인원 ${archived.length}명</summary>
      <ul class="wd107-staff-list">${rows(archived)}</ul></details>`:''}`;
}

function bindStaffRoster(roster,markup,bindRows){
  const search=$('staffRosterSearch'),role=$('staffRoleFilter'),order=$('staffListOrder');
  const refresh=()=>{
    roster.innerHTML=markup();
    roster.scrollTop=0;
    bindRows();
  };
  search.oninput=()=>{staffListQuery=search.value;refresh();};
  role.onchange=()=>{staffListRole=role.value;refresh();};
  order.onchange=()=>{
    if(roster.id==='driveReportStaff')reportStaffListOrder=order.value;
    else staffListOrder=order.value;
    refresh();
  };
  bindRows();
}

async function storePayslip(profile,month,input){
  const file=input.files?.[0];
  if(!file||currentUser!=='manager'||profile.archivedAt)return false;
  activeMaterialUploads++;
  try{
    await saveStaffRecord(profile,'payslip',month,await staffRecordPayload(file));
    notify('급여명세서를 등록했어요.');
    return true;
  }catch(error){notify(error.message);return false;}
  finally{activeMaterialUploads--;input.value='';}
}

async function openPayslip(profile,month){
  const file=staffPayslip(profile,month),dialog=$('staffPayslipDialog');
  if(!file||!dialog||dialog.open||currentUser!=='manager')return;
  const body=$('staffPayslipContent');
  body.innerHTML='<p class="smallText">파일을 불러오는 중입니다.</p>';
  let url;
  dialog.onclose=()=>{if(url)URL.revokeObjectURL(url);body.innerHTML='';};
  dialog.showModal();
  const download=$('downloadPayslip');
  download.onclick=()=>downloadStaffFile(file);
  if(!profile.archivedAt){
    const input=$('replacePayslipFile'),replace=$('replacePayslip'),remove=$('deletePayslip');
    replace.onclick=()=>input.click();
    input.onchange=async()=>{
      replace.disabled=remove.disabled=true;
      const saved=await storePayslip(profile,month,input);
      if(saved&&$('staffPayslipDialog')===dialog){
        dialog.close();render();openPayslip(profile,month);
      }else{replace.disabled=remove.disabled=false;}
    };
    remove.onclick=async()=>{
      if(remove.disabled||!window.confirm('이 달의 명세서를 삭제할까요?'))return;
      replace.disabled=remove.disabled=true;activeMaterialUploads++;
      try{
        await saveStaffRecord(profile,'payslip',month,{file_name:null,mime:null,file_data:null});
        if(dialog.isConnected){dialog.close();render();}
        notify('명세서를 삭제했어요.');
      }catch(error){notify(error.message);}
      finally{activeMaterialUploads--;replace.disabled=remove.disabled=false;}
    };
  }
  try{
    const blob=await staffFileBlob(file);
    if(!dialog.open||$('staffPayslipDialog')!==dialog)return;
    if(!blob){body.textContent='저장된 파일을 찾을 수 없습니다.';return;}
    const type=file.type||blob.type;
    if(type==='application/pdf'||/^image\/(?:png|jpeg|webp|gif|bmp|avif)$/.test(type)){
      if(type==='application/pdf'&&await blob.slice(0,5).text()!=='%PDF-'){
        if(dialog.open)body.textContent='PDF 파일 형식을 확인할 수 없습니다. 다운로드하여 확인해 주세요.';
        return;
      }
      if(!dialog.open||$('staffPayslipDialog')!==dialog)return;
      url=URL.createObjectURL(new Blob([blob],{type}));
      body.innerHTML=type==='application/pdf'? `<iframe class="wd67-payslip-pdf" src="${url}" title="급여명세서"></iframe>`:
        `<img class="wd67-payslip-img" src="${url}" alt="급여명세서">`;
    }else{body.textContent='다운로드하여 파일 내용을 확인할 수 있습니다.';}
  }catch(e){if(dialog.open)body.textContent='파일을 열 수 없습니다.';}
}

function bindStaffPayroll(profile,month){
  const input=$('payslipFile'),upload=$('uploadPayslip'),view=$('viewPayslip'),deposit=$('toggleDeposit');
  if(view)view.onclick=()=>openPayslip(profile,month);
  if(upload){
    upload.onclick=()=>input.click();
    input.onchange=async()=>{
      upload.disabled=true;
      const saved=await storePayslip(profile,month,input);
      upload.disabled=false;
      if(saved&&$('payslipFile')===input)render();
    };
  }
  if(deposit)deposit.onclick=async()=>{
    const paid=!staffDeposit(profile,month);
    if(!window.confirm(paid?'이 달의 입금을 확인 완료로 기록할까요?':'입금 확인 완료를 취소할까요?'))return;
    deposit.disabled=true;activeMaterialUploads++;
    try{
      const confirmed_at=paid?new Date().toISOString():null;
      await saveStaffRecord(profile,'deposit',month,{confirmed_at});
      if(!deposit.isConnected)return;
      deposit.setAttribute('aria-pressed',String(paid));
      deposit.textContent=paid?'입금 확인 완료':'입금 확인';
      const date=$('staffDepositDate');
      date.hidden=!paid;
      date.textContent=paid?'입금 확인일 '+payrollDepositDate({confirmed_at}):'';
    }catch(error){notify(error.message);}
    finally{activeMaterialUploads--;deposit.disabled=false;}
  };
}

function staffWorkTable(rows,empty='이 달의 근무기록이 없습니다.'){
  const clock=timestamp=>timestamp&&Number.isFinite(new Date(timestamp).getTime())?esc(clockLabel(timeOnly(timestamp))):'—';
  return `<div class="wd60-inner-scroll" tabindex="0" role="region" aria-label="근무내역 스크롤"><table class="wd60-detail-table" aria-label="일별 근무내역"><thead><tr><th scope="col">근무일</th><th scope="col">출근</th><th scope="col">퇴근</th><th scope="col">근무시간</th></tr></thead>
    <tbody>${rows.length?rows.map(row=>{
      const minutes=workMinutes(row);
      return `<tr><td>${esc(attendanceDate(row.day))}</td><td>${clock(row.inAt)}</td><td>${clock(row.outAt)}</td><td>${minutes===null?'미확정':minutesLabel(minutes)}</td></tr>`;
    }).join(''):`<tr><td colspan="4">${esc(empty)}</td></tr>`}</tbody></table></div>`;
}

function bindStaffWorkMonth(profile,month){
  const login=payrollEmployeeLogin(profile),status=$('staffWorkStatus');
  const reload=$('reloadStaffWork'),body=$('staffWorkRows'),total=$('staffWorkTotal');
  if(!login||!status||!reload||!body||!total)return;
  const current=()=>status.isConnected&&currentUser==='manager'&&S.nav==='staff'&&
    managerStaffId===profile.id&&staffSummaryMonth===month;
  const load=async()=>{
    reload.disabled=true;
    const local=staffMonthRecords(profile,month);
    status.textContent='본진 근무기록을 불러오는 중이에요.';
    try{
      const remote=await readManagerWorkMonth(login,month,true);
      if(!current())return;
      const rows=mergeStaffWorkMonth(local,remote);
      body.innerHTML=staffWorkTable(rows);
      total.textContent='총 '+staffWorkTotal(rows);
      status.textContent=remote.length?'본진 근무기록을 불러왔어요.':
        local.length?'본진 기록이 없어 이 브라우저의 기록을 표시합니다.':'이 달의 본진 근무기록이 없어요.';
      reload.hidden=false;
    }catch(error){
      if(!current())return;
      body.innerHTML=staffWorkTable(local,'본진 근무기록을 확인하지 못했어요.');
      total.textContent=local.length?'브라우저 기록 '+staffWorkTotal(local):'집계 미확인';
      status.textContent=error.message||'본진 근무기록을 불러오지 못했어요.';
      reload.hidden=false;
    }finally{reload.disabled=false;}
  };
  reload.onclick=()=>void load();
  void load();
}

function bindStaffMonthlyReports(profile,month){
  const list=$('staffReportRows'),total=$('staffReportTotal'),status=$('staffReportStatus');
  const dialog=$('staffReportDialog'),documentBody=$('staffReportDocument');
  const active=()=>currentUser==='manager'&&$('staffReportRows')===list;
  const local=localWorkReportRows().filter(row=>row.staffId===profile.id&&row.date.startsWith(month+'-'));
  let opened=0;
  const getSession=async()=>{
    const session=managerDriveSession?.expires>Date.now()?managerDriveSession:await restoreCompanyDriveSession();
    if(active()&&session)managerDriveSession=session;
    return session;
  };
  const openReport=async row=>{
    const request=++opened;
    $('staffReportDialogTitle').textContent=attendanceDate(row.date)+' 업무보고';
    if(row.report){
      documentBody.innerHTML=reportDocument(row.owner,row.report);
      documentBody.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>downloadFile(button.dataset.download));
      dialog.showModal();
      documentBody.scrollTop=0;
      return;
    }
    documentBody.innerHTML=`<h4>${esc(row.name)}</h4><div class="wd122-report-body">본문을 불러오는 중이에요.</div>`;
    const body=documentBody.lastElementChild;
    dialog.showModal();
    documentBody.scrollTop=0;
    try{
      const session=await getSession();
      if(!session)throw Object.assign(new Error(),{status:401});
      const text=await readDriveReportBody(row,session.token);
      if(active()&&dialog.open&&request===opened)body.textContent=text||'저장된 본문이 없어요.';
    }catch(error){
      if(active()&&dialog.open&&request===opened)body.textContent=error.status===401?'업무센터 Drive 연결을 갱신해 주세요.':
        error.status===403?'이 업무보고를 읽을 권한이 없어요.':error.message||'업무보고 본문을 불러오지 못했어요.';
    }
  };
  const paint=(rows,message='')=>{
    const focusedId=list.contains(document.activeElement)?document.activeElement.dataset.staffReport:null;
    rows.sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name,'ko'));
    total.textContent=rows.length||!message?'총 '+rows.length+'건':'';
    status.textContent=message;
    status.hidden=!message;
    list.innerHTML=rows.map(row=>`<tr><td><time datetime="${esc(row.date)}">${esc(attendanceDate(row.date))}</time></td>
      <td><button type="button" class="wd125-staff-report" data-staff-report="${esc(row.id)}" aria-haspopup="dialog">${esc(row.name)}</button></td></tr>`).join('')||
      (message?'':'<tr><td colspan="2">이 달에 제출한 업무보고가 없어요.</td></tr>');
    const byId=new Map(rows.map(row=>[row.id,row]));
    list.querySelectorAll('[data-staff-report]').forEach(button=>{
      button.onclick=()=>void openReport(byId.get(button.dataset.staffReport));
      if(button.dataset.staffReport===focusedId)button.focus({preventScroll:true});
    });
  };
  const linked=!!staffWorkDriveFolders(profile);
  paint(local,linked?'업무보고를 불러오는 중이에요.':'');
  if(!linked)return;
  void (async()=>{
    try{
      const session=await getSession();
      if(!active())return;
      if(!session)throw Object.assign(new Error(),{status:401});
      const {rows}=await readCompanyDriveReports(session.token,profile.id);
      if(active())paint(mergeWorkReportRows(local,rows.filter(row=>row.date.startsWith(month+'-'))));
    }catch(error){
      if(active())paint(local,error.status===401?'업무센터 Drive 연결을 갱신해 주세요.':
        error.status===403?'업무보고 폴더를 읽을 권한이 없어요.':'Drive 업무보고를 불러오지 못했어요.');
    }
  })();
}

function bindStaffManagement(){
  $('addStaff').onclick=()=>{managerStaffId=null;staffDetailOpen=true;editingStaff=true;render();$('staffName').focus();};
  const roster=$('staffRosterList');
  const bindRoster=()=>{
    roster.querySelectorAll('[data-staff-profile]').forEach(button=>button.onclick=()=>{
      const scroll=roster.scrollTop;
      managerStaffId=button.dataset.staffProfile;staffDetailOpen=true;editingStaff=false;render();
      $('staffRosterList').scrollTop=scroll;
      Array.from(document.querySelectorAll('[data-staff-profile]')).find(item=>item.dataset.staffProfile===managerStaffId)?.focus({preventScroll:true});
    });
    roster.querySelectorAll('[data-delete-staff]').forEach(button=>button.onclick=()=>{
      const profile=staffById(button.dataset.deleteStaff);
      if(!profile||profile.archivedAt||!window.confirm(profile.name+' 스탭을 삭제할까요? 로그인은 중지되고 업무와 근무내역은 보관됩니다.'))return;
      if(managerCloudGrants.get(profile.id)?.enabled)return notify('권한 관리에서 본진 계정 사용을 먼저 해제해 주세요.');
      const {pin,pinCipher}=profile;
      profile.archivedAt=now();delete profile.pin;delete profile.pinCipher;
      try{save()}catch(e){delete profile.archivedAt;profile.pin=pin;profile.pinCipher=pinCipher;return notify('스탭 정보를 저장하지 못했습니다.');}
      if(managerStaffId===profile.id)editingStaff=false;
      render();notify('스탭을 삭제했습니다');
    });
    roster.querySelectorAll('[data-hide-staff]').forEach(button=>button.onclick=()=>{
      const removed=staffById(button.dataset.hideStaff);
      if(!removed?.archivedAt||!window.confirm(removed.name+' 님을 삭제된 스탭 목록에서 제거할까요? 근무와 업무 기록은 보관됩니다.'))return;
      removed.hiddenAt=now();
      try{save()}catch(e){delete removed.hiddenAt;return notify('목록에서 제거하지 못했습니다.');}
      if(managerStaffId===removed.id){managerStaffId=null;staffDetailOpen=false;}
      render();notify('삭제된 스탭 목록에서 제거했습니다');
    });
  };
  bindStaffRoster(roster,()=>staffRosterMarkup(S.staffProfiles.filter(person=>!person.hiddenAt),staffDetailOpen?managerStaffId:null,'profile'),bindRoster);
  const profile=staffById(managerStaffId);
  bindStaffPrivateValues(profile);bindStaffContracts(profile);

    if(!profile)bindNewStaffPermissions(form);
    const grant=managerCloudGrants.get(profile?.id);
    let draftStaffKey;
    form.onsubmit=async event=>{
      event.preventDefault();
      const button=$('saveStaffProfile'),pin=$('staffPin').value,role=$('staffWorkType').value;
      if(button.disabled||!['employee','staff'].includes(role))return;
      const fields={
        name:$('staffName').value.trim(),memo:$('staffMemo').value,role:$('staffRole').value.trim(),workType:role==='staff'?'staff':'employee',
        accessRole:role==='staff'?'staff':profile?.accessRole==='managed'?'managed':'general',
        joinedOn:$('staffJoined').value,leftOn:$('staffLeft').value,contact:$('staffContact').value.trim(),
        bank:$('staffBank').value,account:$('staffAccount').value.trim()
      };

      if(!fields.name)return notify('이름을 입력하세요');
      if(fields.joinedOn&&fields.leftOn&&fields.leftOn<fields.joinedOn)return notify('퇴사일을 입사일 이후로 입력하세요');
      if((pin||!profile?.pin&&!grant)&&!/^\d{6}$/.test(pin))return notify('숫자 6자리 비밀번호를 입력하세요');
      if(pin&&!managerStaffPinKey&&S.pins.manager){
        unlockStaffPins(button,()=>{if(form.isConnected)form.requestSubmit(button);});
        return;
      }
      button.disabled=true;
      let remoteSaved=false;
      try{
        const digest=pin?await sha(pin):profile?.pin;
        if(currentUser!=='manager'||$('staffProfileForm')!==form)return;
        if(digest&&(S.pins.manager===digest||S.staffProfiles.some(p=>p.id!==(profile?.id||draftStaffKey)&&!p.archivedAt&&p.pin===digest)))return notify('이미 사용 중인 비밀번호입니다. 다른 숫자 6자리를 입력하세요');
        const pinCipher=pin?(managerStaffPinKey?await encryptStaffPin(pin):undefined):profile?.pinCipher;
        if(currentUser!=='manager'||$('staffProfileForm')!==form)return;
        const next={...profile,...fields,...permissions,id:profile?.id||(draftStaffKey??='staff_'+crypto.randomUUID()),pin:digest,pinCipher};
        if(profile&&staffAccessRole(next)!==staffAccessRole(profile)){
          next.visibleMenus=profileMenus(profile);
          next.libraryPermissions=Object.fromEntries(libraryPermissionMenus.map(([menu])=>[menu,libraryPreferences(profile,menu)]));
        }
        if(grant&&(next.name!==profile.name||staffAccessRole(next)!==staffAccessRole(profile))){
          await saveWorkCenterGrant(next,grant.login_id,grant.google_email,grant.enabled);remoteSaved=true;
        }
        if(currentUser!=='manager'||$('staffProfileForm')!==form)return;
        persistStaffProfile(next,remoteSaved);
        managerStaffId=next.id;editingStaff=false;render();notify('직원·스탭 정보를 저장했어요.');
      }catch(error){notify(remoteSaved?'본진 정보를 저장했어요. 브라우저 저장을 다시 확인해 주세요.':error.message||'직원 정보를 저장하지 못했어요.');}
      finally{button.disabled=false;}
    };
  }
  const picker=$('staffMonth');
  if(!picker)return;

  bindStaffMonthlyReports(profile,staffSummaryMonth);
}

function directInstructionPlan(raw){
  if(!raw.trim())return null;
  const named=raw.match(/^[ \t]*(?:업무명|업무 제목)[ \t]*[:：][ \t]*(.+)$/m)?.[1];
  const firstLine=raw.trim().split(/\r?\n/)[0];
  const goal=(named||firstLine).trim();
  return {goal:goal.length>64?goal.slice(0,63)+'…':goal,items:[{text:raw}]};
}

async function verifyInstructionDocument(task,folder,token){
  if(!safeDriveId(task.instructionDriveId))throw new Error('연결된 업무지시 문서를 확인해 주세요.');
  const query='?supportsAllDrives=true&fields=id,parents,appProperties,trashed';
  const file=await (await employeeDriveRequest(driveFileApi+'/'+task.instructionDriveId+query,token)).json();
  if(file.id!==task.instructionDriveId||file.trashed||!file.parents?.includes(folder)||file.appProperties?.wdInstructionRequest!==task.id)
    throw new Error('이 업무지시와 연결된 Drive 문서를 확인해 주세요.');
  return file;
}

}

async function findUnlinkedInstructionCopies(files,tasks,token){
  const available=tasks.filter(task=>!task.instructionDriveId&&!task.dailyJournal&&validAttendanceDay(task.date));
  const comparable=text=>text.replace(/\r\n/g,'\n').trimEnd();
  const pairs=await Promise.all(files.filter(file=>file.mimeType==='application/vnd.google-apps.document'&&
    !file.appProperties?.wdInstructionRequest&&file.appProperties?.wdInstructionState!=='cancelled').map(async file=>{
    const candidates=available.filter(task=>instructionDriveName(task)===file.name);
    if(!candidates.length)return null;
    const text=comparable(await readDriveReportBody(file,token));
    if(!text)return null;
    const matching=candidates.filter(task=>comparable(instructionTaskText(task))===text);
    return matching.length===1?[file.id,matching[0].id]:null;
  }));
  return new Map(pairs.filter(Boolean));
}

async function storeInstructionDocument(task,profile,original){
  const folder=staffWorkDriveFolders(profile)?.instruction;
  if(!folder||!safeDriveId(task.id)||!task.instructionSender?.name||!validAttendanceDay(task.date))
    throw new Error('업무지시를 저장할 Drive 경로와 지시자를 확인해 주세요.');
  const session=instructionDriveSession();
  if(task.instructionDriveId)await verifyInstructionDocument(task,folder,session.token);
  const text=instructionTaskText(task);
  if(!text.trim())throw new Error('업무지시 내용을 확인해 주세요.');
  const name=instructionDriveName(task);
  const requestFilter=" and appProperties has { key='wdInstructionRequest' and value='"+task.id+"' }";
  const matches=task.instructionDriveId?[]:await readAllEmployeeDriveFiles(folder,session.token,requestFilter,'id,name,appProperties');
  let previous=task.instructionDriveId||matches.find(file=>file.appProperties?.wdInstructionState!=='cancelled')?.id;
  if(!previous&&original){
    const attached=new Set(tasksForStaff(profile.id).map(row=>row.instructionDriveId));
    const files=await employeeDriveInstructionFiles(original.date,session.token);
    const copies=await findUnlinkedInstructionCopies(files.filter(file=>!attached.has(file.id)),tasksForStaff(profile.id),session.token);
    const matchingIds=[...copies].filter(([,taskId])=>taskId===task.id).map(([fileId])=>fileId);
    if(matchingIds.length>1)throw new Error('같은 업무지시 문서가 Drive에 여러 개 있어요. 연결할 원본을 확인해 주세요.');
    previous=matchingIds[0];
  }
  if(previous&&!safeDriveId(previous))throw new Error('연결된 업무지시 문서를 확인해 주세요.');
  const metadata={name,mimeType:'application/vnd.google-apps.document',...(!previous?{parents:[folder]}:{}),
    appProperties:{wdInstructionRequest:task.id}};
  const result=await writeInstructionFile(folder,session.token,previous,metadata,text);
  return {...task,instructionDriveId:result.id,instructionDriveName:result.name};
}

async function writeInstructionFile(folder,token,previous,metadata,text,kind='업무지시',mediaType='text/plain; charset=UTF-8'){
  const boundary='wd_instruction_'+crypto.randomUUID();
  const body=new Blob([
    '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n',
    '--'+boundary+'\r\nContent-Type: '+mediaType+'\r\n\r\n',text,'\r\n--'+boundary+'--\r\n'
  ]);
  const response=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(previous?'/'+previous:'')+
    '?uploadType=multipart&supportsAllDrives=true&fields=id,name,parents',{
    method:previous?'PATCH':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},
    body,signal:AbortSignal.timeout(45000)
  });
  const result=await response.json().catch(()=>null);
  if(response.status===401)expireWorkCenterDrive(token);
  if(!response.ok||!safeDriveId(result?.id)||result.name!==metadata.name||!result.parents?.includes(folder)||previous&&result.id!==previous){
    if(response.status===403&&kind.startsWith('업무보고'))throw new Error('Drive 업무보고 폴더에 파일을 저장할 권한을 확인해 주세요.');
    throw new Error('Drive '+kind+' 저장을 확인하지 못했어요. 연결을 확인하고 다시 시도해 주세요.');
  }
  return result;
}

const dailyInstructionMime='application/vnd.google-apps.document';
const dailyInstructionIndex='wd-instruction-day-v1:';
const dailyInstructionText=text=>String(text??'').replace(/\r\n?/g,'\n');

function dailyInstructionName(profile,date,sender){
  const from=!sender?.name||sender.loginId===managerHqAccount.uid?'대표':sender.name;
  const to=staffWorkDriveFolders(profile)?'수진':profile.name;
  return workDocumentName(date,from,to,'업무지시');
}

async function readDailyInstruction(profile,date,token,sender){
  const folder=staffWorkDriveFolders(profile)?.instruction;
  const name=dailyInstructionName(profile,date,sender);
  const quoted=name.replace(/['\\]/g,value=>'\\'+value);
  const files=await readAllEmployeeDriveFiles(folder,token," and name = '"+quoted+"'",
    'id,name,mimeType,description,appProperties');
  const matching=files.filter(file=>file.name===name&&file.mimeType===dailyInstructionMime);
  if(matching.length>1)throw new Error('같은 이름의 업무지시 문서가 여러 개 있어요. Drive에서 원본을 확인해 주세요.');
  const file=matching[0];
  if(!file||file.appProperties?.wdInstructionState==='cancelled')return {file,entries:[],name,folder};
  const body=dailyInstructionText(await readDriveReportBody(file,token));
  if(!file.description?.startsWith(dailyInstructionIndex)){
    const text=body.replace(/\n$/,'');
    const locals=tasksForStaff(profile.id).filter(task=>task.date===date&&
      dailyInstructionText(instructionTaskText(task)).trimEnd()===text.trimEnd());
    const id=locals.find(task=>task.instructionDriveId===file.id)?.id||
      (locals.length===1?locals[0].id:null)||file.appProperties?.wdInstructionRequest||'drive_'+file.id;
    return {file,entries:text.trim()?[{id,text}]:[],name,folder};
  }
  const index=JSON.parse(file.description.slice(dailyInstructionIndex.length));
  if(!Array.isArray(index)||new Set(index.map(entry=>entry[0])).size!==index.length)
    throw new Error('Drive 업무지시의 목록 정보를 확인하지 못했어요.');
  let offset=0;
  const entries=index.map(([id,length],position)=>{
    if(!safeDriveId(id)||!Number.isSafeInteger(length)||length<1||offset+length>body.length)
      throw new Error('Drive 업무지시 본문과 목록 정보가 달라요.');
    const text=body.slice(offset,offset+length);
    offset+=length;
    if(position<index.length-1){
      if(body.slice(offset,offset+2)!=='\n\n')throw new Error('Drive 업무지시 본문과 목록 정보가 달라요.');
      offset+=2;
    }
    return {id,text};
  });
  if(body.slice(offset).trim())throw new Error('Drive에서 바뀐 업무지시 본문을 확인해 주세요.');
  return {file,entries,name,folder};
}

async function changeDailyInstruction(profile,task,original,remove=false){
  const session=instructionDriveSession();
  const update=async()=>{
    if(currentUser!=='manager'||staffById(profile.id)!==profile||localStorage.getItem(KEY)!==storageVersion)
      throw new Error('업무지시 목록이 변경됐어요. 새로고침해 주세요.');
    const {file,entries,name,folder}=await readDailyInstruction(profile,task.date,session.token,task.instructionSender);
    const before=entries.find(entry=>entry.id===task.id);
    const indexed=!!file?.description?.startsWith(dailyInstructionIndex);
    if(original&&(indexed||original.instructionDaily)&&(!before||
      before.text.trimEnd()!==dailyInstructionText(instructionTaskText(original)).trimEnd()))
      throw new Error('Drive 업무지시가 변경됐어요. 목록을 새로고침해 주세요.');
    const local=indexed?[]:tasksForStaff(profile.id).filter(row=>row.date===task.date&&!row.instructionDaily&&
      (!row.instructionDriveId||row.instructionDriveId===file?.id));
    for(const row of local){
      if(entries.some(entry=>entry.id===row.id))continue;
      const text=dailyInstructionText(instructionTaskText(row));
      if(text.trim())entries.push({id:row.id,text});
    }
    const position=entries.findIndex(entry=>entry.id===task.id);
    if(remove){
      if(position<0)throw new Error('삭제할 업무지시를 확인하지 못했어요.');
      entries.splice(position,1);
    }else{
      const text=dailyInstructionText(instructionTaskText(task));
      if(!text.trim())throw new Error('업무지시 내용을 입력해 주세요.');
      const entry={id:task.id,text};
      if(position<0)entries.push(entry);else entries[position]=entry;
    }
    const metadata={name,mimeType:dailyInstructionMime,...(!file?{parents:[folder]}:{}),
      description:dailyInstructionIndex+JSON.stringify(entries.map(({id,text})=>[id,text.length])),
      appProperties:{wdInstructionDay:task.date,wdInstructionState:entries.length?'active':'cancelled'}};
    const saved=await writeInstructionFile(folder,session.token,file?.id,metadata,entries.map(entry=>entry.text).join('\n\n')||' ');
    return {...task,instructionDaily:true,instructionDriveId:saved.id,instructionDriveName:saved.name};
  };
  const lock=globalThis.navigator?.locks;
  return lock?lock.request('wd-instruction:'+profile.id+':'+task.date,update):update();
}

function dailyInstructionRows(profile,date,daily){
  const rows=tasksForStaff(profile.id).filter(task=>task.date===date);
  const local=new Map(rows.map(task=>[task.id,task]));
  return daily.entries.map(entry=>{
    const source=local.get(entry.id);
    const task={...source,id:entry.id,staffId:profile.id,date,title:daily.name,objective:daily.name,
      simpleInstruction:true,directInstruction:true,instructionDaily:!!daily.file?.description?.startsWith(dailyInstructionIndex),
      instructionDriveId:daily.file?.id,instructionDriveName:daily.name,
      todos:[{id:'todo0',text:entry.text}],reports:source?.reports||[],feedback:source?.feedback||[]};
    return {id:entry.id,date,name:daily.name,staffId:profile.id,staffName:profile.name,task:source&&instructionTaskText(source).trimEnd()===entry.text.trimEnd()?source:task};
  });
}

function openAssignedInstruction(profile,id,pane,onCancel){
  const task=assignedInstruction(profile,id);
  if(!task||$('modalLayer'))return;
  const simple=isEmployeeTask(task),direct=simple&&task.directInstruction;
  const daily=task.instructionDaily||task.date===payrollCalendar.format(new Date());
  const fallback=task.objective||task.title;
  const todos=task.todos?.length?task.todos:simple?[{id:'todo0',text:fallback,done:false}]:taskTodos({...task});
  const editable=todos.map((todo,index)=>({todo,index})).filter(({todo})=>!todo.sourceTask);
  pane.innerHTML=`<form id="editAssignedInstructionForm"><p class="smallText">${esc(profile.name)} · ${esc(task.title)}</p>
    <label for="editAssignedDate">업무일</label><input type="date" id="editAssignedDate" value="${esc(task.date)}" ${daily?'readonly':''} required>
    ${direct?'':`<label for="editAssignedTitle">업무 제목</label><input id="editAssignedTitle" maxlength="240" value="${esc(task.title)}" required>
      <label for="editAssignedGoal">업무 목표</label><textarea id="editAssignedGoal" rows="2">${esc(task.objective||'')}</textarea>`}
    ${editable.map(({todo,index},i)=>`<label for="editAssignedTodo${index}">${simple?'업무지시 내용':'할 일 '+(i+1)}</label>
      <textarea id="editAssignedTodo${index}" rows="${simple?6:3}" maxlength="${direct?50000:8000}" required>${esc(todo.text)}</textarea>
      ${!simple&&todo.workflow?.steps?.length?`<details class="instruction-step"><summary>단계별 업무 가이드</summary>
        ${todo.workflow.steps.map((step,j)=>`<fieldset><legend>${j+1}단계</legend>${instructionStepFields.map(([key,label])=>
          `<label for="editAssignedStep${index}_${j}_${key}">${label}</label><textarea id="editAssignedStep${index}_${j}_${key}" rows="2" required>${esc(step[key]||(key==='method'?step.instruction:''))}</textarea>`).join('')}</fieldset>`).join('')}</details>`:''}`).join('')}
    <div class="actions"><button class="primary" type="submit">수정 저장</button>
      <button type="button" id="cancelEditAssignedInstruction">취소</button></div>
  </form>`;
  const form=$('editAssignedInstructionForm'),submit=form.querySelector('[type="submit"]'),cancel=$('cancelEditAssignedInstruction');
  $('instructionComposeTitle').textContent='업무지시 수정';
  pane.scrollTop=0;
  $('editAssignedDate').focus();
  cancel.onclick=onCancel;
  form.onsubmit=async event=>{
    event.preventDefault();
    if(submit.disabled||assignedInstruction(profile,id)!==task)return;
    const date=daily?task.date:$('editAssignedDate').value;
    if(!validAttendanceDay(date))return notify('업무일을 확인해 주세요.');
    const nextTodos=[...todos];
    for(const {todo,index} of editable){
      const value=$('editAssignedTodo'+index).value;
      const text=direct?value:value.trim();
      if(!text.trim())return notify('업무지시 내용을 입력해 주세요.');
      const next={...todo,text};
      if(!simple&&todo.workflow?.steps?.length){
        const steps=todo.workflow.steps.map((step,j)=>{
          const values=Object.fromEntries(instructionStepFields.map(([key])=>[key,$('editAssignedStep'+index+'_'+j+'_'+key).value.trim()]));
          return {...step,...values,instruction:values.method};
        });
        if(steps.some(step=>instructionStepFields.some(([key])=>!step[key])))return notify('단계별 가이드의 빈 칸을 확인해 주세요.');
        next.workflow={...todo.workflow,steps};
      }
      nextTodos[index]=next;
    }
    const title=direct?(daily?dailyInstructionName(profile,date,task.instructionSender):
      directInstructionPlan(nextTodos[editable[0]?.index]?.text||'')?.goal):$('editAssignedTitle').value.trim();
    if(!title)return notify('업무 제목을 입력해 주세요.');
    const draft={...task,date,title,objective:direct?title:$('editAssignedGoal').value.trim(),todos:nextTodos};
    submit.disabled=true;cancel.disabled=true;
    form.setAttribute('aria-busy','true');
    try{
      const linked=!!task.instructionDriveId||!!staffWorkDriveFolders(profile);
      if(linked&&!draft.instructionSender?.name)
        draft.instructionSender=instructionSenderFor(managerWorkIdentity)||await resolveInstructionSender();
      if(assignedInstruction(profile,id)!==task)return;
      if(localStorage.getItem(KEY)!==storageVersion)throw new Error('다른 창에서 자료가 변경됐어요. 새로고침 뒤 다시 시도해 주세요.');
      const updated=linked?(daily?await changeDailyInstruction(profile,draft,task):await storeInstructionDocument(draft,profile,task)):draft;

function instructionDocument(text){
  const lines=String(text||'').split(/\r?\n/);
  const sections=/^(?:업무 목적|상세 지시|완료 기준|관련 파일|참고사항|확인 사항|업무 내용)$/;
  const inline=value=>{
    const links=/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>]+)/g;
    let result='',offset=0;
    for(const match of value.matchAll(links)){
      result+=esc(value.slice(offset,match.index));
      const url=match[2]||match[3];
      result+=`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(match[1]||url)}</a>`;
      offset=match.index+match[0].length;
    }
    return result+esc(value.slice(offset));
  };
  return `<div class="wd124-instruction-doc">${lines.map((line,index)=>{
    const raw=line.trim();
    if(!raw)return '<div class="wd124-doc-gap" aria-hidden="true"></div>';
    const heading=/^#{1,6}\s+(.+)$/.exec(raw);
    const label=raw.replace(/^\*\*(.+)\*\*$/,'$1');
    const numbered=/^(\d+)(?:\\?[.)])\s+(.+)$/.exec(raw);
    if(heading||sections.test(label)||index===0&&lines.some((line,i)=>i>0&&line.trim())&&!numbered)
      return `<h4>${inline(heading?.[1]||label)}</h4>`;
    if(numbered)return `<div class="wd124-doc-item"><b>${esc(numbered[1])}.</b><span>${inline(numbered[2])}</span></div>`;
    return `<div class="wd124-doc-line">${inline(line)}</div>`;
  }).join('')}</div>`;
}

function instructionTaskText(task){
  if(task.directInstruction)return task.todos?.[0]?.text||task.objective||task.title||'';
  return [task.title,task.objective&&task.objective!==task.title?task.objective:'',
    ...(task.todos||[]).map((todo,i)=>(i+1)+'. '+todo.text)].filter(Boolean).join('\n\n');
}

function bindInstructionHistory(profile,root){
  const output=$('instructionHistoryRows'),pane=$('instructionDocumentBody');
  const form=$('simpleInstructionForm'),heading=$('instructionComposeTitle'),today=payrollCalendar.format(new Date());
  const session=staffWorkDriveFolders(profile)?managerDriveSession:null;
  let archivePending=!!session,archive=[],todayRows=null,todayIndexed=false;
  managerDailyTasks=[];
  instructionDay=instructionDay||today;
  const days=new Map();
  const editing=()=>!!$('editAssignedInstructionForm');
  const saving=()=>$('assignInstruction').disabled||pane.querySelector('form[aria-busy="true"]');
  const select=(day,{focus=false,preserveScroll=false}={})=>{
    instructionDay=day;
    output.querySelectorAll('[data-instruction-day]').forEach(button=>{
      button.setAttribute('aria-pressed',String(button.dataset.instructionDay===day));
    });
    const scroll=preserveScroll?pane.scrollTop:0;
    form.hidden=day!==today;
    heading.textContent=attendanceDate(day,true)+' 업무지시';
    const rows=days.get(day);
    if(rows?.length)void showInstructionDocuments(pane,rows,profile,()=>select(day,{focus:true}));
    else pane.innerHTML=`<p class="empty">${archivePending?'업무지시를 불러오는 중이에요.':'등록된 업무지시가 없어요.'}</p>`;
    pane.scrollTop=scroll;
    if(focus)(day===today?$('instructionInput'):pane).focus();
  };
  const paint=()=>{
    const current=instructionRows(profile.id).filter(row=>!todayRows||row.date!==today||
      !todayIndexed&&!row.task.instructionDaily&&!todayRows.some(saved=>saved.id===row.id));
    const rows=[...current,...archive.filter(row=>!todayRows||row.date!==today||!todayRows.some(saved=>saved.task.instructionDriveId===row.id)),...(todayRows||[])]
      .sort((a,b)=>b.date.localeCompare(a.date));
    days.clear();
    for(const date of [...new Set([today,...rows.map(row=>row.date)])].sort().reverse())days.set(date,[]);
    rows.forEach(row=>{
      days.get(row.date).push(row);
    });
    output.innerHTML=[...days.keys()].map(day=>`<button type="button" class="wd133-instruction-row"
      data-instruction-day="${esc(day)}" aria-pressed="${day===instructionDay}" aria-controls="instructionDocumentBody"><time datetime="${esc(day)}">${esc(attendanceDate(day,true))}</time></button>`).join('')||
      '<p class="empty">등록된 업무지시가 없어요.</p>';
    output.querySelectorAll('[data-instruction-day]').forEach(button=>button.onclick=()=>{
      if(!saving())select(button.dataset.instructionDay,{focus:true});
    });
    if(!editing())select(instructionDay,{preserveScroll:true});
  };
  paint();
  if(!session)return;
  void Promise.allSettled([readLegacyInstructionRows(session.token),readDailyInstruction(profile,today,session.token)]).then(([previous,daily])=>{
    if($('simpleInstructionHistory')!==root)return;
    archivePending=false;
    if(previous.status==='fulfilled')archive=previous.value.filter(row=>row.staffId===profile.id);
    if(daily.status==='fulfilled'&&daily.value.file){
      todayIndexed=!!daily.value.file.description?.startsWith(dailyInstructionIndex);
      todayRows=dailyInstructionRows(profile,today,daily.value);
      managerDailyTasks=todayRows.map(row=>row.task);
      archive=archive.filter(row=>row.id!==daily.value.file.id);
    }
    paint();
    if(daily.status==='rejected')throw daily.reason;
    if(previous.status==='rejected')throw previous.reason;
  }).catch(()=>{
    if($('simpleInstructionHistory')!==root)return;
    archivePending=false;
    if(!days.get(instructionDay)?.length&&!editing())select(instructionDay);
    const status=$('instructionHistoryStatus');
    status.textContent='이전 문서를 불러오지 못했어요.';
    status.hidden=false;
  });
}

function extractLinks(s){return s.split(/\n/).map(s=>s.trim()).filter(s=>/^https?:\/\/[^\s]+$/i.test(s))}
function showModal(html,heading='업무지시·가이드 편집'){let layer=document.createElement('div');layer.className='modalBackdrop';layer.id='modalLayer';layer.innerHTML=`<div class="modal"><div class="row" style="justify-content:space-between"><h2>${esc(heading)}</h2><button class="small" id="closeModal">닫기 ✕</button></div>${html}</div>`;document.body.append(layer);$('closeModal').onclick=()=>layer.remove();layer.onclick=e=>{if(e.target===layer)layer.remove()}}
function taskEditor(t){let isNew=!t;let x=t||{date:'2026-11-30',title:'',objective:'',guide:'',deliverable:'',references:[]};showModal(`<label>업무 날짜</label><input type="date" id="edDate" value="${esc(x.date)}"><label>업무 제목</label><input id="edTitle" value="${esc(x.title)}"><label>오늘의 목표</label><textarea id="edObjective">${esc(x.objective)}</textarea><label>오늘 할 일 (한 줄에 하나 · 보통 3~5개)</label><textarea id="edTodos">${taskTodos(x).filter(v=>!v.sourceTask).map(v=>v.text).join('\n')}</textarea><label>업무가이드북</label><textarea id="edGuide">${esc(x.guide)}</textarea><div class="divider"></div><h3>참고 홈페이지 · 참고 시안</h3><div class="smallText">자료마다 유형·제목·링크·설명을 지정하세요. 줄마다 하나씩, | 로 구분합니다.<br>예: 참고 홈페이지 | WD WAVE | https://example.com | 회사 서비스 확인</div><textarea id="edRefs" rows="5">${(x.references||[]).map(r=>[r.type,r.name,r.url,r.note].join(' | ')).join('\n')}</textarea><div class="actions"><button class="primary" id="saveTask">${isNew?'업무 추가':'업무 수정 저장'}</button>${!isNew?'<button id="duplicateTask">이 업무 복제</button>':''}</div>`);$('saveTask').onclick=()=>{let title=$('edTitle').value.trim();if(!title)return notify('업무 제목을 입력하세요');let refs=$('edRefs').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{let [type,name,url,note]=s.split('|').map(v=>(v||'').trim());return{type,name,url,note}});let values={date:$('edDate').value,title,objective:$('edObjective').value,guide:$('edGuide').value,todos:mergeTodos(x,$('edTodos').value),references:refs};if(isNew){let task={...values,staffId:managerStaffId||'mina',id:'task'+Date.now(),ack:null,work:{},reports:[],feedback:[]};S.tasks.push(task);S.selected=task.id}else Object.assign(t,values);allReportTasks().forEach(syncFeedbackTodos);save();$('modalLayer').remove();render();notify('업무를 저장했습니다')};if(!isNew)$('duplicateTask').onclick=()=>{let obj={...t,id:'task'+Date.now(),ack:null,work:{},reports:[],feedback:[],workUnits:{},activeUnit:null,startedAt:null,showOverview:false,todos:taskTodos(t).filter(x=>!x.sourceTask).map((x,i)=>({id:'copy'+Date.now()+'_'+i,text:x.text,done:false})),title:t.title+' (새 업무)'};S.tasks.push(obj);S.selected=obj.id;save();$('modalLayer').remove();render();notify('새 업무로 복제했습니다')}}
function openDB(){return new Promise((ok,bad)=>{let q=indexedDB.open(IDB,1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)})}
async function uploadFiles(id){let files=Array.from($(id)?.files||[]),result=[];if(!files.length)return result;try{let db=await openDB();for(let file of files){if(file.size>25*1024*1024){notify('25MB 초과 파일은 제외했습니다: '+file.name);continue}let fid='file'+Date.now()+'_'+Math.random().toString(36).slice(2);await new Promise((ok,bad)=>{let q=db.transaction('files','readwrite').objectStore('files').put({id:fid,blob:file,name:file.name,type:file.type});q.onsuccess=ok;q.onerror=()=>bad(q.error)});result.push({id:fid,name:file.name,size:file.size})}db.close()}catch(e){notify('브라우저 파일 저장에 실패했습니다. 첨부를 확인하세요')}return result}
async function downloadFile(id){try{let db=await openDB(),row=await new Promise((ok,bad)=>{let q=db.transaction('files','readonly').objectStore('files').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)});db.close();if(!row)return notify('저장된 첨부파일을 찾을 수 없습니다');let u=URL.createObjectURL(row.blob),a=document.createElement('a');a.href=u;a.download=row.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){notify('파일을 열 수 없습니다')}}
render();
</script></body></html>
