    return Array.isArray(cards)?[...new Set(cards.filter(name=>typeof name==='string').map(name=>name.trim()).filter(name=>name&&name.length<=60))]:[];
  }catch{return [];}
}

const officeCalendarTypes=[
  {kind:'subscription',tab:'구독',label:'구독'},
  {kind:'income',tab:'수입',label:'수입'},
  {kind:'expense',tab:'지출',label:'지출'}
];

function officeBillingInterval(value){
  const cycle=String(value||'').toLowerCase().replace(/\s/g,'');
  if(['매월','매달','월간','월별','월','월결제','월정기','월정기결제','매월결제','monthly','1개월','1개월마다'].includes(cycle))return 1;
  if(['매년','매해','연간','연','연결제','연정기','연정기결제','매년결제','annual','annually','yearly','1년','1년마다','12개월','12개월마다'].includes(cycle))return 12;
  return 0;
}

function officeSubscriptionDate(row,month){
  const anchor=row.next_payment_date;
  if(row.is_used===false||!anchor||!validAttendanceDay(anchor))return '';
  const anchorMonth=anchor.slice(0,7);
  if(month===anchorMonth)return anchor;
  const interval=officeBillingInterval(row.billing_cycle);
  if(!interval||month<anchorMonth)return '';
  const [year,number]=month.split('-').map(Number);
  const [anchorYear,anchorNumber]=anchorMonth.split('-').map(Number);
  if(((year-anchorYear)*12+number-anchorNumber)%interval)return '';
  const billingDay=Number(row.billing_day)||Number(anchor.slice(8));
  return month+'-'+String(Math.min(billingDay,new Date(year,number,0).getDate())).padStart(2,'0');
}

function officeDashboardEvents(groups,month){
  return officeCalendarTypes.flatMap(({kind,tab},order)=>groups[officeLedgerTabs.indexOf(tab)].flatMap(row=>{
    const date=tab==='구독'?officeSubscriptionDate(row,month):officeRowDate(row,tab);
    if(date?.slice(0,7)!==month)return [];
    return [{tab,row,date,kind,order,label:tab==='구독'?'구독 예정':row.actual_date?tab:tab+' 예정'}];
  })).sort((a,b)=>a.date.localeCompare(b.date)||a.order-b.order||
    String(officeRecordName(a.row,a.tab)).localeCompare(String(officeRecordName(b.row,b.tab)),'ko'));
}

    <strong>${officeMoney(row.amount)}</strong></li>`).join('')}</ul>`:`<p class="empty">${empty}</p>`;

function officeCalendarGrid(events,month,day,types,label){
  const {days,leading,trailing}=monthCalendarDates(month);
  const byDay=new Map(days.map(date=>[date,[]]));
  for(const event of events)byDay.get(event.date)?.push(event);
  return `<div class="office-month-grid" aria-label="${esc(staffMonthLabel(month))} ${label}">
        ${[...'월화수목금토일'].map(label=>`<span class="office-weekday">${label}</span>`).join('')}
        ${'<span aria-hidden="true"></span>'.repeat(leading)}
        ${days.map(date=>{
          const entries=byDay.get(date);
          const markers=types.map(({kind,label})=>({kind,label,entries:entries.filter(event=>event.kind===kind)}))
            .filter(group=>group.entries.length);
          const dateLabel=[attendanceDate(date),...markers.map(group=>group.label+' '+group.entries.length+'건')].join(' · ');
          return `<button type="button" data-office-day="${date}" aria-pressed="${date===day}" ${date===localDay()?'aria-current="date"':''}
            aria-label="${esc(dateLabel)}"><strong>${Number(date.slice(8))}</strong>
            <span class="office-day-marks" aria-hidden="true">${markers.map(({kind,label,entries})=>`<span data-kind="${kind}">
              <span class="office-day-category">${label}</span><span class="office-day-name">${esc(officeRecordName(entries[0].row,entries[0].tab))}</span>
              ${entries.length>1?`<span class="office-day-count">+${entries.length-1}</span>`:''}</span>`).join('')}</span>
          </button>`;
        }).join('')}
        ${'<span aria-hidden="true"></span>'.repeat(trailing)}
      </div>`;
}

async function officeOverviewData(month){
  const week=weeklyDays(localDay());
  const months=[...new Set([month,week[0].slice(0,7),week.at(-1).slice(0,7)])];
  const subscriptions=officeLedgerRows('구독',month);
  const methods=officePaymentMethods().catch(()=>[]);
  const results=await Promise.all(months.map(async value=>{
    const [income,expense,recurring,registered]=await Promise.all([officeLedgerRows('수입',value),officeLedgerRows('지출',value),subscriptions,methods]);
    return officeDashboardEvents([income,expense,recurring].map(rows=>rows.map(row=>({...row,payment_display:officePaymentLabel(row,registered)}))),value);
  }));
  const weekEvents=results.flat().filter(event=>event.date>=week[0]&&event.date<=week.at(-1))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.order-b.order);
  return {events:results[0],weekEvents,week,month};
}

async function officeStatisticsRows(){

    select:'id,flow_type,actual_date,amount',actual_date:'not.is.null',order:'actual_date.asc,id.asc'
  });

function officeStatisticsData(rows,currentYear){
  const daily=new Map(),monthly=new Map(),yearly=new Map([[currentYear,{income:0,expense:0}]]);
  for(const {actual_date:date,flow_type:flow,amount} of rows){
    const key=flow==='수입'?'income':flow==='지출'?'expense':null,value=Number(amount);
    if(!key||!date||!Number.isFinite(value))continue;
    for(const [groups,period] of [[daily,date],[monthly,date.slice(0,7)],[yearly,date.slice(0,4)]]){
      if(!groups.has(period))groups.set(period,{income:0,expense:0});
      groups.get(period)[key]+=value;
    }
  }
  return {daily,monthly,yearly,years:[...yearly.keys()].sort().reverse()};
}

  const kinds=series==='all'?['income','expense']:[series];

  const unit=10**Math.floor(Math.log10(maximum)),scale=Math.ceil(maximum/unit)*unit;
  const labels={income:'수입',expense:'지출'};
  return `<div class="office-statistics-chart" data-mode="${mode}" role="group" aria-label="${esc(title)}">
    <div class="office-statistics-axis" aria-hidden="true"><span>${officeMoney(scale)}</span><span>${officeMoney(Math.round(scale/2))}</span><span>0원</span></div>

function officeCardIssuer(row){

function officeMethodColor(issuer,index){
  if(!issuer){
    const hue=Math.round((166+137.508*index)%360);
    return 'hsl('+hue+' 48% 30%)';
  }
  const offset=(index%2?1:-1)*Math.ceil(index/2)*17;
  const hue=((officeCardIssuers[issuer].hue+offset)%360+360)%360;
  const saturation=issuer==='hyundai'&&index===0?19:59;
  const lightness=(hue>=38&&hue<=202?[28,25,29]:[34,31,37])[index%3];
  return 'hsl('+hue+' '+saturation+'% '+lightness+'%)';
}

  close.onclick=()=>{
    layer.remove();
    if(trigger?.isConnected)trigger.focus();
  };
  layer.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const controls=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')]
      .filter(element=>element.getClientRects().length);
    const first=controls[0],last=controls.at(-1);
    if(!first)return;
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  });
  close.focus();
  return layer;
}

function officeCardNumber(value){
  const input=String(value||'').trim();
  if(!input)return null;
  const digits=input.replace(/[ -]/g,'');
  if(!/^[0-9]{12,19}$/.test(digits))throw new Error('카드번호를 숫자 12~19자리로 입력해 주세요.');
  return digits;
}

function officeAccountNumber(value){
  const input=String(value||'').trim().replace(/ /g,'');
  if(!input)return null;
  const count=input.replaceAll('-','').length;
  if(!/^[0-9]+(-[0-9]+)*$/.test(input)||count<4||count>24)
    throw new Error('계좌번호를 숫자와 하이픈으로 입력해 주세요.');
  return input;
}

function officeMaskedNumber(row){
  if(!row.last_four)return '미등록';
  const length=row.kind==='card'?(row.number_length||16):8;
  return '•'.repeat(length-4).match(/.{1,4}/g).join(' ')+' '+row.last_four;
}

async function officeAccountNumbers(rows){
  const ids=rows.filter(row=>row.kind==='account'&&row.has_number).map(row=>row.id);
  const numbers=new Map();

    const batch=await officePaymentRpc('work_office_list_account_numbers',{p_ids:ids.slice(index,index+100)});
    for(const item of batch)numbers.set(item.method_id,item.account_number);
  }
  return numbers;
}

async function officeCopyAccountNumber(number){
  if(navigator.clipboard?.writeText){
    try{await navigator.clipboard.writeText(number);return true;}catch{}
  }
  const input=document.createElement('textarea');
  input.value=number;
  input.setAttribute('readonly','');
  input.style.cssText='position:fixed;opacity:0;pointer-events:none';
  const previous=document.activeElement;
  document.body.append(input);
  try{input.focus({preventScroll:true});input.select();return !!document.execCommand?.('copy');}
  catch{return false;}
  finally{input.remove();previous?.focus();}
}

async function officePaymentRpc(name,payload){
  const token=await verifyManagerHqSession();
  if(currentUser!=='manager')throw hqLoginError();
  const response=await fetch(adminAuthBase+'/rest/v1/rpc/'+name,{
    method:'POST',headers:{apikey:adminAuthPublic,Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(payload),cache:'no-store',signal:AbortSignal.timeout(12000)
  });
  if(response.status===401||response.status===403)throw new Error('대표 계정의 접근 권한을 확인해 주세요.');
  if(!response.ok){
    const code=(await response.json().catch(()=>null))?.code;
    if(code==='23505')throw new Error('이미 등록된 결제수단 별칭이에요.');
    if(code==='23503')throw new Error('연결된 내역이 있어 삭제할 수 없어요. 결제수단을 보관할 수 있어요.');
    if(code==='40001')throw new Error('다른 곳에서 결제수단이 변경됐어요. 새로고침해 주세요.');
    throw new Error('결제수단 정보를 처리하지 못했어요.');
  }
  return response.json();
}

function bindOfficeCardNumber(method,layer,status){
  const button=$('officeRevealCardNumber'),value=$('officePaymentNumberValue');
  if(!button||!value)return;
  let request=0,timer;
  const hide=()=>{
    request++;
    clearTimeout(timer);
    value.textContent=officeMaskedNumber(method);
    button.setAttribute('aria-pressed','false');
    button.setAttribute('aria-label','전체 카드번호 보기');
    button.disabled=false;
  };
  const listeners=new AbortController();
  window.addEventListener('blur',hide,{signal:listeners.signal});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)hide();},{signal:listeners.signal});
  const observer=new MutationObserver(()=>{
    if(layer.isConnected)return;
    hide();
    listeners.abort();observer.disconnect();
  });
  observer.observe(layer.parentNode,{childList:true});
  button.onclick=async()=>{
    if(button.getAttribute('aria-pressed')==='true'){hide();return;}
    const id=++request;
    button.disabled=true;
    status.textContent='';
    try{
      const digits=await officePaymentRpc('work_office_reveal_payment_number',{p_id:method.id,p_kind:'card'});
      if(!layer.isConnected||id!==request||document.hidden)return;
      if(typeof digits!=='string'||!/^\d{12,19}$/.test(digits))throw new Error('등록된 전체 카드번호를 확인할 수 없어요.');
      value.textContent=digits.match(/.{1,4}/g).join(' ');
      button.setAttribute('aria-pressed','true');
      button.setAttribute('aria-label','전체 카드번호 가리기');
      timer=setTimeout(hide,15000);
    }catch(error){if(layer.isConnected&&id===request)status.textContent=error.message;}
    finally{if(layer.isConnected&&id===request)button.disabled=false;}
  };
}

function officeChart(rows,label){
  const sums=new Map();
  rows.forEach(row=>{
    const key=row.category?.trim()||'미분류',amount=Number(row.amount);
    if(Number.isFinite(amount)&&amount>0)sums.set(key,(sums.get(key)||0)+amount);
  });
  const groups=[...sums].sort((a,b)=>b[1]-a[1]),total=groups.reduce((sum,[,amount])=>sum+amount,0);
  let cursor=0;
  const colors=groups.map(([,amount],i)=>{
    const start=cursor;cursor+=amount/total*100;
    return officeChartColors[i%officeChartColors.length]+' '+start+'% '+Math.min(cursor,100)+'%';
  });
  return `<section class="wd109-office-chart"><h2>${label} 분류별 비중</h2>
    ${label==='지출'?'<p class="smallText">실제 지출 기준</p>':''}
    <div class="wd109-office-donut" aria-hidden="true" style="background:${total?'conic-gradient('+colors.join(',')+')':'#edeaf2'}"><span>합계<strong>${officeMoney(total)}</strong></span></div>
    ${groups.length?`<ul>${groups.map(([category,amount],i)=>`<li><i aria-hidden="true" style="background:${officeChartColors[i%officeChartColors.length]}"></i>
      <span>${esc(category)}<small>${officeMoney(amount)}</small></span><strong>${(amount/total*100).toFixed(1)}%</strong></li>`).join('')}</ul>`:'<p class="smallText">이 달에 분류할 내역이 없어요.</p>'}
  </section>`;
}

async function officeLedgerRequest(tab,params,method='GET',payload){
  const token=await verifyManagerHqSession({reuse:method==='GET'});
  if(currentUser!=='manager')throw hqLoginError();
  const response=await fetch(adminAuthBase+'/rest/v1/'+officeTable(tab)+'?'+params,{
    method,headers:{apikey:adminAuthPublic,Authorization:'Bearer '+token,...(method!=='GET'?{'Content-Type':'application/json',Prefer:'return=representation'}:{})},
    ...(payload?{body:JSON.stringify(payload)}:{}),cache:'no-store',signal:AbortSignal.timeout(12000)
  });
  if(response.status===401||response.status===403)
    throw new Error('사무실 운영의 관리자 로그인과 접근 권한을 확인해 주세요.');
  if(tab==='결제수단관리'&&response.status===404)
    throw new Error('결제수단 공동 저장소가 아직 연결되지 않았어요.');
  if(tab==='결제수단관리'&&response.status===409)
    throw new Error('이미 등록된 결제수단 별칭이에요. 새로고침 후 확인해 주세요.');
  if(!response.ok)throw new Error(method==='GET'?'사무실 운영 기록을 불러오지 못했어요.':'사무실 운영 기록을 저장하지 못했어요. 새로고침 후 확인해 주세요.');
  return response.json();
}
async function officeLedgerRows(tab,month){
  const query=new URLSearchParams({user_id:'in.('+managerHqAccount.uid+','+legacyStaffHqLogin+')'});
  if(tab==='구독'){
    query.set('select','id,user_id,service_name,category,amount,next_payment_date,billing_cycle,billing_day,payment_method,payment_method_id,memo,is_used,updated_at');
    query.set('order','next_payment_date.asc.nullslast,id.asc');
  }else{
    query.set('select','id,user_id,flow_type,category,business_area,counterparty,title,amount,actual_date,expected_date,payment_method,payment_method_id,memo,money_status,source_type,recurrence_cycle,recurrence_day,recurrence_month,updated_at');
    query.set('flow_type','eq.'+tab);query.set('order','actual_date.desc.nullslast,expected_date.desc.nullslast,id.asc');
    const [year,monthNumber]=month.split('-').map(Number),first=month+'-01',last=month+'-'+new Date(year,monthNumber,0).getDate();
    const dateFilters=['and(actual_date.gte.'+first+',actual_date.lte.'+last+')',
      'and(actual_date.is.null,expected_date.gte.'+first+',expected_date.lte.'+last+')'];
    if(tab==='지출')dateFilters.push('and(recurrence_cycle.not.is.null,actual_date.lt.'+first+')',
      'and(recurrence_cycle.not.is.null,actual_date.is.null,expected_date.lt.'+first+')');
    query.set('or','('+dateFilters.join(',')+')');
  }
  const rows=[];
  for(let offset=0;;offset+=200){
    query.set('limit','200');query.set('offset',String(offset));
    const page=await officeLedgerRequest(tab,query);
    rows.push(...page);
    if(page.length<200)return tab==='지출'?officeExpenseOccurrences(rows,month):rows;
  }
}

function officeOptions(values,current,placeholder){
  return `<option value="">${placeholder}</option>${[...new Set([...values,...(current?[current]:[])])].map(value=>
    `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(value)}</option>`).join('')}`;
}
function officeFixedExpenseDate(row,month){
  const anchor=row.actual_date||row.expected_date;
  if(!anchor||!row.recurrence_cycle||month<=anchor.slice(0,7))return '';
  const [year,number]=month.split('-').map(Number);
  if(row.recurrence_cycle==='yearly'&&number!==Number(row.recurrence_month))return '';
  const day=Math.min(Number(row.recurrence_day),new Date(year,number,0).getDate());
  return month+'-'+String(day).padStart(2,'0');
}

function officeExpenseOccurrences(rows,month){
  return rows.flatMap(row=>{
    const date=row.actual_date||row.expected_date;
    if(date?.slice(0,7)===month)return [row];
    const projected=officeFixedExpenseDate(row,month);
    return projected?[{...row,id:row.id+'@'+projected,actual_date:null,expected_date:projected,
      money_status:'예정',recurrence_source:row}]:[];
  }).sort((a,b)=>(b.actual_date||'').localeCompare(a.actual_date||'')||
    (b.expected_date||'').localeCompare(a.expected_date||'')||a.id.localeCompare(b.id));
}

function bindOfficeFixedExpense(form){
  const fixed=form.elements.namedItem('fixed_expense');
  if(!fixed)return;
  const cycle=form.elements.namedItem('recurrence_cycle'),day=form.elements.namedItem('recurrence_day');
  const month=form.elements.namedItem('recurrence_month'),date=form.elements.namedItem('day');
  const sync=()=>{
    const yearly=fixed.checked&&cycle.value==='yearly';
    $('officeFixedExpenseFields').hidden=!fixed.checked;
    $('officeFixedExpenseMonth').hidden=!yearly;
    cycle.disabled=!fixed.checked;
    day.disabled=!fixed.checked;
    month.disabled=!yearly;
  };
  fixed.onchange=cycle.onchange=sync;
  date.onchange=()=>{
    if(fixed.checked||!date.value)return;
    day.value=String(Number(date.value.slice(8)));
    month.value=String(Number(date.value.slice(5,7)));

function officeFixedExpensePayload(data){
  if(!data.has('fixed_expense'))return {recurrence_cycle:null,recurrence_day:null,recurrence_month:null};
  const cycle=data.get('recurrence_cycle'),day=Number(data.get('recurrence_day'));
  const month=cycle==='yearly'?Number(data.get('recurrence_month')):null;
  if(!['monthly','yearly'].includes(cycle)||!Number.isInteger(day)||day<1||day>31||
    (cycle==='yearly'&&(!Number.isInteger(month)||month<1||month>12)))
    throw new Error('고정비 반복 주기와 날짜를 확인해 주세요.');
  return {recurrence_cycle:cycle,recurrence_day:day,recurrence_month:month};
}

          if(current()){layer.remove();await load();}
        }catch(error){if(current())detailStatus.textContent=error.message;}
        finally{remove.disabled=false;}
      };
      void loadLinks();
    };
    content.querySelectorAll('[data-office-method-add]').forEach(button=>button.onclick=()=>openEditor(button.dataset.officeMethodAdd));
    content.querySelectorAll('[data-office-method-import]').forEach(button=>button.onclick=()=>{
      void save(button,null,{kind:'card',name:legacy[Number(button.dataset.officeMethodImport)]});
    });
    content.querySelectorAll('[data-office-method-detail]').forEach(button=>button.onclick=()=>{
      openDetails(byId.get(button.dataset.officeMethodDetail),button);
    });
  };
  const load=async focusMonth=>{
    const id=++request,selected=tab;
    if(typeof focusMonth==='string')month.value=focusMonth;
    $('officeMonthLabel').hidden=['결제수단관리','통계'].includes(selected);
    add.hidden=!officeLedgerTabs.includes(selected);add.textContent=selected+' 추가';
    status.textContent='';content.replaceChildren();
    const viewMonth=month.value;
    if(!$('officeMonthLabel').hidden&&!validAttendanceDay(viewMonth+'-01')){
      status.textContent='조회 월을 선택해 주세요.';return;
    }
    status.textContent='내역을 불러오는 중…';
    try{
      if(selected==='결제수단관리'){
        const rows=await officePaymentMethods();
        if(!active()||id!==request)return;
        const numbers=await officeAccountNumbers(rows).catch(()=>null);
        if(!active()||id!==request)return;
        status.textContent=numbers?'':'전체 계좌번호를 불러오지 못했어요.';
        paintPaymentMethods(rows,numbers||new Map());return;
      }
      if(selected==='통계'){
        const records=await officeStatisticsRows();
        if(!active()||id!==request)return;
        status.textContent='';
        const data=officeStatisticsData(records,localDay().slice(0,4));
        if(!data.years.includes(statisticsYear))statisticsYear=data.years[0];
        const paint=()=>{
          content.innerHTML=officeStatisticsView(data,statisticsMode,statisticsYear,statisticsMonth,statisticsSeries);
          content.querySelectorAll('[data-office-statistics-mode]').forEach(button=>button.onclick=()=>{
            statisticsMode=button.dataset.officeStatisticsMode;
            paint();
            content.querySelector('[data-office-statistics-mode="'+statisticsMode+'"]')?.focus();
          });
          content.querySelectorAll('[data-office-statistics-period]').forEach(button=>button.onclick=()=>{
            const period=button.dataset.officeStatisticsPeriod;
            if(statisticsMode==='month')statisticsMonth=period;else statisticsYear=period;
            paint();content.querySelector('[data-office-statistics-period="'+period+'"]')?.focus();
          });
          content.querySelectorAll('[data-office-statistics-series]').forEach(button=>button.onclick=()=>{
            statisticsSeries=button.dataset.officeStatisticsSeries;
            paint();content.querySelector('[data-office-statistics-series="'+statisticsSeries+'"]')?.focus();
          });
          const year=$('officeStatisticsYear');
          if(year)year.onchange=()=>{statisticsYear=year.value;paint();$('officeStatisticsYear').focus();};
        };
        paint();return;
      }
      if(selected==='전체내역'){
        const data=await officeOverviewData(viewMonth);
        if(!active()||id!==request)return;
        if(!selectedDay.startsWith(viewMonth))selectedDay='';
        status.textContent='';paintOverview(data);return;
      }
      const expense=selected==='지출';
      const [records,methods,subscriptions]=await Promise.all([
        officeLedgerRows(selected,viewMonth),officePaymentMethods().catch(()=>[]),
        expense?officeLedgerRows('구독',viewMonth).catch(()=>null):Promise.resolve([])
      ]);
      if(!active()||id!==request)return;
      const rows=records.map(row=>({...row,payment_display:officePaymentLabel(row,methods)}));
      status.textContent='';
      const stillHere=()=>active()&&tab===selected;
      const editRecord=(row,layer,trigger)=>{
        layer?.remove();
        void officeRecordEditor(selected,row.recurrence_source||row,stillHere,load,trigger);
      };
      const deleteRecord=async(button,row,layer,output=status)=>{
        if(button.disabled||!stillHere()||!officeRecordEditable(row,selected)||!window.confirm(officeRecordName(row,selected)+' 내역을 삭제할까요?'))return;
        button.disabled=true;
        try{
          const query=new URLSearchParams({id:'eq.'+row.id,user_id:'eq.'+managerHqAccount.uid,updated_at:'eq.'+row.updated_at,select:'id'});
          const [removed]=await officeLedgerRequest(selected,query,'DELETE');
          if(removed?.id!==row.id)throw new Error('삭제를 확인하지 못했어요. 새로고침해 주세요.');
          layer?.remove();
          if(stillHere())void load();
        }catch(error){if(stillHere()&&output.isConnected)output.textContent=error.message;}
        finally{button.disabled=false;}
      };
      const bindRecordActions=(root,layer=null,output=status)=>{
        root.querySelectorAll('[data-office-edit]').forEach(button=>button.onclick=()=>{
          editRecord(rows[Number(button.dataset.officeEdit)],layer);
        });
        root.querySelectorAll('[data-office-delete]').forEach(button=>button.onclick=()=>{
          void deleteRecord(button,rows[Number(button.dataset.officeDelete)],layer,output);
        });
      };
      if(selected==='구독'){
        if(!subscriptionDay.startsWith(viewMonth))subscriptionDay='';
        let showUnscheduled=false;
        const paint=()=>{
          content.innerHTML=officeSubscriptionView(rows,viewMonth,methods,subscriptionDay,showUnscheduled);
          content.querySelectorAll('[data-office-day]').forEach(button=>button.onclick=()=>{
            const date=button.dataset.officeDay;
            subscriptionDay=subscriptionDay===date?'':date;
            showUnscheduled=false;
            paint();content.querySelector('[data-office-day="'+date+'"]')?.focus();
          });
          const allDays=$('officeSubscriptionAllDays');
          if(allDays)allDays.onclick=()=>{
            const previous=subscriptionDay;
            subscriptionDay='';showUnscheduled=false;paint();
            const target=previous?content.querySelector('[data-office-day="'+previous+'"]'):$('officeSubscriptionUnscheduled');
            target?.focus();
          };
          const unscheduled=$('officeSubscriptionUnscheduled');
          if(unscheduled)unscheduled.onclick=()=>{showUnscheduled=true;paint();$('officeSubscriptionAllDays')?.focus();};
          content.querySelectorAll('[data-office-subscription-detail]').forEach(entry=>entry.onclick=()=>{
            if(!stillHere()||$('modalLayer'))return;
            const row=rows[Number(entry.dataset.officeSubscriptionDetail)];
            const layer=showOfficeModal(officeSubscriptionDetails(row,viewMonth,methods),officeRecordName(row,'구독'),entry.querySelector('button'));
            const edit=$('officeEditSubscriptionDetail'),remove=$('officeDeleteSubscriptionDetail');
            if(edit)edit.onclick=()=>editRecord(row,layer,entry.querySelector('button'));
            if(remove)remove.onclick=()=>void deleteRecord(remove,row,layer,$('officeSubscriptionDetailStatus'));
          });
        };
        paint();return;
      }

      const summary=expense?officeExpenseSubscriptionSummary(rows,subscriptions,viewMonth):null;
      const indexed=rows.map((row,index)=>({row,index}));
      const entries=summary?indexed.filter(({row})=>!officeIsSubscriptionExpense(row)):indexed;
      const table=expense?officeExpenseTable(entries,officeSubscriptionExpenseRow(summary)):officeIncomeTable(entries);
      const chartRows=rows.filter(row=>row.actual_date).map(row=>expense&&officeIsSubscriptionExpense(row)?{...row,category:'구독료'}:row);
      content.innerHTML=`<div class="wd109-office-split">${officeChart(chartRows,selected)}<section><h2>${selected} 내역</h2>${table}</section></div>`;
      if(!expense){bindRecordActions(content);return;}
      const bindExpenseDetails=(container,previousLayer=null,returnTrigger=null)=>{
        container.querySelectorAll('[data-office-expense-detail]').forEach(entry=>entry.onclick=()=>{
          if(!stillHere()||(!previousLayer&&$('modalLayer'))||(previousLayer&&!previousLayer.isConnected))return;
          const row=rows[Number(entry.dataset.officeExpenseDetail)],trigger=returnTrigger||entry.querySelector('button');
          previousLayer?.remove();
          const layer=showOfficeModal(officeExpenseDetail(row),officeRecordName(row,'지출'),trigger);
          const edit=$('officeEditExpenseDetail'),remove=$('officeDeleteExpenseDetail');
          if(edit)edit.onclick=()=>editRecord(row,layer,trigger);
          if(remove)remove.onclick=()=>void deleteRecord(remove,row,layer,$('officeExpenseDetailStatus'));
        });
      };
      bindExpenseDetails(content);
      const detail=$('officeSubscriptionExpenseDetail');
      if(detail)detail.closest('tr').onclick=()=>{
        if(!stillHere()||$('modalLayer'))return;
        const grouped=indexed.filter(({row})=>officeIsSubscriptionExpense(row));
        const layer=showOfficeModal(`<p class="smallText">${esc(staffMonthLabel(viewMonth))}</p><div class="office-method-detail">
          <dl class="office-method-meta"><div><dt>실제 지출</dt><dd>${officeMoney(summary.actual)}</dd></div>
          <div><dt>구독 결제 일정 합계</dt><dd>${summary.scheduled===null?'조회 실패':officeMoney(summary.scheduled)}</dd></div></dl>
          ${grouped.length?`<h3>등록된 구독료 지출</h3>${officeExpenseTable(grouped,'',false)}`:''}
          <div class="actions"><button class="primary" type="button" id="officeGoToSubscriptions">구독 결제 일정 보기</button></div>
        </div>`,'구독료 월 합계',detail);
        bindExpenseDetails(layer,layer,detail);
        $('officeGoToSubscriptions').onclick=()=>{
          layer.remove();subscriptionDay='';tabs[officeTabs.indexOf('구독')].click();
        };
      };
    }catch(error){if(active()&&id===request)status.textContent=error.message;}
  };
  bindWorkspaceTabs(tabs,index=>{tab=officeTabs[index];panel.setAttribute('aria-labelledby',tabs[index].id);void load();});
  month.onchange=refresh.onclick=()=>void load();
  add.onclick=()=>{const selected=tab;if(officeLedgerTabs.includes(selected))void officeRecordEditor(selected,null,()=>active()&&tab===selected,load);};
  void load();
}

async function accountAccessToken(){
  if(currentUser==='manager')return verifyManagerHqSession();
  if(currentUser!=='employee'||hqStaffLoginId!==legacyStaffHqLogin||!workspaceMenus().some(([menu])=>menu==='accounts'))
    throw new Error('이 계정의 계정관리 권한을 확인해 주세요.');
  const token=await attendanceHqToken(),identity=await readWorkCenterHqIdentity(token);
  if(identity.login_id!==legacyStaffHqLogin||identity.staff_role!=='ops_lead')throw hqLoginError();
  await refreshWorkCenterGrant('accounts');
  return token;
}
async function readAccounts(type,id){
  const token=await accountAccessToken();
  const query=new URLSearchParams({select:id?'id,user_id,service_name,account_type,account_id,url,link_url,memo,pw,pw_updated_at':'id,service_name,account_type,account_id,url,pw_updated_at,created_at',
    account_type:'eq.'+type,user_id:'in.('+managerHqAccount.uid+','+legacyStaffHqLogin+')',order:'service_name.asc',limit:id?'1':'250'});
  if(id)query.set('id','eq.'+id);
  const response=await fetch(adminAuthBase+'/rest/v1/kit_accounts?'+query,{headers:{apikey:adminAuthPublic,Authorization:'Bearer '+token},
    cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(!response.ok)throw new Error('계정 정보를 불러오지 못했어요.');
  return response.json();
}

function accountOwner(detail){
  return detail.user_id===(currentUser==='manager'?managerHqAccount.uid:currentUser==='employee'?hqStaffLoginId:'');
}
async function updateWorkspaceAccount(detail,changes){
  if(!accountOwner(detail)||!safeDriveId(detail.id))throw new Error('이 계정을 변경할 권한을 확인해 주세요.');
  const token=await accountAccessToken();
  if(!accountOwner(detail))throw new Error('다시 로그인한 뒤 시도해 주세요.');
  const query=new URLSearchParams({id:'eq.'+detail.id,user_id:'eq.'+detail.user_id,account_type:'eq.'+detail.account_type,
    pw_updated_at:detail.pw_updated_at?'eq.'+detail.pw_updated_at:'is.null',select:'id'});
  const response=await fetch(adminAuthBase+'/rest/v1/kit_accounts?'+query,{
    method:changes?'PATCH':'DELETE',headers:{apikey:adminAuthPublic,Authorization:'Bearer '+token,
      Prefer:'return=representation',...(changes?{'Content-Type':'application/json'}:{})},
    ...(changes?{body:JSON.stringify({...changes,pw_updated_at:new Date().toISOString()})}:{}),
    cache:'no-store',signal:AbortSignal.timeout(12000)
  });
  if(!response.ok||(await response.json())[0]?.id!==detail.id)
    throw new Error('변경을 확인하지 못했어요. 계정 목록을 새로고침해 주세요.');
}
function accountDetail(row,type,active,onChanged){
  if(!safeDriveId(row.id)||$('modalLayer'))return;
  showModal('<section id="accountDetailBody" aria-live="polite">계정 정보를 불러오는 중…</section>',row.service_name);
  const target=$('accountDetailBody'),current=()=>target.isConnected&&active();
  const copy=async value=>{
    if(!value||!current())return;
    try{await navigator.clipboard.writeText(value);notify('복사했어요.');}
    catch{notify('복사하지 못했어요. 표시된 값을 선택해 복사해 주세요.');}
  };
  void readAccounts(type,row.id).then(([detail])=>{
    if(!current())return;
    if(!detail){target.textContent='계정 정보를 찾지 못했어요.';return;}
    const [info,...notes]=String(detail.memo||'').split('\n---\n'),memo=notes.join('\n---\n');
    let setItems=null;
    if(type==='전산세트'){
      try{const parsed=JSON.parse(info);if(Array.isArray(parsed))setItems=parsed;}catch{}
    }
    const accountInfo=setItems?setItems.map((item,i)=>(i+1)+'. '+String(item.name||'')+(item.url?' · '+String(item.url):'')).join('\n'):info;
    const secretLabel=type==='API키'?'API 키':type==='전산세트'?'데이터 비밀번호':'비밀번호';
    const closeAfterChange=message=>{if(current()){$('modalLayer')?.remove();void onChanged();notify(message);}};
    const showDetails=()=>{
      target.innerHTML=`<div class="wd110-account-kicker">${esc(type)}</div>
        <section class="wd110-account-card"><h3>계정 정보</h3><dl class="wd109-account-detail">
          <dt>계정 설명</dt><dd>${esc(accountInfo||'—')}</dd><dt>아이디 / 이메일</dt><dd>${esc(detail.account_id||'—')}
          ${detail.account_id?'<button type="button" class="small" id="copyAccountId">복사</button>':''}</dd>
          <dt>로그인 방법</dt><dd>${esc(detail.url||'—')}</dd><dt>접속 주소</dt><dd>${esc(detail.link_url||'—')}</dd>
        </dl></section>
        <section class="wd110-account-card wd110-account-secret"><h3>${secretLabel}</h3><div class="wd110-account-secret-row">
          <span id="accountSecret">${detail.pw?'••••••••':'등록된 값이 없어요.'}</span>
          ${detail.pw?'<button type="button" class="small" id="revealAccountSecret" aria-pressed="false">보기</button><button type="button" class="small" id="copyAccountSecret">복사</button>':''}
        </div></section>
        <section class="wd110-account-card"><h3>메모</h3><p class="wd110-account-memo">${esc(memo||'—')}</p></section>
        <p id="accountChangeStatus" class="smallText" role="status"></p>
        ${accountOwner(detail)?'<div class="actions"><button type="button" class="primary small" id="editWorkspaceAccount">수정</button><button type="button" class="small wd110-instruction-delete" id="deleteWorkspaceAccount">삭제</button></div>':''}`;
      const reveal=$('revealAccountSecret');
      if(reveal)reveal.onclick=()=>{
        const shown=reveal.getAttribute('aria-pressed')!=='true';
        $('accountSecret').textContent=shown?detail.pw:'••••••••';
        reveal.setAttribute('aria-pressed',String(shown));reveal.textContent=shown?'숨기기':'보기';
      };
      if($('copyAccountId'))$('copyAccountId').onclick=()=>void copy(detail.account_id);
      if($('copyAccountSecret'))$('copyAccountSecret').onclick=()=>void copy(detail.pw);
      if($('editWorkspaceAccount'))$('editWorkspaceAccount').onclick=showEdit;
      if($('deleteWorkspaceAccount'))$('deleteWorkspaceAccount').onclick=async event=>{
        const button=event.currentTarget,status=$('accountChangeStatus');
        if(button.disabled||!current()||!window.confirm(detail.service_name+' 계정을 삭제하시겠습니까?'))return;
        button.disabled=true;
        try{await updateWorkspaceAccount(detail,null);closeAfterChange('계정을 삭제했어요.');}
        catch(error){if(current())status.textContent=error.message;}
        finally{button.disabled=false;}
      };
    };
    const showEdit=()=>{
      if(!current()||!accountOwner(detail))return;
      const editInfo=setItems?setItems.map(item=>[item.name,item.url].filter(Boolean).join(' | ')).join('\n'):info;
      target.innerHTML=`<form id="workspaceAccountEdit" class="wd110-account-card" autocomplete="off">
        <label>서비스명<input name="service" required maxlength="120" value="${esc(detail.service_name)}"></label>
        <label>아이디 / 이메일<input name="account" value="${esc(detail.account_id||'')}"></label>
        <label>로그인 방법<input name="login" value="${esc(detail.url||'')}"></label>
        <label>접속 주소<input name="link" value="${esc(detail.link_url||'')}"></label>
        <label>${secretLabel} 변경<input name="secret" type="password" placeholder="비워 두면 기존 값 유지" autocomplete="new-password"></label>
        <label>${setItems?'전산 구성 (이름 | 주소, 한 줄에 하나)':'계정 설명'}<textarea name="info" rows="4">${esc(editInfo)}</textarea></label>
        <label>메모<textarea name="memo" rows="4">${esc(memo)}</textarea></label>
        <p id="accountChangeStatus" class="smallText" role="status"></p>
        <div class="actions"><button type="button" id="cancelWorkspaceAccountEdit">취소</button><button type="submit" class="primary">수정 저장</button></div>
      </form>`;
      const form=$('workspaceAccountEdit'),button=form.querySelector('[type="submit"]'),status=$('accountChangeStatus');
      $('cancelWorkspaceAccountEdit').onclick=()=>{if(!button.disabled)showDetails();};
      form.onsubmit=async event=>{
        event.preventDefault();
        if(button.disabled||!current())return;
        const data=new FormData(form),get=key=>String(data.get(key)||'').trim();
        const title=get('service'),secret=String(data.get('secret')||''),notes=get('memo');
        if(!title){status.textContent='서비스명을 입력해 주세요.';return;}
        let body=get('info');
        if(setItems)body=JSON.stringify(body.split('\n').map(line=>line.trim()).filter(Boolean).map((line,i)=>{
          const [name,...url]=line.split('|');
          return {...setItems[i],name:name.trim(),url:url.join('|').trim()};
        }));
        button.disabled=true;
        try{
          await updateWorkspaceAccount(detail,{service_name:title,account_id:get('account'),url:get('login'),link_url:get('link'),
            memo:notes?body+'\n---\n'+notes:body,...(secret?{pw:secret}:{})});
          closeAfterChange('계정 정보를 수정했어요.');
        }catch(error){if(current())status.textContent=error.message;}
        finally{button.disabled=false;}
      };
    };
    showDetails();
  }).catch(error=>{if(current())target.textContent=error.message;});
}

function bindAccounts(){
  const panel=$('accountPanel'),target=$('accountRows'),status=$('accountStatus'),search=$('accountSearch');
  const tabs=nativeAdminTabs.accounts.map((_,i)=>$('accountTab'+i));
  const generation=driveConnectGeneration;
  const active=()=>panel.isConnected&&S.nav==='accounts'&&generation===driveConnectGeneration;
  let rows=[],type=nativeAdminTabs.accounts[0][1],request=0;
  const paint=()=>{
    const term=search.value.trim().toLowerCase(),list=rows.filter(row=>[row.service_name,row.account_id].some(value=>String(value||'').toLowerCase().includes(term)));
    target.innerHTML=list.length?`<table class="wd58-list-table wd109-account-table"><thead><tr><th>서비스명</th><th>로그인 방법</th><th>아이디 / 이메일</th><th>수정일</th></tr></thead>
      <tbody>${list.map((row,i)=>`<tr data-account-row="${i}"><th scope="row"><button type="button" class="wd110-account-row-button"
          aria-label="${esc(row.service_name)} 상세 보기">${esc(row.service_name)}</button></th><td>${esc(row.url||'—')}</td><td>${esc(row.account_id||'—')}</td>
        <td>${esc(adminCell(row.pw_updated_at||row.created_at,'date'))}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">표시할 계정이 없어요.</p>';
    target.querySelectorAll('[data-account-row]').forEach(row=>row.onclick=()=>accountDetail(list[Number(row.dataset.accountRow)],type,active,refresh));
  };
  const refresh=async()=>{
    const id=++request,selected=type;
    rows=[];target.replaceChildren();status.textContent='계정을 불러오는 중…';
    try{
      const data=await readAccounts(selected);
      if(!active()||id!==request)return;
      rows=data;status.textContent='';paint();
    }catch(error){if(active()&&id===request)status.textContent=error.message;}
  };
  bindWorkspaceTabs(tabs,index=>{type=nativeAdminTabs.accounts[index][1];panel.setAttribute('aria-labelledby',tabs[index].id);search.value='';void refresh();});
  search.oninput=paint;$('refreshAccounts').onclick=refresh;void refresh();
}

async function readNativeAdminData(section,token){
  const owner=managerHqAccount.uid,people=[owner,legacyStaffHqLogin];
  const query=new URLSearchParams({select:section.columns.map(([name])=>name).join(','),order:section.order,limit:'200'});
  query.set('user_id','in.('+people.join(',')+')');
  for(const [key,value] of Object.entries(section.filters||{}))query.set(key,'eq.'+value);
  const response=await fetch(adminAuthBase+'/rest/v1/'+section.table+'?'+query,{
    headers:{apikey:adminAuthPublic,Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(12000)
  });
  if(!response.ok)throw new Error('기록을 불러오지 못했어요.');
  return response.json();
}
function adminCell(value,format){
  if(value===null||value===undefined||value==='')return '—';
  if(format==='money'&&Number.isFinite(Number(value)))return Number(value).toLocaleString('ko-KR')+'원';
  return format==='date'?String(value).slice(0,10):String(value);
}
function bindNativeAdminView(){
  const menu=S.nav,search=$('nativeAdminSearch'),refresh=$('nativeAdminRefresh'),add=$('nativeFinanceAdd');
  const tabButtons=[...document.querySelectorAll('[data-admin-subtab]')];
  let selected=nativeAdminTabs[menu]?.[0][0]||menu,sections=nativeAdminData[selected],requestId=0;
  const status=$('nativeAdminStatus'),content=$('nativeAdminData'),calc=$('nativeAdminCalc'),grid=$('nativeAdminGrid');
  const toolbar=search.closest('.wd105-admin-toolbar');
  const active=()=>currentUser==='manager'&&S.nav===menu&&content.isConnected;
  let results=[];
  const paint=()=>{
    const term=search.value.trim().toLowerCase();
    content.innerHTML=sections.map((section,index)=>{
      const result=results[index];
      if(result?.status==='rejected')return `<section><h2>${section.title}</h2><p class="empty">기록을 불러오지 못했어요.</p></section>`;
      const rows=(result?.value||[]).filter(row=>section.columns.some(([name,,format])=>adminCell(row[name],format).toLowerCase().includes(term)));
      return `<section><h2>${selected==='payroll'?'급여명세서 누적 내역':section.title}</h2>${rows.length?`<div class="wd105-admin-table" tabindex="0" role="region" aria-label="${section.title}"><table class="wd58-list-table">
        <thead><tr>${section.columns.map(([,label])=>`<th scope="col">${label}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(row=>`<tr>${section.columns.map(([name,,format])=>`<td>${esc(adminCell(row[name],format))}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`:`<p class="empty">${term?'검색 결과가 없어요.':'등록된 기록이 없어요.'}</p>`}</section>`;
    }).join('');
  };
  const load=async()=>{
    const id=++requestId,requested=sections;
    refresh.disabled=true;search.disabled=true;results=[];content.replaceChildren();
    const showCalc=selected==='payroll';
    toolbar.hidden=!requested.length;
    calc.hidden=!showCalc;grid.classList.toggle('wd108-payroll-grid',showCalc);
    if(showCalc&&!$('payrollCalculator')){
      calc.innerHTML=payrollCalculator();
      bindPayrollCalculator(()=>active()&&selected==='payroll',load);
    }
    if(!requested.length){status.textContent='';return;}
    if(add){
      add.hidden=!nativeFinanceKinds[selected];
      add.textContent=(nativeFinanceKinds[selected]?.label||'')+' 등록';
    }
    status.textContent='기존 기록을 불러오는 중…';
    try{
      const token=await verifyManagerHqSession();
      if(!active()||id!==requestId)return;
      const loaded=await Promise.allSettled(requested.map(section=>readNativeAdminData(section,token)));
      if(!active()||id!==requestId)return;
      results=loaded;
      status.textContent=results.some(result=>result.status==='rejected')?'일부 기록을 불러오지 못했어요.':
        results.some(result=>result.value.length===200)?'목록마다 최근 기록을 최대 200건까지 표시해요.':'기존 기록 · 조회 전용';
      paint();search.disabled=false;
    }catch(error){if(active()&&id===requestId)status.textContent=error.message||'본진 관리자 권한을 확인하지 못했어요.';}
    finally{if(active()&&id===requestId)refresh.disabled=false;}
  };
  tabButtons.forEach(button=>button.onclick=()=>{
    if(button.dataset.adminSubtab===selected)return;
    selected=button.dataset.adminSubtab;sections=nativeAdminData[selected];search.value='';
    tabButtons.forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));void load();
  });
  if(add)add.onclick=()=>{if(nativeFinanceKinds[selected])openNativeFinanceAdd(selected,active,load);};
  search.oninput=paint;refresh.onclick=load;void load();
}

function replaceLocalMaterial(id){

function hqLoginError(){

  error.code='HQ_LOGIN_REQUIRED';return error;

async function refreshEmbeddedHqSession(){
  try{
    const parent=window.parent;
    if(!parent||parent===window||parent.location.origin!==location.origin||typeof parent.wdhqGetRealAccessToken!=='function')return '';
    let timer;
    try{return await Promise.race([parent.wdhqGetRealAccessToken(),new Promise(resolve=>{timer=setTimeout(()=>resolve(''),4000);})]);}
    finally{clearTimeout(timer);}
  }catch{return '';}
}

function usableHqToken(session,rejectedToken){
  const token=session?.access_token;
  const expires=Number(session?.expires_at);
  return token&&token!==rejectedToken&&(!expires||expires*1000>Date.now()+30000)?token:'';
}
async function attendanceHqToken(rejectedToken=''){
  const saved=readHqSession();
  const token=usableHqToken(saved,rejectedToken);
  if(token)return token;
  const embedded=await refreshEmbeddedHqSession();
  if(embedded&&embedded!==saved?.access_token&&embedded!==rejectedToken)return embedded;
  if(!navigator.locks)return '';
  try{
    // Use the same storage lock as the HQ Supabase client when rotating the session.
    return await navigator.locks.request('lock:'+hqSessionKey,{signal:AbortSignal.timeout(5000)},async()=>{
      const raw=localStorage.getItem(hqSessionKey);
      const session=JSON.parse(raw||'null');
      const current=usableHqToken(session,rejectedToken);
      if(current)return current;
      if(!session?.refresh_token||!session.user?.id)return '';
      const response=await fetch(adminAuthBase+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',headers:{apikey:adminAuthPublic,'Content-Type':'application/json'},
        body:JSON.stringify({refresh_token:session.refresh_token}),cache:'no-store',signal:AbortSignal.timeout(8000)
      });
      if(!response.ok)return '';
      const refreshed=await response.json();
      const expiresIn=Number(refreshed.expires_in);
      if(!refreshed.access_token||!refreshed.refresh_token||!Number.isFinite(expiresIn)||expiresIn<=30||
        refreshed.user?.id!==session.user.id)return '';
      if(localStorage.getItem(hqSessionKey)!==raw){
        const latest=readHqSession();
        return latest?.user?.id===session.user.id?usableHqToken(latest,rejectedToken):'';
      }
      const expiresAt=Number(refreshed.expires_at)||Math.floor(Date.now()/1000)+expiresIn;
      localStorage.setItem(hqSessionKey,JSON.stringify({...session,...refreshed,expires_at:expiresAt}));
      return refreshed.access_token;
    });
  }catch{return '';}
}

async function attendanceLedger(month,change){
  const token=await attendanceHqToken();
  if(!token)throw hqLoginError();
  const request=credential=>fetch(adminAuthBase+'/functions/v1/work-hours-test-v2?month='+encodeURIComponent(month),{
    method:change?'POST':'GET',headers:{Authorization:'Bearer '+credential,apikey:adminAuthPublic,'Content-Type':'application/json'},
    ...(change?{body:JSON.stringify(change)}:{}),cache:'no-store',signal:AbortSignal.timeout(14000)
  });
  let response=await request(token);
  if(response.status===401){
    const updated=await attendanceHqToken(token);
    if(updated)response=await request(updated);
  }
  const data=await response.json().catch(()=>({}));
  if(!response.ok){
    if(response.status===401||response.status===403)throw hqLoginError();
    const error=new Error(data.error||'실제 근무기록에 연결하지 못했어요.');error.status=response.status;throw error;
  }
  return data;
}

async function checkEntryDrive(token,folders=[employeeDriveFolders.instruction,employeeDriveFolders.shared]){
  const checks=await Promise.allSettled(folders.map(async folder=>{
    const url=driveFileApi+'/'+folder+'?fields=id,capabilities(canListChildren)&supportsAllDrives=true';
    const data=await (await employeeDriveRequest(url,token)).json();
    return data.id===folder&&data.capabilities?.canListChildren===true;
  }));
  if(checks.every(result=>result.status==='fulfilled'&&result.value))return;
  const denied=checks.some(result=>result.status==='fulfilled'||[401,403,404].includes(result.reason?.status));
  const error=new Error(denied?'업무공유폴더 접근 권한을 확인하지 못했어요. 등록된 Google 계정으로 다시 연결해 주세요.':'업무공유폴더 응답이 늦어요. 잠시 뒤 다시 눌러주세요.');
  if(denied)error.code='DRIVE_PERMISSION';
  throw error;
}

    connect.disabled=false;status.textContent='';ask();
  }).catch(error=>{
    if(!active())return;
    connect.disabled=false;status.textContent=error.message||'Drive 연결을 확인해 주세요.';ask();
  });
}

function attendanceBreak(row,elapsed){
  return Number.isInteger(row?.breakMinutes)&&row.breakMinutes>=0?row.breakMinutes:elapsed>=540?60:0;
}
function automaticBreak(elapsed,original,start,end){
  const unchanged=original?.inAt===start&&original?.outAt===end;
  if(elapsed>=540)return Math.max(60,unchanged?attendanceBreak(original,elapsed):0);
  return unchanged?attendanceBreak(original,elapsed):0;
}

function timeOnly(iso){let d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function validAttendanceDay(day){const date=new Date(day+'T12:00:00');return /^\d{4}-\d{2}-\d{2}$/.test(day)&&Number.isFinite(date.getTime())&&localDay(date)===day}
function attendanceISO(day,value){if(!validAttendanceDay(day)||!/^\d{2}:\d{2}$/.test(value)||Number(value.slice(0,2))>23||Number(value.slice(3))>59)return null;let d=new Date(`${day}T${value}:00`);return Number.isNaN(d.valueOf())?null:d.toISOString()}
function clockLabel(value){let [h,m]=value.split(':').map(Number);return `${h<12?'오전':'오후'} ${String(h%12||12).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function parseClockInput(hour,minute,period){if(!/^\d{1,2}$/.test(hour)||!/^\d{1,2}$/.test(minute))return null;let h=Number(hour),m=Number(minute);if(h<1||h>12||m>59||!['am','pm'].includes(period))return null;return `${String(h%12+(period==='pm'?12:0)).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function updateClockInput(id){let get=part=>document.querySelector('[data-clock="'+id+'"][data-part="'+part+'"]'),hour=get('hour'),minute=get('minute'),period=get('period');let value=parseClockInput(hour.value,minute.value,period.value);hour.setAttribute('aria-invalid',String(!/^\d{1,2}$/.test(hour.value)||Number(hour.value)<1||Number(hour.value)>12));minute.setAttribute('aria-invalid',String(!/^\d{1,2}$/.test(minute.value)||Number(minute.value)>59));$(id).value=value||'';const face=$(id+'Face');if(value&&face){let [h,m]=value.split(':').map(Number);face.querySelector('[data-hour]').style.transform='rotate('+(h*30+m*.5)+'deg)';face.querySelector('[data-minute]').style.transform='rotate('+(m*6)+'deg)'}return value}
function bindClockInputs(){
  document.querySelectorAll('[data-clock]').forEach(el=>{
    const update=()=>updateClockInput(el.dataset.clock);
    if(el.dataset.part==='period'){el.onchange=update;return;}
    el.oninput=()=>{el.value=el.value.replace(/[^0-9]/g,'').slice(0,2);update();};
    el.onfocus=()=>el.select();
    el.onblur=()=>{if(el.value!==''&&el.getAttribute('aria-invalid')!=='true')el.value=el.value.padStart(2,'0');update();};
  });
}

async function saveAttendanceTime(kind){
  const day=attendanceRecordDay||localDay(),isStart=kind==='inAt',label=isStart?'출근':'퇴근';
  if(day>localDay()||!validAttendanceDay(day))return notify('오늘 또는 이전 날짜를 선택하세요');
  const stamp=attendanceISO(day,$(isStart?'workInTime':'workOutTime').value);
  if(!stamp)return notify(label+' 시각을 오전·오후, 1~12시, 0~59분으로 입력하세요');
  const record=myAttendanceRows().find(item=>item.day===day);
  if(record?.[kind]&&editingAttendanceTime!==kind)return;
  if(!isStart&&!record?.inAt)return notify('출근 시간을 먼저 저장하세요');
  const next={day,inAt:null,outAt:null,...record,[kind]:stamp};
  if(next.outAt&&new Date(next.outAt)<=new Date(next.inAt))return notify('퇴근 시간은 출근 시간보다 늦어야 합니다');
  const elapsed=workElapsed(next),rest=automaticBreak(elapsed,record,next.inAt,next.outAt);
  if(elapsed!==null&&rest>=elapsed)return notify('근무시간을 확인해 주세요.');
  next.breakMinutes=rest;
  if(liveAttendanceReady){
    const month=day.slice(0,7);
    if(liveAttendanceSaving||!liveAttendanceMonths.has(month))return notify('근무기록을 불러온 뒤 저장해 주세요.');
    const generation=driveConnectGeneration;
    liveAttendanceSaving=true;
    $('clockIn').disabled=true;$('clockOut').disabled=true;
    try{
      const {record:saved}=await attendanceLedger(month,{day,start:timeOnly(next.inAt),end:next.outAt?timeOnly(next.outAt):null,breakMinutes:rest,existing:!!record,version:record?.version||null});
      if(generation!==driveConnectGeneration)return;
      const rows=attendanceMonthRows(month).filter(item=>item.day!==day);
      rows.push(ledgerRow(saved));liveAttendanceMonths.set(month,rows);editingAttendanceTime=null;notify(label+' 시간을 실제 근무기록에 저장했어요.');
    }catch(error){
      if(generation!==driveConnectGeneration)return;
      if(error.status===409)liveAttendanceMonths.delete(month);
      notify(error.message);
    }finally{
      if(generation===driveConnectGeneration){liveAttendanceSaving=false;if(S.nav==='attendance')render();}
    }
    return;
  }
  const prior=S.attendance;
  S.attendance=record?prior.map(item=>item===record?next:item):[...prior,next];
  try{save();}catch(e){S.attendance=prior;return notify(label+' 시간을 저장하지 못했습니다');}
  editingAttendanceTime=null;render();notify(label+' 시간을 '+(record?.[kind]?'수정했어요':'저장했어요'));
}

function bindAttendance(){
  if(currentUser==='employee'){
    bindEmployeeSchedule();

      first.setMonth(first.getMonth()+offset);

    $('myAttendanceToday').onclick=()=>pickRecordDay(today);
  }
  const today=payrollCalendar.format(new Date());
  const pickRecordDay=day=>{
    if(!validAttendanceDay(day)||day>today||liveAttendanceSaving)return false;
    attendanceRecordDay=day;attendanceMonth=day.slice(0,7);editingAttendanceTime=null;render();$('attendanceRecordDay').focus();return true;
  };
  $('attendanceRecordDay').onchange=event=>{
    if(!pickRecordDay(event.target.value)){
      event.target.value=attendanceRecordDay||today;notify('오늘 또는 이전 날짜를 선택하세요');
    }
  };
  $('attendanceRecordToday').onclick=()=>pickRecordDay(today);
  document.querySelectorAll('[data-record-day]').forEach(button=>button.onclick=()=>pickRecordDay(button.dataset.recordDay));
  for(const id of ['attendanceYear','attendanceMonth']){
    const select=$(id);
    if(select)select.onchange=()=>{attendanceMonth=$('attendanceYear').value+'-'+$('attendanceMonth').value;render();$(id)?.focus();};
  }
  bindClockInputs();
  document.querySelectorAll('[data-clock-edit]').forEach(button=>button.onclick=()=>{
    if(liveAttendanceSaving)return;
    const kind=button.dataset.clockEdit;
    editingAttendanceTime=editingAttendanceTime===kind?null:kind;
    render();
    const target=kind==='inAt'?'workInTime':'workOutTime';
    if(editingAttendanceTime)document.querySelector('[data-clock="'+target+'"][data-part="hour"]')?.focus();
    else document.querySelector('[data-clock-edit="'+kind+'"]')?.focus();
  });
  $('clockIn').onclick=()=>saveAttendanceTime('inAt');
  $('clockOut').onclick=()=>saveAttendanceTime('outAt');
  if(liveAttendanceReady){
    const month=(attendanceRecordDay||today).slice(0,7);
    const ready=liveAttendanceMonths.has(month)&&!liveAttendanceSaving;
    if(!ready){$('clockIn').disabled=true;$('clockOut').disabled=true;}
    for(const value of new Set([attendanceMonth,month]))void refreshLiveAttendance(value);
  }
}

function moveCalendarDay(day,amount){
  const date=new Date(day+'T12:00:00');
  date.setDate(date.getDate()+amount);
  return localDay(date);
}

function weeklyDays(day){
  const weekday=new Date(day+'T12:00:00').getDay();
  const monday=moveCalendarDay(day,-((weekday+6)%7));
  return Array.from({length:7},(_,i)=>moveCalendarDay(monday,i));
}

  let day=null,trigger=null;
  const setTime=(id,value)=>{
    const [hour,minute]=value.split(':').map(Number);
    const input=part=>dialog.querySelector('[data-clock="'+id+'"][data-part="'+part+'"]');
    input('period').value=hour<12?'am':'pm';
    input('hour').value=String(hour%12||12).padStart(2,'0');
    input('minute').value=String(minute).padStart(2,'0');
    updateClockInput(id);
  };
  document.querySelectorAll('[data-edit-plan]').forEach(button=>button.onclick=()=>{
    day=button.dataset.editPlan;trigger=button;
    const row=S.plannedWork.find(item=>item.day===day);
    $('myScheduleSelected').textContent=attendanceDate(day)+' · '+staffName();
    setTime('myScheduleStart',row?.hours?.start||'09:00');
    setTime('myScheduleEnd',row?.hours?.end||'18:00');
    remove.hidden=!row;
    dialog.showModal();
  });
  const savePlan=hours=>{
    if(!validAttendanceDay(day))return notify('달력에서 날짜를 선택하세요');
    const prior=S.plannedWork;
    S.plannedWork=prior.filter(row=>row.day!==day);
    if(hours)S.plannedWork.push({day,hours});
    S.plannedWork.sort((a,b)=>a.day.localeCompare(b.day));
    S.plannedWorkChange={day,manual:!!hours,hours};
    try{save();}catch(e){S.plannedWork=prior;return notify('예정 근무를 저장하지 못했습니다');}
    finally{delete S.plannedWorkChange;}
    dialog.close();render();document.querySelector('[data-edit-plan="'+day+'"]')?.focus();
    notify(hours?'예정 근무를 저장했어요':'예정 근무를 삭제했어요');
  };
  dialog.onclose=()=>trigger?.focus();
  form.onsubmit=event=>{
    event.preventDefault();
    const start=$('myScheduleStart').value,end=$('myScheduleEnd').value;
    if(!attendanceISO(day,start)||!attendanceISO(day,end)||end<=start)return notify('예정 퇴근 시간은 출근 시간보다 늦어야 합니다');
    savePlan({start,end});
  };
  remove.onclick=()=>savePlan(null);
}

function monthCalendarDates(month){
  const first=new Date(month+'-01T12:00:00');
  const leading=(first.getDay()+6)%7;
  const count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const days=Array.from({length:count},(_,i)=>month+'-'+String(i+1).padStart(2,'0'));
  return {days,leading,trailing:(7-(leading+count)%7)%7};
}

function dayAttendance(day,profiles){
  const planned=new Set(S.workRoster?.[day]||[]);
  const start=row=>row.record?timeOnly(row.record.inAt):row.hours?.start||'99:99';
  return profiles.map(profile=>({profile,planned:planned.has(profile.id),hours:S.workSchedule?.[day]?.[profile.id],
    record:(S.staffData[profile.id]?.attendance||[]).find(row=>row.day===day&&row.inAt)}))
    .filter(row=>row.planned||row.record)
    .sort((a,b)=>start(a).localeCompare(start(b))||a.profile.name.localeCompare(b.profile.name,'ko'));
}

function bindManagerHome(){
  const day=homeDay||localDay();
  const select=date=>{homeDay=date;render();};
  const openDay=date=>{
    select(date);
    document.querySelector('[data-home-day="'+date+'"]')?.focus();
    $('homeDayDialog')?.showModal();
  };
  document.querySelectorAll('[data-home-day]').forEach(button=>button.onclick=()=>openDay(button.dataset.homeDay));
  document.querySelectorAll('[data-home-task]').forEach(button=>button.onclick=()=>{
    const task=S.tasks.find(item=>item.id===button.dataset.homeTask);
    if(task)setNav('instructions',taskStaffId(task),task.date);
  });
  bindHomeWeeklyReports();
  const shiftMonth=amount=>{
    const first=new Date(day.slice(0,7)+'-01T12:00:00');
    first.setMonth(first.getMonth()+amount);
    select(localDay(first));
  };
  $('prevHomeMonth').onclick=()=>{shiftMonth(-1);$('prevHomeMonth').focus();};
  $('nextHomeMonth').onclick=()=>{shiftMonth(1);$('nextHomeMonth').focus();};
  $('todayHomeMonth').onclick=()=>{select(localDay());$('todayHomeMonth').focus();};
  bindManagerDriveList(token=>readAllEmployeeDriveFiles(employeeDriveFolders.shared,token),(output,files)=>{
    output.innerHTML=sharedDriveFilesMarkup(files);
  });
  const form=$('homeRosterForm');
  if(!form)return;
  const staff=$('homeRosterStaff'),start=$('homeRosterStart'),end=$('homeRosterEnd'),removeButton=$('removeHomeRoster');
  $('addHomeRoster').onclick=()=>{form.hidden=false;$('addHomeRoster').setAttribute('aria-expanded','true');staff.focus();};
  staff.onchange=()=>{
    const hours=S.workSchedule?.[day]?.[staff.value];
    start.value=hours?.start||'';end.value=hours?.end||'';
    removeButton.hidden=!(S.workRoster?.[day]||[]).includes(staff.value);
  };
  const saveRoster=remove=>{
    const staffId=staff.value;
    if(!activeProfiles().some(profile=>profile.id===staffId))return notify('직원·스탭을 먼저 선택하세요.');
    const startTime=start.value,endTime=end.value;
    if(!remove&&(startTime||endTime)&&(!attendanceISO(day,startTime)||!attendanceISO(day,endTime)||endTime<=startTime))
      return notify('예정 출근·퇴근 시간을 확인해 주세요.');
    const priorRoster=S.workRoster,priorHours=S.workSchedule;
    const roster={...priorRoster},schedule={...priorHours};
    const ids=new Set(roster[day]||[]);
    if(remove)ids.delete(staffId);else ids.add(staffId);
    if(ids.size)roster[day]=[...ids];else delete roster[day];
    const hours={...schedule[day]};
    if(!remove&&startTime&&endTime)hours[staffId]={start:startTime,end:endTime};else delete hours[staffId];
    if(Object.keys(hours).length)schedule[day]=hours;else delete schedule[day];
    S.workRoster=roster;S.workSchedule=schedule;
    try{save();}catch(e){S.workRoster=priorRoster;S.workSchedule=priorHours;return notify('출근 예정 저장에 실패했습니다');}
    openDay(day);notify(remove?'출근 예정을 해제했습니다':'근무 일정을 저장했습니다');
  };
  form.onsubmit=event=>{event.preventDefault();saveRoster(false);};
  removeButton.onclick=()=>saveRoster(true);
}

function bindHomeWeeklyReports(){

      const row=byId.get(button.dataset.homeWeekReport);

    });
  };
  const session=managerDriveSession;
  paint([],'Drive 업무보고를 확인하는 중이에요.');
  void (async()=>{
    try{
      if(!session||session.expires<=Date.now())throw new Error('Drive 연결 만료');
      const {rows,failed}=await readCompanyDriveReports(session.token);
      if($('homeWeeklyReports')===output)paint(rows,failed.size?'일부 Drive 업무보고를 불러오지 못했어요.':'');
    }catch{
      if($('homeWeeklyReports')===output)paint([],'Drive 업무보고를 불러오지 못했어요.');
    }
  })();
}

function staffWorkDriveFolders(profile){
  if(!profile)return null;
  if(payrollEmployeeLogin(profile)===legacyStaffHqLogin)

  return null;

async function readWorkReportFolder(folder,token,profile){
  const files=await readAllEmployeeDriveFiles(folder,token,
    " and mimeType != 'application/vnd.google-apps.folder'",'id,name,mimeType,createdTime,appProperties');
  return files.filter(file=>!file.appProperties?.wdReportAttachment).map(file=>{
    const workDate=workDriveDate(file.name),created=Date.parse(file.createdTime);
    const submittedDay=file.appProperties?.wdReportSubmittedDay;
    return {...file,staffId:profile.id,staffName:profile.name,workDate,
      date:validAttendanceDay(submittedDay)?submittedDay:Number.isFinite(created)?payrollCalendar.format(created):workDate};
  }).filter(file=>validAttendanceDay(file.date))
    .sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name,'ko'));
}

async function readCompanyDriveReports(token,staffId=''){
  const profiles=S.staffProfiles.filter(profile=>(!staffId||profile.id===staffId)&&staffWorkDriveFolders(profile));
  const results=await Promise.allSettled(profiles.map(profile=>
    readWorkReportFolder(staffWorkDriveFolders(profile).journal,token,profile)));
  const failed=new Map(results.flatMap((result,index)=>result.status==='rejected'?[[profiles[index].id,result.reason]]:[]));
  if(profiles.length&&failed.size===profiles.length)throw failed.values().next().value;
  const rows=results.flatMap(result=>result.status==='fulfilled'?result.value:[]);
  rows.sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name,'ko'));
  return {rows,failed};
}

async function readLegacyInstructionRows(token){
  const profile=S.staffProfiles.find(person=>staffWorkDriveFolders(person));
  if(!profile)return [];
  const files=await readAllEmployeeDriveFiles(employeeDriveFolders.instruction,token,
    " and mimeType != 'application/vnd.google-apps.folder'",'id,name,mimeType,appProperties');
  const knownIds=new Set(S.tasks.flatMap(task=>[task.id,task.instructionDriveId]).filter(Boolean));
  const rows=files.filter(file=>!knownIds.has(file.id)&&!knownIds.has(file.appProperties?.wdInstructionRequest)&&
    file.appProperties?.wdInstructionState!=='cancelled'&&
    /(?:^\d{4}-\d{2}-\d{2}_수진업무지시|→(?:수진|박수진)_업무지시)(?:\.txt)?$/.test(file.name||''))
    .map(file=>({...file,date:workDriveDate(file.name),staffId:profile.id,staffName:profile.name}))
    .filter(file=>validAttendanceDay(file.date));
  const copies=await findUnlinkedInstructionCopies(rows,tasksForStaff(profile.id),token).catch(()=>new Map());
  return rows.filter(row=>!copies.has(row.id));
}

function reportSubmittedDate(value,fallback){
  const raw=String(value||'');
  const match=raw.match(/^(\d{4})[-.\s]+(\d{1,2})[-.\s]+(\d{1,2})(?=\D|$)/);
  const date=match?[match[1],match[2].padStart(2,'0'),match[3].padStart(2,'0')].join('-'):'';
  if(raw.includes('T')&&Number.isFinite(Date.parse(raw)))return payrollCalendar.format(Date.parse(raw));
  return validAttendanceDay(date)?date:fallback;
}

async function readDriveReportBody(row,token){
  if(!safeDriveId(row.id))throw new Error('업무보고 파일을 확인하지 못했어요.');

  if(!path)throw new Error('이 파일 형식의 본문은 표시할 수 없어요.');

function bindWorkReportView(){
  const staff=$('driveReportStaff'),picker=$('driveReportDate'),output=$('managerDriveRows');
  const calendar=$('driveReportCalendar'),preview=$('driveReportPreview');
  let remote={rows:[],incomplete:false},staffId=driveReportFilters.staff,month='',selected='',selectedDate='',request=0;

  const active=()=>$('driveReportPreview')===preview;
  const resetPreview=()=>{
    request++;selected='';selectedDate='';driveReportFilters.selected='';
    const hint=staffId?'목록에서 제출일을 선택해 주세요.':'왼쪽에서 직원·스탭을 선택해 주세요.';
    preview.innerHTML=`<p class="empty">${hint}</p>`;
  };

  const bindDocumentsForDay=rows=>{
    const picker=$('sameDayReportDocument');
    if(picker)picker.onchange=()=>{
      const row=rows.find(item=>item.id===picker.value);
      if(row){
        void show(row,rows);
        $('sameDayReportDocument')?.focus();
      }
    };
  };
  const show=async (row,dayRows)=>{
    const id=++request,session=managerDriveSession;
    selected=row.id;selectedDate=row.date;driveReportFilters.selected=row.id;
    output.querySelectorAll('[data-drive-report-day]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.driveReportDay===selectedDate)));
    const documentPicker=documentsForDay(dayRows,row.id);
    if(row.report){
      const pending=status(row.task)==='보고서 제출'&&isEmployeeTask(row.task);
      preview.innerHTML=`${documentPicker}<div class="row wd123-review-actions"><button class="small" type="button" id="inlineReportPdf">PDF 저장</button>
        ${pending?'<button class="small primary" type="button" id="inlineReportComplete">검토 완료</button>':''}
        <button class="small" type="button" id="inlineReportFeedback">피드백</button></div>${reportDocument(row.owner,row.report)}`;
      bindDocumentsForDay(dayRows);
      $('inlineReportPdf').onclick=()=>printReportPdf(row.owner,row.report,row.index);
      $('inlineReportFeedback').onclick=()=>feedbackModal(row.task);
      if($('inlineReportComplete'))$('inlineReportComplete').onclick=()=>completeEmployeeReview(row.task);
      preview.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>downloadFile(button.dataset.download));
      return;
    }
    preview.innerHTML=`${documentPicker}<h3>${esc(row.name)}</h3><p class="smallText">${esc(row.staffName)} · 제출 ${esc(attendanceDate(row.date))}</p><div class="wd122-report-body" data-report-body>본문을 불러오는 중…</div>`;
    bindDocumentsForDay(dayRows);
    const body=preview.querySelector('[data-report-body]');
    try{
      if(!session||session.expires<=Date.now())throw new Error('업무센터 Drive 연결을 갱신해 주세요.');
      const text=await readDriveReportBody(row,session.token);
      if(id===request&&active())body.textContent=text||'저장된 본문이 없어요.';
    }catch(error){
      if(id===request&&active())body.textContent=error.status===401?'업무센터 Drive 연결을 갱신해 주세요.':error.status===403?'이 보고서를 읽을 권한이 없어요.':error.message;
    }
  };
  const selectDay=date=>{
    navigated=true;pendingSelection='';driveReportFilters.date=date;delete driveReportFilters.week;
    if(date)month=date.slice(0,7);
    resetPreview();
    const visible=paint();
    if(date&&visible.length)void show(visible[0],visible);
  };
  const paint=()=>{
    const filtered=mergeWorkReportRows(localWorkReportRows(),remote.rows).filter(row=>staffId&&row.staffId===staffId)
      .sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name,'ko'));
    if(!month)month=(driveReportFilters.date||filtered[0]?.date||localDay()).slice(0,7);
    const {date:day,week}=driveReportFilters;
    const dates=[...new Set(filtered.map(row=>row.date))];
    if(day&&!dates.includes(day))dates.unshift(day);
    picker.disabled=!staffId;
    picker.innerHTML='<option value="">날짜 선택</option>'+
      (week?'<option value="week">이번 주 제출</option>':'')+
      dates.map(date=>`<option value="${esc(date)}">${esc(attendanceDate(date,true))}</option>`).join('');
    picker.value=day|| (week?'week':'');
    calendar.innerHTML=driveReportCalendarMarkup(month,day,filtered);
    const shift=amount=>{
      const d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+amount);month=localDay(d).slice(0,7);
      navigated=true;paint();$(amount<0?'prevReportMonth':'nextReportMonth')?.focus();
    };
    $('prevReportMonth').onclick=()=>shift(-1);
    $('nextReportMonth').onclick=()=>shift(1);
    calendar.querySelectorAll('[data-report-day]').forEach(button=>button.onclick=()=>{
      selectDay(button.dataset.reportDay);
      $('reportCalendarButton').parentElement.open=false;
      $('reportCalendarButton').focus();
    });
    const visible=filtered.filter(row=>day?row.date===day:!week||row.date>=week.start&&row.date<=week.end);
    if(!visible.some(row=>row.id===selected)&&selected)resetPreview();
    const byDay=new Map();
    visible.forEach(row=>{
      if(!byDay.has(row.date))byDay.set(row.date,[]);
      byDay.get(row.date).push(row);
    });
    const note=remote.incomplete&&staffId?'<p class="smallText">일부 기록을 불러오지 못했어요.</p>':'';
    const hint=staffId?'선택한 기간에 제출된 업무보고가 없어요.':'왼쪽에서 직원·스탭을 선택해 주세요.';
    output.innerHTML=note+(byDay.size?[...byDay.keys()].map(date=>
      `<button type="button" class="wd133-instruction-row" data-drive-report-day="${esc(date)}" aria-pressed="${date===selectedDate}">
        <time datetime="${esc(date)}">${esc(attendanceDate(date,true))}</time></button>`).join(''):
      `<p class="empty">${hint}</p>`);
    output.querySelectorAll('[data-drive-report-day]').forEach(button=>button.onclick=()=>{
      const rows=byDay.get(button.dataset.driveReportDay);
      if(rows)void show(rows[0],rows);
    });
    return visible;
  };
  const bindStaff=()=>{
    const buttons=Array.from(staff.querySelectorAll('[data-report-staff]'));
    buttons.forEach(button=>button.onclick=()=>{
      staffId=button.dataset.reportStaff;
      buttons.forEach(item=>{
        item.setAttribute('aria-pressed',String(item===button));
        item.closest('li')?.classList.toggle('selected',item===button);
      });
      driveReportFilters.staff=staffId;
      driveReportFilters.date='';
      month='';navigated=false;pendingSelection='';
      resetPreview();paint();
    });
  };
  bindStaffRoster(staff,()=>staffRosterMarkup(reportStaffProfiles(),staffId,'report'),bindStaff);
  picker.onchange=()=>{if(picker.value!=='week')selectDay(picker.value);};
  resetPreview();
  const initialRows=paint();
  const initial=initialRows.find(row=>row.id===pendingSelection);
  if(initial)void show(initial,initialRows.filter(row=>row.date===initial.date));
  bindManagerDriveList(async token=>{
    const {rows,failed}=await readCompanyDriveReports(token);
    return {rows,incomplete:!!failed.size};
  },(_,data)=>{
    const before=selected||pendingSelection;
    pendingSelection='';
    remote=data;
    const prior=mergeWorkReportRows(localWorkReportRows(),data.rows).find(row=>row.id===before);
    if(prior)month=prior.date.slice(0,7);
    else if(!navigated&&!driveReportFilters.date)month='';
    const visible=paint();
    if(prior&&visible.some(row=>row.id===prior.id))void show(prior,visible.filter(row=>row.date===prior.date));
  },true);
}

function workElapsed(row){
  if(!row?.inAt||!row.outAt)return null;
  const minutes=Math.floor((new Date(row.outAt)-new Date(row.inAt))/60000);
  return Number.isFinite(minutes)&&minutes>=0?minutes:null;
}
function workMinutes(row){
  if(row&&Object.hasOwn(row,'ledgerMinutes'))return row.ledgerMinutes;
  const elapsed=workElapsed(row);
  return elapsed===null?null:Math.max(0,elapsed-attendanceBreak(row,elapsed));
}

function staffBankInfo(profile){
  const stored=profile?.account||'';
  if(profile&&Object.hasOwn(profile,'bank'))return {bank:profile.bank,account:stored};
  const legacy=stored.match(/^(.+?)\s+([0-9][0-9 -]*)$/);
  return legacy?{bank:legacy[1],account:legacy[2]}:{bank:'',account:stored};
}

async function staffPinKey(pin,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new Uint8Array(salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

async function encryptStaffPin(pin){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},managerStaffPinKey,new TextEncoder().encode(pin));
  return {iv:Array.from(iv),cipher:Array.from(new Uint8Array(cipher))};
}

function confirmLegacyStaffPin(profile,reveal){
  showModal(`<p>이 스탭의 기존 비밀번호를 한 번 입력하면, 비밀번호 변경 없이 눈 버튼으로 확인할 수 있습니다.</p>
    <form id="legacyPinForm"><label for="legacyStaffPin">기존 비밀번호</label><input id="legacyStaffPin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off">
    <div class="actions"><button class="primary" id="confirmLegacyPin" type="submit">확인</button></div></form>`,'기존 비밀번호 확인');
  const form=$('legacyPinForm'),button=$('confirmLegacyPin');
  $('legacyStaffPin').focus();
  form.onsubmit=async event=>{
    event.preventDefault();
    const pin=$('legacyStaffPin').value;
    if(button.disabled||!/^\d{6}$/.test(pin))return;
    button.disabled=true;
    try{
      if(await sha(pin)!==profile.pin)return notify('기존 비밀번호가 일치하지 않습니다');
      const cipher=await encryptStaffPin(pin);
      if($('legacyPinForm')!==form||currentUser!=='manager')return;
      profile.pinCipher=cipher;
      try{save()}catch(e){delete profile.pinCipher;throw e;}
      $('modalLayer').remove();reveal(pin);
    }catch(e){notify('비밀번호 확인 정보를 저장하지 못했습니다');}
    finally{button.disabled=false;}
  };
}

function unlockStaffPins(button,afterUnlock){
  if(!S.pins.manager)return notify('관리자 로그인에서 업무센터 비밀번호를 먼저 설정해 주세요.');
  if($('modalLayer'))return;
  showModal(`<p>이 로그인에서 한 번만 업무센터 관리자 비밀번호를 입력하세요.</p>
    <form id="unlockStaffPinForm"><label for="unlockStaffPin">관리자 비밀번호</label>
      <input id="unlockStaffPin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off">
      <div class="actions"><button class="primary" id="confirmStaffPinUnlock" type="submit">열람 잠금 해제</button></div>
      <p id="staffPinUnlockStatus" class="smallText" role="status"></p></form>`,'직원 비밀번호 열람');
  const form=$('unlockStaffPinForm'),input=$('unlockStaffPin'),confirm=$('confirmStaffPinUnlock'),status=$('staffPinUnlockStatus');
  input.focus();
  form.onsubmit=async event=>{
    event.preventDefault();
    const pin=input.value;
    if(confirm.disabled||!/^\d{6}$/.test(pin))return;
    confirm.disabled=true;
    const current=()=>currentUser==='manager'&&$('unlockStaffPinForm')===form&&button.isConnected;
    try{
      const digest=await sha(pin);
      if(!current())return;
      if(digest!==S.pins.manager){status.textContent='관리자 비밀번호를 다시 확인해 주세요.';input.select();return;}
      const existingSalt=S.staffPinSalt;
      const salt=existingSalt||Array.from(crypto.getRandomValues(new Uint8Array(16)));
      const key=await staffPinKey(pin,salt);
      if(!current())return;
      if(!existingSalt){
        S.staffPinSalt=salt;
        try{save();}catch(error){delete S.staffPinSalt;throw error;}
      }
      managerStaffPinKey=key;
      $('modalLayer').remove();
      await afterUnlock();
      if(button.isConnected)button.focus();
    }catch{if(current())status.textContent='열람 잠금을 해제하지 못했어요.';}
    finally{confirm.disabled=false;}
  };
}

function bindStaffPrivateValues(profile){
  const accountButton=$('showSavedStaffAccount'),accountField=$('savedStaffAccount');
  if(accountButton)accountButton.onclick=()=>{
    if(currentUser!=='manager'||!accountButton.isConnected||managerStaffId!==profile.id)return;
    const {account}=staffBankInfo(profile),show=accountButton.getAttribute('aria-pressed')!=='true';
    setStaffPrivateValue(accountButton,accountField,'계좌번호',show?account:hiddenStaffAccount,show);
  };
  const button=$('showSavedStaffPin'),field=$('savedStaffPin');
  if(!button)return;
  const current=()=>currentUser==='manager'&&$('showSavedStaffPin')===button&&managerStaffId===profile.id;
  const reveal=pin=>{if(current())setStaffPrivateValue(button,field,'기존 비밀번호',pin,true);};
  const open=async()=>{
    if(!current())return;
    if(!profile.pinCipher)return confirmLegacyStaffPin(profile,reveal);
    button.disabled=true;
    try{
      const {iv,cipher}=profile.pinCipher;
      const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(iv)},managerStaffPinKey,new Uint8Array(cipher));
      reveal(new TextDecoder().decode(data));
    }catch{if(current())notify('비밀번호를 열 수 없어요. 직원 정보 수정에서 비밀번호를 다시 저장해 주세요.');}
    finally{button.disabled=false;}
  };
  button.onclick=()=>{
    if(!current())return;
    if(button.getAttribute('aria-pressed')==='true'){
      setStaffPrivateValue(button,field,'기존 비밀번호','••••••',false);
    }else if(managerStaffPinKey)void open();
    else unlockStaffPins(button,open);
  };
}

function openStaffPermissions(profile){
  if(currentUser!=='manager'||!profile||profile.archivedAt)return;
  const grant=managerCloudGrants.get(profile.id),connection=staffPermissionConnection(profile,grant);
  let step=-1,selected=profileMenus(profile);
  const choices=Object.fromEntries(libraryPermissionMenus.map(([menu])=>[menu,{
    actions:selected.includes(menu)?libraryPreferences(profile,menu):[],categories:selected.includes(menu)?libraryCategoryPreferences(profile,menu):[]
  }]));
  showModal(`<form id="staffPermissionForm"><p class="smallText">${esc(profile.name)} · ${staffAccessLabel(profile)}</p>
    <div id="staffPermissionStep"></div>
    <p class="smallText" id="staffPermissionStatus" role="status"></p>

  const form=$('staffPermissionForm'),panel=$('staffPermissionStep'),button=$('saveStaffPermissions'),back=$('staffPermissionBack'),status=$('staffPermissionStatus');
  const read=()=>{
    const data=new FormData(form),menu=selected[step];
    if(step===-1)selected=profileMenus({visibleMenus:data.getAll('visibleMenus')});
    else if(choices[menu])choices[menu]={actions:libraryActions.filter(action=>data.getAll('libraryActions').includes(action)),
      categories:libraryCategories(menu).filter(category=>data.getAll('libraryCategories').includes(category))};
    else if(step===selected.length){
      connection.login=$('staffHqLogin').value.trim().toLowerCase();
      connection.email=$('staffGoogleEmail').value.trim().toLowerCase();
      connection.enabled=$('staffCloudEnabled').checked;
    }
  };
  const paint=()=>{
    const menu=selected[step],label=configurableMenus.find(([id])=>id===menu)?.[1];
    back.hidden=step===-1;button.textContent=step===selected.length?'권한 저장':'다음';status.textContent='';
    if(step===-1){
      panel.innerHTML=`<fieldset class="wd91-menu-settings"><legend>1. 표시할 메뉴 선택</legend><div>
        ${configurableMenus.map(([id,name])=>`<label><input type="checkbox" name="visibleMenus" value="${id}" ${selected.includes(id)?'checked':''}>${esc(name)}</label>`).join('')}
      </div></fieldset>`;return;
    }
    if(step===selected.length){
      panel.innerHTML=`<fieldset class="wd91-menu-settings"><legend>계정 연결 설정</legend>
        <div class="wd58-fields"><div><label for="staffHqLogin">본진 로그인 ID</label><input id="staffHqLogin" maxlength="96" value="${esc(connection.login)}" ${grant?'readonly':''} autocomplete="off"></div>
