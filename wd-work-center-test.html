    if(currentUser!=='manager'||instructionDrafts.get(d.staffId)!==d)return;
    if(d.raw.trim()!==request||instructionSessionCount(d)!==sessions||JSON.stringify(d.analysis)!==previous)throw new Error('요청이나 업무지시가 바뀌었어요. 새 내용으로 다시 만들어 주세요.');
    const planned=scheduledInstruction(d,payload.draft,sessions);
    if(!planned)throw new Error('요청한 회차 수와 결과가 달라요. 다시 만들어 주세요.');
    d.analysis=planned;
    d.generating=false;
    if($('generateInstruction')&&instructionStaffId===d.staffId){
      render();
      $('instructionPreview').focus();
    }
  }catch(error){
    if(currentUser==='manager'&&instructionDrafts.get(d.staffId)===d)notify(error?.name==='TimeoutError'?'GPT 응답이 지연됐어요. 다시 시도해 주세요.':error.message||'GPT 연결에 실패했어요.');
  }finally{
    d.generating=false;
    if($('generateInstruction')&&instructionStaffId===d.staffId){
      $('generateInstruction').disabled=false;
      $('instructionAiStatus').textContent='';
    }
  }
}

function bindInstructionView(){
  const staff=$('instructionStaff');
  staff.onchange=()=>{instructionStaffId=staff.value||null;render();$('instructionStaff').focus();};
  document.querySelectorAll('[data-instruction-task]').forEach(button=>button.onclick=()=>taskPreview(button.dataset.instructionTask));
  if(!$('instructionInput'))return;
  const d=instructionDrafts.get(instructionStaffId),simple=staffById(d.staffId)?.workType==='employee';
  const updatePreview=()=>{$('instructionPreview').innerHTML=instructionPreview(d,simple);};
  const schedule=$('instructionSchedule'),leftDate=$('instructionDate'),rightDate=$('instructionPreviewDate');
  const paintSchedule=()=>{schedule.innerHTML=instructionScheduleView(d,simple);};
  const syncDateFields=()=>{
    const target=instructionScheduleTarget(d,simple);
    const date=target?.date??d.date;
    if(leftDate.value!==date)leftDate.value=date;
    $('instructionDateLabel').textContent=target?((d.scheduleSession||0)+1)+'회차 배정일':'기본 배정일';
    if(rightDate&&rightDate.value!==date)rightDate.value=date;
  };
  const setAssignmentDate=(date,index=d.scheduleSession||0)=>{
    if(!simple&&d.analysis?.bySession){
      d.scheduleSession=index;
      d.analysis.items[index].date=date;
      const field=$('instructionItemDate'+index);
      if(field.value!==date)field.value=date;
    }else d.date=date;
    if(date)d.scheduleMonth=date.slice(0,7);
    syncDateFields();paintSchedule();updatePreview();
  };
  schedule.onchange=event=>{
    if(event.target.id!=='instructionScheduleSession')return;
    d.scheduleSession=Number(event.target.value);
    const date=instructionScheduleTarget(d,simple)?.date;
    if(date)d.scheduleMonth=date.slice(0,7);
    syncDateFields();paintSchedule();
    $('instructionScheduleSession').focus();
  };
  schedule.onclick=event=>{
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.scheduleTask){taskPreview(button.dataset.scheduleTask);return;}
    if(button.dataset.instructionMonth){
      const month=d.scheduleMonth||(d.date||localDay()).slice(0,7);
      const first=new Date(month+'-01T12:00:00');
      first.setMonth(first.getMonth()+Number(button.dataset.instructionMonth));
      d.scheduleMonth=localDay(first).slice(0,7);
      paintSchedule();
      schedule.querySelector('[data-instruction-month="'+button.dataset.instructionMonth+'"]')?.focus();
      return;
    }
    const date=button.dataset.instructionDate;
    if(!date)return;
    setAssignmentDate(date);
    schedule.querySelector('[aria-pressed="true"]')?.focus();
  };
  const updateSessionHint=()=>{$('instructionSessionHint').textContent=instructionSessionCount(d)+'회분으로 만들어요. 필요하면 횟수를 직접 바꿀 수 있어요.';};
  $('instructionInput').oninput=()=>{d.raw=$('instructionInput').value;if(simple)updatePreview();else updateSessionHint();};
  leftDate.oninput=()=>setAssignmentDate(leftDate.value);
  if(rightDate)rightDate.oninput=()=>setAssignmentDate(rightDate.value);
  if(!simple){
    $('instructionSessionCount').oninput=event=>{d.sessionCount=event.target.value;updateSessionHint();};
    $('analysisAnswer').oninput=()=>{d.answer=$('analysisAnswer').value;};
    $('generateInstruction').onclick=()=>generateInstructionDraft(d);
    $('copyPlanningPrompt').onclick=async()=>{
      if(!d.raw.trim())return notify('할 일을 먼저 입력하세요');
      const field=$('planningPrompt'),sessions=instructionSessionCount(d);
      field.value=analysisRequest(d)+(sessions>1?'\n출근 '+sessions+'회에 정확히 나누고, 회차별 할 일 한 줄과 그날의 단계 가이드를 작성해줘.':'');
      try{await navigator.clipboard.writeText(field.value);notify('요청문을 복사했습니다');}
      catch{field.hidden=false;field.select();notify('선택된 요청문을 복사하세요');}
    };
    $('previewAnalysis').onclick=()=>{
      const draft=parseAnalysis(d.answer);
      if(!draft)return notify('복사한 요청문으로 만든 GPT 답변을 붙여넣으세요');
      const sessions=instructionSessionCount(d);
      if(!Number.isInteger(sessions)||sessions<1||sessions>12)return notify('출근 횟수를 1~12회 사이로 입력하세요.');
      const planned=scheduledInstruction(d,draft,sessions);
      if(!planned)return notify('GPT 답변에서 할 일이 출근 횟수와 같은지 확인하세요.');
      d.analysis=planned;render();$('assignInstruction').focus();
    };
  }
  if(!$('assignInstruction'))return;
  if(!simple){
    $('instructionGoal').oninput=()=>{d.analysis.goal=$('instructionGoal').value;updatePreview();};
    d.analysis.items.forEach((item,i)=>{
      $('instructionItem'+i).oninput=event=>{
        item.text=event.target.value;
        $('instructionItemLabel'+i).textContent=(i+1)+'. '+item.text;
        updatePreview();
      };
      $('instructionItemDate'+i).oninput=event=>{
        if(d.analysis.bySession){setAssignmentDate(event.target.value,i);return;}
        item.date=event.target.value;
        updatePreview();
      };
      (item.workflow?.steps||[]).forEach((step,j)=>instructionStepFields.forEach(([key])=>{
        $('instructionStep'+i+'_'+j+'_'+key).oninput=event=>{
          step[key]=event.target.value;
          if(key==='title')$('instructionStepLabel'+i+'_'+j).textContent=(j+1)+'. '+step.title;
          updatePreview();
        };
      }));
    });
  }
  $('assignInstruction').onclick=()=>{
    const profile=staffById(d.staffId);
    const plan=simple?employeeInstructionPlan(d.raw):d.analysis;
    if(!plan)return notify('업무지시 내용을 입력하세요');
    const goal=plan.goal.trim();
    if(d.generating)return notify('GPT가 업무지시를 만든 뒤 확인하고 배정하세요');
    if(!profile||profile.archivedAt||instructionStaffId!==d.staffId)return notify('배정할 사람을 다시 선택하세요');
    if(!goal)return notify('오늘의 목표를 입력하세요');
    const groups=instructionGroups(d,plan);
    if(plan.bySession&&groups.some(([date],i)=>!date||(i>0&&date<=groups[i-1][0])))
      return notify('회차별 배정일을 서로 다른 날짜로, 빠른 순서대로 선택하세요.');
    for(const [date,items] of groups){
      if(!date||items.some(item=>!item.text.trim()||!simple&&item.workflow.steps.some(step=>instructionStepFields.some(([key])=>!step[key].trim()))))
        return notify('배정일과 할 일, 비어 있는 단계가 있는지 확인하세요');
    }
    const batch=crypto.randomUUID(),prior=S.tasks;
    const tasks=groups.map(([date,items],i)=>{
      const todos=items.map((item,j)=>({id:'todo'+j,text:simple?item.text:item.text.trim(),done:false,...(!simple?{workflow:{...item.workflow,steps:item.workflow.steps.map(step=>({...step,instruction:step.method}))}}:{})}));
      return {id:'task'+batch+'_'+i,staffId:d.staffId,simpleInstruction:simple,...(simple?{directInstruction:true}:{}),date,title:plan.bySession?items[0].text.trim():goal,objective:goal,guide:'',references:[],ack:null,work:{},reports:[],feedback:[],todos};
    });
    S.tasks=[...prior,...tasks];
    try{save();}catch(e){S.tasks=prior;return notify('배정에 실패했어요. 작성한 업무지시는 남아 있어요.');}
    instructionDrafts.delete(d.staffId);render();notify(profile.name+' 님에게 업무를 배정했습니다');
  };
}

function render(){if(!currentUser){loginView();return}let content=currentUser==='manager'&&S.nav==='managerHome'?managerHomeView():currentUser==='manager'&&S.nav==='review'?reviewView():currentUser==='manager'&&S.nav==='staff'?staffManagementView():currentUser==='manager'&&S.nav==='instructions'?instructionView():S.nav==='month'?(currentUser==='manager'&&!staffTasksOpen?staffTable():monthView()):S.nav==='reports'?reportsView():S.nav==='ideas'?ideasView():S.nav==='attendance'?attendanceView():S.nav==='drive'?driveView():dashboard();$('root').innerHTML=shell(content);document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>setNav(x.dataset.nav));document.querySelectorAll('[data-task]').forEach(x=>x.onclick=()=>S.nav==='month'?taskPreview(x.dataset.task):setTask(x.dataset.task));$('logout').onclick=logout;if($('openSticky')){$('openSticky').onclick=stickyModal;$('openSticky').setAttribute('aria-expanded',String(!!$('stickyDock')))}if(S.nav==='attendance')bindAttendance();const t=sel();if(S.nav==='managerHome'&&currentUser==='manager'){bindManagerHome()}else if(currentUser==='manager'&&S.nav==='review'){bindReviewView()}else if(currentUser==='manager'&&S.nav==='staff'){
bindStaffManagement();
}else if(currentUser==='manager'&&S.nav==='instructions'){bindInstructionView()}else if(S.nav==='dashboard'&&isEmployeeWorkspace()){bindEmployeeInstructions()}else if(S.nav==='dashboard'&&t){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=Number(b.dataset.tab);save();document.querySelectorAll('.three>.pane').forEach((p,i)=>p.classList.toggle('mobileOn',i===S.tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('primary',x===b))});document.querySelectorAll('.three>.pane').forEach((p,i)=>p.classList.toggle('mobileOn',i===S.tab));bindBoard(t)}else if(S.nav==='month'){bindTaskReports();bindAdminFilters();document.querySelectorAll('[data-staff-tasks]').forEach(b=>b.onclick=()=>{managerStaffId=b.dataset.staffTasks;staffTasksOpen=true;render()});if($('addTask'))$('addTask').onclick=()=>{setNav('instructions')}}else if(S.nav==='drive'){bindMaterials()}else if(S.nav==='reports'){bindReportButtons()}else if(S.nav==='ideas'){bindNotes()}document.querySelectorAll('[data-download]').forEach(x=>x.onclick=()=>downloadFile(x.dataset.download))}
function bindEmployee(t){if($('saveDraft'))$('saveDraft').onclick=()=>{save();notify('수행 기록을 저장했습니다')}}
function bindManager(t){$('editTask').onclick=()=>taskEditor(t);$('editTaskInline').onclick=()=>taskEditor(t)}
function extractLinks(s){return s.split(/\n/).map(s=>s.trim()).filter(s=>/^https?:\/\/[^\s]+$/i.test(s))}
function showModal(html,heading='업무지시·가이드 편집'){let layer=document.createElement('div');layer.className='modalBackdrop';layer.id='modalLayer';layer.innerHTML=`<div class="modal"><div class="row" style="justify-content:space-between"><h2>${esc(heading)}</h2><button class="small" id="closeModal">닫기 ✕</button></div>${html}</div>`;document.body.append(layer);$('closeModal').onclick=()=>layer.remove();layer.onclick=e=>{if(e.target===layer)layer.remove()}}
function taskEditor(t){let isNew=!t;let x=t||{date:'2026-11-30',title:'',objective:'',guide:'',deliverable:'',references:[]};showModal(`<label>업무 날짜</label><input type="date" id="edDate" value="${esc(x.date)}"><label>업무 제목</label><input id="edTitle" value="${esc(x.title)}"><label>오늘의 목표</label><textarea id="edObjective">${esc(x.objective)}</textarea><label>오늘 할 일 (한 줄에 하나 · 보통 3~5개)</label><textarea id="edTodos">${taskTodos(x).filter(v=>!v.sourceTask).map(v=>v.text).join('\n')}</textarea><label>업무가이드북</label><textarea id="edGuide">${esc(x.guide)}</textarea><div class="divider"></div><h3>참고 홈페이지 · 참고 시안</h3><div class="smallText">자료마다 유형·제목·링크·설명을 지정하세요. 줄마다 하나씩, | 로 구분합니다.<br>예: 참고 홈페이지 | WD WAVE | https://example.com | 회사 서비스 확인</div><textarea id="edRefs" rows="5">${(x.references||[]).map(r=>[r.type,r.name,r.url,r.note].join(' | ')).join('\n')}</textarea><div class="actions"><button class="primary" id="saveTask">${isNew?'업무 추가':'업무 수정 저장'}</button>${!isNew?'<button id="duplicateTask">이 업무 복제</button>':''}</div>`);$('saveTask').onclick=()=>{let title=$('edTitle').value.trim();if(!title)return notify('업무 제목을 입력하세요');let refs=$('edRefs').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{let [type,name,url,note]=s.split('|').map(v=>(v||'').trim());return{type,name,url,note}});let values={date:$('edDate').value,title,objective:$('edObjective').value,guide:$('edGuide').value,todos:mergeTodos(x,$('edTodos').value),references:refs};if(isNew){let task={...values,staffId:managerStaffId||'mina',id:'task'+Date.now(),ack:null,work:{},reports:[],feedback:[]};S.tasks.push(task);S.selected=task.id}else Object.assign(t,values);allReportTasks().forEach(syncFeedbackTodos);save();$('modalLayer').remove();render();notify('업무를 저장했습니다')};if(!isNew)$('duplicateTask').onclick=()=>{let obj={...t,id:'task'+Date.now(),ack:null,work:{},reports:[],feedback:[],workUnits:{},activeUnit:null,startedAt:null,showOverview:false,todos:taskTodos(t).filter(x=>!x.sourceTask).map((x,i)=>({id:'copy'+Date.now()+'_'+i,text:x.text,done:false})),title:t.title+' (새 업무)'};S.tasks.push(obj);S.selected=obj.id;save();$('modalLayer').remove();render();notify('새 업무로 복제했습니다')}}
function openDB(){return new Promise((ok,bad)=>{let q=indexedDB.open(IDB,1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)})}
async function uploadFiles(id){let files=Array.from($(id)?.files||[]),result=[];if(!files.length)return result;try{let db=await openDB();for(let file of files){if(file.size>25*1024*1024){notify('25MB 초과 파일은 제외했습니다: '+file.name);continue}let fid='file'+Date.now()+'_'+Math.random().toString(36).slice(2);await new Promise((ok,bad)=>{let q=db.transaction('files','readwrite').objectStore('files').put({id:fid,blob:file,name:file.name,type:file.type});q.onsuccess=ok;q.onerror=()=>bad(q.error)});result.push({id:fid,name:file.name,size:file.size})}db.close()}catch(e){notify('브라우저 파일 저장에 실패했습니다. 첨부를 확인하세요')}return result}
async function downloadFile(id){try{let db=await openDB(),row=await new Promise((ok,bad)=>{let q=db.transaction('files','readonly').objectStore('files').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)});db.close();if(!row)return notify('저장된 첨부파일을 찾을 수 없습니다');let u=URL.createObjectURL(row.blob),a=document.createElement('a');a.href=u;a.download=row.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){notify('파일을 열 수 없습니다')}}
render();
</script></body></html>
