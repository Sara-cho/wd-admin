function printReportPdf(owner,report,index){if($('printReport'))$('printReport').remove();let page=document.createElement('div');page.id='printReport';page.innerHTML=reportDocument(owner,report).replace(/<button\b[^>]*>[\s\S]*?<\/button>/g,'');let oldTitle=document.title;document.title=`업무보고_${(report.snapshot||owner).date}_${index+1}차`;document.body.append(page);let cleanup=()=>{page.remove();document.title=oldTitle;window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);try{window.print()}catch(e){cleanup();notify('인쇄 창을 열지 못했습니다. 브라우저의 인쇄 기능을 확인하세요')}}

function dayReportsPopup(id,selected=null){let day=S.tasks.find(t=>t.id===id);if(!day)return;let entries=submittedReportEntries(day);if(!entries.length){showModal('<div class="empty">아직 제출한 보고서가 없습니다.</div>','제출 업무보고서');return}let chosen=selected===null?(day.reports.length?day.reports.length-1:entries.length-1):Number(selected);chosen=Math.max(0,Math.min(chosen,entries.length-1));let entry=entries[chosen];let picker=entries.length>1?`<label class="wd47-version">제출 이력<select id="reportVersion">${entries.map((e,i)=>`<option value="${i}" ${i===chosen?'selected':''}>${e.owner.parentId?'이전 개별 보고 · ':''}${e.index+1}차 · ${esc(e.report.at)}</option>`).join('')}</select></label>`:'<span class="smallText">제출한 보고서</span>';openSubmittedReport(entry.owner,entry.report,entry.index,picker);if($('reportVersion'))$('reportVersion').onchange=()=>dayReportsPopup(id,Number($('reportVersion').value))}
function bindTaskReports(){document.querySelectorAll('[data-day-reports]').forEach(b=>b.onclick=()=>dayReportsPopup(b.dataset.dayReports))}
function monthView(){let t=currentUser==='manager'?tasksForStaff(managerStaffId):S.tasks;return `<div class="titleRow"><div><div class="eyebrow">NOVEMBER 2026 · ${currentUser==='manager'?'MANAGEMENT':'MY TASKS'}</div><h1>${currentUser==='manager'?esc(staffName())+' 업무목록':'11월 업무목록'}</h1><p class="muted">${currentUser==='manager'?'업무 개수·내용·마감은 자유롭게 변경할 수 있습니다.':'업무 내용과 진행상태, 제출 보고서를 한곳에서 확인하세요.'}</p></div>${currentUser==='manager'?'<div class="actions"><button data-nav="month">스탭 선택</button><button class="primary" id="addTask">+ 업무지시</button></div>':''}</div><div class="statRow"><div class="stat"><small>배정된 업무</small><b>${t.length}</b></div><div class="stat"><small>제출된 보고</small><b>${t.reduce((n,x)=>n+dayReportCount(x),0)}</b></div><div class="stat"><small>완료된 업무</small><b>${t.filter(x=>status(x)==='업무 완료').length}</b></div></div><section class="wd32-board"><div class="wd32-listtitle"><h2>업무목록</h2><span class="muted">전체 ${t.length}건</span></div>${currentUser==='manager'?`<div class="adm-filters"><input id="adminTaskQuery" placeholder="업무 제목 검색" aria-label="업무 제목 검색"><select id="adminTaskStatus" aria-label="진행 상태"><option value="">전체 상태</option><option>미제출</option><option>보고서 제출</option><option>보완 요청</option><option>업무 완료</option></select></div><p id="adminTaskEmpty" hidden>조건에 맞는 업무가 없습니다.</p>`:''}<table class="wd32-posts"><colgroup><col style="width:60px"><col style="width:130px"><col><col style="width:115px"><col style="width:115px"></colgroup><thead><tr><th>번호</th><th>업무일</th><th>업무 제목</th><th>진행상태</th><th>제출 보고서</th></tr></thead><tbody>${t.length?t.map((task,i)=>`<tr data-admin-title="${esc(task.title)}" data-admin-status="${esc(status(task))}" class="${S.selected===task.id?'selected':''}"><td class="wd32-no">${i+1}</td><td class="wd32-date">${attendanceDate(task.date)}</td><td class="wd32-title"><button data-task="${esc(task.id)}">${esc(task.title)}</button></td><td class="wd32-state"><span class="pill ${status(task)==='업무 완료'?'green':status(task)==='보완 요청'?'orange':''}">${status(task)}</span></td><td class="wd32-reports">${dayReportCount(task)?`<button class="small wd42-reportlink" data-day-reports="${esc(task.id)}">보고서 ${dayReportCount(task)}건</button>`:'<span class="wd42-none">미제출</span>'}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">등록된 업무가 없습니다.</div></td></tr>'}</tbody></table></section>`}
function taskPreview(id){
  let t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(currentUser==='manager'&&isEmployeeTask(t)){
    showModal(`<p>${esc(t.date)} · ${esc(taskStaffName(t))}</p><h3>${esc(t.title)}</h3>${employeeInstructionList(t.todos||[],t.objective||t.title,t.directInstruction)}`,'직원 업무지시');
    return;
  }
  let refs=t.references||[];
  let statusText=status(t);
  showModal(`<div class="eyebrow">${esc(t.date)} · 월간 업무</div><h2 style="margin-top:6px">${esc(t.title)}</h2><span class="pill">${statusText}</span><h3>오늘의 목표</h3><div class="info">${nl(t.objective||'업무지시가 등록되지 않았습니다.')}</div><h3>오늘 할 일</h3><ol>${taskTodos(t).map(x=>`<li>${esc(x.text)}</li>`).join()}</ol>${guideBook(t)}${refs.length?`<h3>참고자료</h3>${refHtml(t)}`:''}<p class="smallText">읽음 확인: ${esc(t.ack||'아직 읽음 확인 전')} · 제출 ${t.reports.length}건 · 피드백 ${t.feedback.length}건</p><div class="actions"><button class="primary" id="previewStart">${currentUser==='manager'?'이 업무 확인·평가':'업무 수행·보고서 작성'}</button>${currentUser==='manager'?'<button id="previewEdit">업무지시 수정</button>':''}</div>`, '업무 간단보기');
  $('previewStart').onclick=()=>{$('modalLayer').remove();setTask(id)};
  if(currentUser==='manager')$('previewEdit').onclick=()=>{$('modalLayer').remove();taskEditor(t)};
}
function currentWorkPicker(day,t){if(!t)return `<strong>${esc(day.title)}</strong>`;let units=taskUnits(day);return `<details class="wd46-taskpicker"><summary><span><b>${t.order}번 할 일</b> ${esc(t.title)}</span><i aria-hidden="true">⌄</i></summary><div class="wd46-taskmenu"><small>오늘 할 일 ${units.length}개 · 진행할 할 일을 선택하세요.</small>${units.map(u=>`<button data-pick-unit="${esc(u.id)}" class="${u.id===t.id?'selected':''}"><span><b>${u.order}번 할 일</b>${esc(u.title)}</span><em>${unitState(u)}</em></button>`).join('')}</div></details><span class="wd31-stage">${isUnitComplete(t)?t.order+'번 할 일 수행 완료':t.order+'번 할 일 안에서 · 작업순서 '+Math.min(reportFlow(t).step+1,workSteps(t).length)+' / '+workSteps(t).length}</span>`}
function head(){let day=sel(),units=taskUnits(day),t=day.startedAt&&!day.showOverview?boardTask(day):null,done=units.filter(isUnitComplete).length;return `<header class="wd31-header"><div class="wd31-title"><span>${attendanceDate(day.date)}</span><h1>업무진행판</h1><div class="wd31-counts"><span>오늘 할 일 <b>${units.length}개</b></span><span>완료 <b>${done}개</b></span></div></div><div class="wd31-current"><small>${t?isUnitComplete(t)?'현재 확인 중인 할 일':'현재 진행 중인 할 일':'오늘의 업무'}</small>${currentWorkPicker(day,t)}</div><div class="wd31-actions">${currentUser==='manager'?'<button class="small" id="editTask">업무지시 편집</button><button class="small" id="editWorkflow">진행 단계 설정</button>':''}${currentUser==='employee'?`<button class="wd44-viewtoday" id="viewTodayWork">오늘 업무 확인</button><button class="primary" id="previewDaily" ${!hasAcknowledgedWork(day)||!allUnitsComplete(day)||activeStepUploads?'disabled':''} title="모든 할 일을 완료한 뒤 업무보고서를 제출합니다">업무보고서 제출</button>`:''}</div></header>`}

function refHtml(t){return t.references.length?t.references.map(r=>`<div class="resource"><b>${esc(r.name)}</b> <small>${esc(r.type)}</small><br>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a>`:''}${r.note?`<div class="smallText">${nl(r.note)}</div>`:''}</div>`).join(''):'<p class="smallText">등록된 참고자료가 없습니다.</p>'}
function unitSelector(t,mobile=false){let day=S.tasks.find(d=>d.id===t.parentId)||sel(),units=taskUnits(day);return `<div class="${mobile?'wd29-mobile-picker':'wd29-picker'}"><label>오늘 할 일 · ${t.order}/${units.length}</label><select data-unit-select aria-label="진행할 할 일 선택">${units.map(u=>`<option value="${esc(u.id)}" ${u.id===t.id?'selected':''}>${u.order}. ${esc(u.title)} · ${unitState(u)}</option>`).join('')}</select></div>`}
const GUIDE_DETAILS={
check_1:{method:'1. 홈페이지·회사소개서·제안서 등 지정된 자료를 실제로 열어보세요.\n2. 로고·색상·글씨체·사진·페이지 구성과 전체 분위기를 살펴보세요. 어떤 특징이 있고 왜 그렇게 느꼈는지 구체적으로 기록하세요.\n3. 우리 업무에 적용하거나 사용할 부분을 고르고 활용 방법과 이유를 정리하세요.',format:"1. 확인자료명 : 홈페이지, 회사소개서, 제안서 등 실제 확인한 자료명\n2. 확인한 부분 : 로고·색상·글씨체·사진·페이지 구성·전체 분위기를 살펴보고, 눈에 띈 특징을 구체적으로 설명\n3. 적용하거나 사용할 부분 : 어떤 요소를 어느 업무에 사용할지와 선택한 이유",evidence:'홈페이지 링크와 제공받은 소개서 파일명을 남기세요. 이미지나 자료 사본이 필요하면 이 단계에 첨부하세요. 별도 보고서 파일을 다시 만들 필요는 없습니다.'},
check_2:{method:'1. 제공하는 서비스를 항목별로 정리하세요.\n2. 각 서비스가 어떤 고객에게 어떤 도움을 주는지 연결하세요.\n3. 홍보자료에서 반복해서 강조하는 차별점과 추가로 확인할 내용을 정리하세요.',format:"1. 파악한 회사 서비스 : 실제 자료에서 확인한 서비스와 주요 내용\n2. 주요 고객과 필요한 도움 : 어떤 고객이 어떤 이유로 이용할지\n3. 회사의 특징과 강점 : 자료에서 확인한 근거와 함께 설명\n4. 업무에 활용할 내용 : 홍보·상담·콘텐츠에 사용할 내용과 방법\n5. 추가 확인할 사항 : 자료만으로 알 수 없는 내용",evidence:'오른쪽 기록을 기본 결과물로 사용하세요. 관련 문구나 이미지를 비교한 표가 있으면 표 파일·이미지를 첨부해도 됩니다.'},
research_1:{method:'1. 조사 목적과 활용할 업무를 정하세요.\n2. 대상 고객·업종·주제·채널 등 검색 범위를 좁히세요.\n3. 비교할 기준을 3~5개 정하고 검색어를 적으세요.',format:"1. 조사 목적 : 이번 조사로 알아내려는 내용과 활용할 업무\n2. 조사 대상 : 살펴볼 업종·고객·채널·주제\n3. 검색할 단어와 경로 : 실제 사용할 검색어와 사이트\n4. 비교할 기준 : 어떤 항목으로 좋고 나쁨을 판단할지",evidence:'이 단계에서는 조사 계획을 오른쪽에 정리하면 됩니다. 제공받은 조사 기준표가 있으면 첨부하세요.'},
research_2:{method:'1. 정한 검색어로 사례를 찾으세요.\n2. 각 사례의 원문을 열고 게시일·핵심 내용·표현 방식·확인 가능한 반응을 확인하세요.\n3. 같은 기준으로 비교해 공통점과 차이를 정리하세요. 확인되지 않는 수치는 미확인으로 표시하세요.',format:"1. 조사한 자료·사례명 : 계정·게시물·사이트 이름\n2. 출처 : 원문 링크와 확인한 날짜\n3. 자세히 확인한 내용 : 구성·표현·특징과 눈에 띈 부분\n4. 확인한 반응과 근거 : 조회·댓글 등 실제 확인한 수치와 반응\n5. 비교해서 알게 된 점 : 다른 사례와의 공통점·차이점\n6. 적용하거나 사용할 부분 : 우리 업무에 맞는 요소와 활용 방법\n여러 사례가 있으면 사례별로 위 항목을 반복해 정리하세요.",evidence:'출처 링크와 필요한 화면 캡처를 이 단계에 첨부하세요. 비교표를 파일이나 이미지로 만들었다면 함께 첨부하세요.'},
research_3:{method:'1. 비교한 사례 중 활용할 사례를 고르세요.\n2. 우리 고객·목적·작업 여건에 맞는 이유를 설명하세요.\n3. 그대로 사용할 요소와 우리 상황에 맞게 바꿀 요소를 구분하세요.',format:"1. 선정한 자료·사례 : 무엇을 참고하기로 했는지\n2. 선정 이유 : 비교한 결과와 우리 상황에 맞는 근거\n3. 적용할 부분 : 가져올 요소와 사용할 업무\n4. 바꾸어 사용할 부분 : 우리 고객·브랜드에 맞게 수정할 점\n5. 기대하는 결과 : 기대 이유와 이후 확인할 방법",evidence:'선정한 사례의 링크와 비교표의 해당 항목을 남기세요. 기대 효과는 확인된 성과와 구분해서 적으세요.'},
create_1:{method:'1. 우리 채널의 최근 게시물과 주요 고객, 이번 홍보 목적을 확인하세요.\n2. 비슷한 고객·주제를 다룬 콘텐츠를 찾아보세요.\n3. 단순 인기 순위 대신 표현 방식과 확인 가능한 반응을 같은 기준으로 비교하세요.',format:"1. 찾아본 사례 : 계정·게시물 이름과 원문 링크\n2. 자세히 살펴본 부분 : 제목·이미지·문구·구성·분위기\n3. 확인한 반응 : 조회·좋아요·댓글 등 확인된 반응\n4. 반응이 나온 것으로 생각한 이유 : 어떤 요소 때문이라고 판단했는지와 근거\n5. 우리가 참고할 부분 : 우리 상황에 맞춰 적용할 요소와 방법\n사례가 여러 개라면 사례별로 나누어 작성하세요.",evidence:'참고 게시물 링크와 확인한 반응의 화면 캡처를 첨부하세요. 비교표 파일·이미지는 이 단계에 함께 넣으세요.'},
create_2:{method:'1. 우리 채널에 현재 필요한 콘텐츠를 정하세요.\n2. 비교 사례에서 확인한 반응과 참고할 요소를 고르세요.\n3. 오늘 올릴 주제·대상·형식을 정하고 우리 브랜드에 맞게 바꿀 방법을 적으세요.\n4. 기대하는 반응과 게시 후 확인할 지표를 정하세요.',format:"1. 우리의 현재 상황 : 고객·채널·홍보 목적에서 지금 필요한 것\n2. 오늘 제작할 주제 : 누구에게 무엇을 전달할지\n3. 참고한 사례와 확인 근거 : 어떤 사례에서 어떤 반응을 확인했는지\n4. 이 주제를 선택한 이유 : 우리 상황과 참고 근거를 연결해 설명\n5. 우리에게 적용할 방법 : 문구·이미지·구성을 어떻게 바꿔 사용할지\n6. 기대하는 반응과 확인 방법 : 왜 그런 반응을 예상하며 어떤 지표로 확인할지",evidence:'선정 이유에 사용한 링크·수치를 남기세요. 기획안을 별도 파일로 만들었다면 첨부하고, 그렇지 않으면 오른쪽 기획 메모를 결과물로 사용하세요.'},
create_3:{method:'1. 선정한 주제와 핵심 메시지를 기준으로 문구 초안을 쓰세요.\n2. 제작 도구에서 이미지·카드·영상 등 정한 형식으로 제작하세요.\n3. 제목·본문·이미지 순서·마지막 행동 안내를 맞추세요.\n4. 참고 사례에서 적용한 점과 작업 중 바꾼 점을 기록하세요.',format:"1. 제작한 내용 : 실제 만든 콘텐츠와 구성\n2. 사용한 도구와 자료 : 제작 도구·참고 자료·이미지 출처\n3. 작업한 방법 : 어떤 순서로 무엇을 만들었는지\n4. 적용하거나 변경한 부분 : 기획 내용을 어떻게 반영했고 무엇을 바꿨는지\n5. 결과물 위치 : 파일명·작업 링크와 첨부 내용",evidence:'제작한 이미지·영상·문서 또는 열람 가능한 작업 링크를 첨부하세요. 편집 가능한 원본 링크와 검토용 이미지가 있으면 함께 남기세요.'},
create_4:{method:'1. 오탈자·회사명·연락처·출처·링크를 점검하세요.\n2. 선정한 목적과 핵심 메시지가 제작물에 반영됐는지 확인하세요.\n3. 파일이 열리고 링크가 작동하는지 확인하세요.\n4. 완료한 부분과 지점장 검토가 필요한 부분을 구분하세요.',format:"1. 완성한 결과물 : 콘텐츠 제목·파일명·링크\n2. 점검한 내용 : 오탈자·연락처·출처·이미지·링크 확인 결과\n3. 기획과 비교한 결과 : 선정한 목적과 메시지가 어떻게 반영됐는지\n4. 검토받을 부분 : 지점장에게 확인받을 내용\n5. 남은 작업 : 추가 수정이나 게시 전 필요한 일",evidence:'검토할 최종 파일·이미지·영상·링크를 이 단계에 첨부하세요. 검토용 결과물은 업무 진행 기록에, 확정된 완성본은 자료실의 완성자료에 등록하세요.'},
revise_1:{method:'받은 피드백을 항목별로 나누세요. 수정할 위치·요청 내용·확인이 필요한 점을 정리하고 원본 버전을 확인하세요.',format:"1. 받은 수정 요청 : 피드백의 항목별 내용\n2. 수정할 자료와 위치 : 원본 파일·페이지·문구·이미지\n3. 수정할 방법 : 각 요청을 어떻게 반영할지\n4. 먼저 확인할 사항 : 요청 중 불명확한 내용",evidence:'수정 요청의 원문·참고 이미지·기존 결과물 링크를 이 단계에 첨부하세요.'},
revise_2:{method:'항목별로 수정한 뒤 요청 내용과 비교하세요. 기존 결과물을 보존하고 수정본이 구분되도록 저장하세요.',format:"1. 수정한 자료명 : 수정본 파일명·링크\n2. 실제 수정한 부분 : 요청별로 무엇을 어떻게 바꿨는지\n3. 수정 전후 차이 : 변경된 내용과 이유\n4. 아직 수정하지 못한 부분 : 사유와 필요한 확인",evidence:'수정본과 필요한 전후 비교 캡처를 첨부하세요.'},
revise_3:{method:'수정 요청이 모두 반영됐는지 확인하세요. 미반영 항목은 이유와 확인할 내용을 남기세요.',format:"1. 반영 완료한 항목 : 수정 요청과 확인 결과\n2. 최종 수정본 : 검토할 파일명·링크\n3. 추가 확인이 필요한 항목 : 남은 내용과 이유\n4. 다음 작업 : 승인 후 진행할 일",evidence:'검토받을 수정 결과물과 열람 가능한 링크를 남기세요.'}
};
function recordFormat(step){return step.recordFormat&&!/[|「→]/.test(step.recordFormat)?step.recordFormat:GUIDE_DETAILS[step.id]?.format||'1. 수행한 일 :\n2. 작업한 방법 :\n3. 확인한 결과 :\n4. 적용하거나 사용할 부분 :\n5. 추가 확인할 사항 :'}
function recordOutline(step){return recordFormat(step).split('\n').filter(line=>/^\d+\./.test(line)).map(line=>line.split(/\s*[:：]\s*/)[0]+' : ').join('\n')}
function guideDetail(step){return {method:step.method||GUIDE_DETAILS[step.id]?.method||'안내에 따라 필요한 자료를 확인하고 지시된 순서로 작업하세요. 진행 중 판단이 필요한 내용은 확인 요청으로 남기세요.',format:recordFormat(step),evidence:step.evidence||GUIDE_DETAILS[step.id]?.evidence||'파일·사진·링크가 필요한 작업이면 해당 단계에 첨부하세요. 결과물 형식이 지정됐다면 그 형식에 맞춰 저장하세요.'}}
function guideBook(t){return `<section class="wd40-guide">${workSteps(t).map((step,i)=>{let detail=guideDetail(step);return `<section class="wd40-guidesection"><h3><span>${String(i+1).padStart(2,'0')}</span>${esc(step.title)}</h3>${step.instruction&&step.instruction!==detail.method?`<p class="wd40-intro">${nl(step.instruction)}</p>`:''}<h4>진행 방법</h4><p>${nl(detail.method)}</p><h4>업무보고에 적을 내용</h4><p>${nl(detail.format)}</p><h4>남길 자료 · 파일</h4><p>${nl(detail.evidence)}</p></section>`}).join('')}</section>`}
function bindGuide(t){document.querySelectorAll('[data-guide-step]').forEach(b=>b.onclick=()=>{if(activeStepUploads)return notify('첨부 저장이 끝난 뒤 이동하세요');let index=Number(b.dataset.guideStep);t.guideView=index;if(currentUser==='employee'){let f=reportFlow(t),steps=workSteps(t),first=steps.findIndex((_,i)=>!f.confirmed[i]),reachable=first<0?steps.length-1:first;if(index<=reachable){f.step=index;S.tab=1}}save();render()})}

function empLeft(t){return `<section class="pane wd40-manual"><div class="paneHead"><h2>업무가이드북</h2><p class="smallText">안내를 읽으며 작업하고 오른쪽에 기록하세요.</p></div><div class="paneBody">${guideBook(t)}<h3>참고 홈페이지 · 참고 시안</h3>${refHtml(t)}${currentUser==='manager'?'<div class="actions"><button id="editTaskInline">오늘 업무지시 수정</button></div>':''}${currentUser==='manager'||t.feedback.length?`<div class="actions"><button class="small" id="openFeedback">${currentUser==='manager'?'피드백 작성·확인':'지점장 피드백 보기'}${t.feedback.length?' · '+t.feedback.length+'건':''}</button></div>`:''}</div></section>`}
function attachmentArea(prefix,label,types){return `<div class="mediaChip"><b>${label}</b><div class="smallText">선택 사항 · 여러 개 등록 가능</div><input type="file" id="${prefix}files" multiple ${types?`accept="${types}"`:''}><div id="${prefix}filelist"></div><label>관련 링크 (한 줄에 하나)</label><textarea id="${prefix}links" placeholder="https://..."></textarea></div>`}
const REPORT_FIELDS=[
['plan','업무 이해','이번 업무의 목적과 내가 해야 할 일을 어떻게 이해했는지 적어주세요.'],
['research','조사 내용 · 출처','어디에서 무엇을 찾아봤는지, 확인한 내용과 자료명·주소를 적어주세요.'],
['decision','선택한 방법 · 이유','조사한 내용을 비교해 무엇을 선택했고, 왜 적합하다고 판단했는지 적어주세요.'],
['execution','업무 진행 과정','선택한 방법으로 실제 어떤 순서와 방법으로 작업했는지 적어주세요.'],
['outcome','수행 결과 · 결과물','무엇을 완료했는지 적고, 아래에 결과물 파일이나 링크를 첨부해 주세요.'],
['issues','미완료 · 확인 요청','남은 일, 막힌 부분, 지점장님께 확인받을 내용을 적어주세요.']
];
function previousWorkNotes(t,w){let entries=Object.entries(w.todoResults||{}).filter(([k,v])=>String(v||'').trim());return entries.length?`<details class="wd21-previous"><summary>이전에 작성한 할 일별 메모</summary>${entries.map(([k,v])=>`<h3>${esc((taskTodos(t).find(x=>x.id===k)||{}).text||'이전 업무 메모')}</h3><p>${nl(v)}</p>`).join('')}</details>`:''}
const WORKFLOW_TYPES={check:'자료 확인',research:'조사·비교',create:'제작',revise:'수정·보완',general:'일반 실행'};
const WORKFLOW_TEMPLATES={
check:[['자료 확인','회사 홈페이지·소개서·기존 홍보자료를 열어보세요. 확인한 자료명과 링크, 살펴본 부분을 남겨주세요.'],['확인한 내용 정리','확인한 자료를 바탕으로 회사의 서비스, 주요 고객, 홍보할 때 강조할 특징을 정리하세요.']],
research:[['조사 기준 정하기','무엇을 알아보기 위한 조사인지 정하고, 자료나 사례를 비교할 기준을 적으세요.'],['자료 조사·비교','관련 자료나 사례를 찾아 출처 링크와 확인한 특징을 기록하세요. 정한 기준에 따라 공통점과 차이점을 비교하세요.'],['참고할 사례 선정','참고할 자료나 사례를 고르고 선정 이유를 적으세요. 이번 업무에 활용할 부분을 구체적으로 정리하세요.']],
create:[['유사 사례 찾기','우리의 현재 채널 상태와 주요 고객을 확인하고, 이번에 만들 콘텐츠와 비슷한 사례를 찾아보세요.\n사례별 링크·내용·표현 방식과 확인 가능한 조회·좋아요·댓글 등 반응을 기록하세요. 반응이 좋다고 판단한 비교 기준을 적고, 확인할 수 없는 수치는 미확인으로 남기세요.'],['오늘 올릴 콘텐츠 선정·이유','① 우리 상황: 현재 채널·고객·홍보 목적에서 무엇이 필요한가요?\n② 참고 근거: 어떤 사례에서 어떤 반응을 확인했나요? 링크·수치·비교 기준을 적으세요.\n③ 선정·적용: 오늘 어떤 주제를 올릴지 정하고, 사례의 어떤 요소를 우리 고객과 브랜드에 맞게 바꿀지 적으세요.\n④ 기대 반응: 왜 그런 반응을 기대하는지 가설과 게시 후 확인할 지표를 적으세요. 기대는 실제 성과와 구분하세요.'],['콘텐츠 제작','선정한 주제와 적용 방법에 맞춰 문구·이미지·구성을 제작하세요.\n선정 단계에서 정한 방향이 제작물에 어떻게 반영됐는지와 실제 작업한 내용을 기록하세요.'],['결과물 확인·검토 요청','완성한 내용이 선정 이유와 홍보 목적에 맞는지 확인하세요. 출처·문구·이미지·링크를 점검하고 결과 요약과 검토 요청을 남기세요.\n이 단계에 결과물 파일이나 링크를 첨부하세요. 게시 후 반응은 실제 확인한 경우에만 기록하세요.']],
revise:[['수정 요청 확인','받은 피드백에서 무엇을 수정해야 하는지 항목별로 정리하세요. 확인이 필요한 요청도 남겨주세요.'],['수정 작업','요청 항목별로 실제 바꾼 부분과 수정 방법을 적으세요.'],['수정 결과 확인','요청 내용이 반영됐는지 확인하고, 바뀐 결과와 남은 사항을 적으세요. 수정한 파일이나 링크는 해당 단계에 첨부하세요.']],
general:[['작업 준비','지시받은 일을 수행하는 데 필요한 자료와 준비할 내용을 확인하고 기록하세요.'],['작업 진행','지시된 일을 순서대로 수행하고 실제 진행한 내용을 기록하세요.'],['결과 정리','완료한 결과와 남은 사항을 적으세요. 결과물이 있으면 해당 단계에 첨부하세요.']]
};
function suggestWorkflowType(text){if(/피드백|보완|수정/.test(text))return 'revise';if(/제작|만들|디자인|기획|작성|편집|게시/.test(text))return 'create';if(/조사|비교|선정|분석|살피/.test(text))return 'research';if(/확인|읽|파악|살펴/.test(text))return 'check';return 'general'}
function makeWorkflow(type){type=WORKFLOW_TYPES[type]?type:'general';return {type,steps:WORKFLOW_TEMPLATES[type].map(([title,instruction],i)=>({id:type+'_'+(i+1),title,instruction}))}}
function workSteps(t){return (t.workflow||makeWorkflow(suggestWorkflowType(t.title||''))).steps}
function applyWorkflow(t,workflow){let signature=JSON.stringify(workflow);if(t.workflowSignature!==signature){if(t.workflow&&Object.values(t.stepAnswers||{}).some(v=>String(v||'').trim())){t.workflowDrafts=t.workflowDrafts||[];t.workflowDrafts.push({workflow:JSON.parse(JSON.stringify(t.workflow)),answers:JSON.parse(JSON.stringify(t.stepAnswers)),at:now()})}t.workflow=JSON.parse(signature);t.workflowSignature=signature;t.reportFlow={step:0,confirmed:[]};t.completedAt=null;t.completedSignature=null}t.stepAnswers=t.stepAnswers||{};return t.workflow}
function oldDraft(t){let w=t.work||{};let archived=(t.workflowDrafts||[]).map(d=>`<details class="wd24-legacy"><summary>단계 변경 전 작성 기록 · ${esc(d.at)}</summary>${d.workflow.steps.filter(step=>d.answers[step.id]).map(step=>`<h3>${esc(step.title)}</h3><p>${nl(d.answers[step.id])}</p>`).join('')}</details>`).join('');return archived+(REPORT_FIELDS.some(([k])=>String(w[k]||'').trim())?`<details class="wd24-legacy"><summary>기존 양식으로 작성한 내용</summary>${REPORT_FIELDS.filter(([k])=>w[k]).map(([k,l])=>`<h3>${l}</h3><p>${nl(w[k])}</p>`).join('')}</details>`:'')}
function workflowEditor(day){let units=taskUnits(day),selected=boardTask(day)?.todoId||taskTodos(day)[0]?.id;if(!selected)return notify('먼저 할 일을 등록하세요');let drafts={};taskTodos(day).forEach(todo=>drafts[todo.id]=JSON.parse(JSON.stringify(todo.workflow||makeWorkflow(suggestWorkflowType(todo.text)))));let capture=()=>{let wf=drafts[selected];wf.steps=Array.from(document.querySelectorAll('[data-wf-row]')).map(row=>({id:row.dataset.wfRow,title:row.querySelector('[data-wf-title]').value.trim(),instruction:row.querySelector('[data-wf-instruction]').value.trim(),method:row.querySelector('[data-wf-method]').value.trim(),recordFormat:row.querySelector('[data-wf-format]').value.trim(),evidence:row.querySelector('[data-wf-evidence]').value.trim()}))};let paint=()=>{let wf=drafts[selected];showModal(`<p class="smallText">할 일별로 스탭이 수행할 순서와 작성할 내용을 설정합니다.</p><label>설정할 할 일</label><select id="wfTask">${taskTodos(day).map((todo,i)=>`<option value="${esc(todo.id)}" ${todo.id===selected?'selected':''}>${i+1}. ${esc(todo.text)}</option>`).join('')}</select><div class="row"><div style="flex:1"><label>업무 유형</label><select id="wfType">${Object.entries(WORKFLOW_TYPES).map(([key,label])=>`<option value="${key}" ${wf.type===key?'selected':''}>${label}</option>`).join('')}</select></div><button id="wfTemplate" style="margin-top:35px">유형별 기본 단계 적용</button></div><p class="smallText">제목을 기준으로 기본 유형을 제안합니다. 안내 내용은 업무에 맞게 수정하세요.</p><div class="wd26-editsteps">${wf.steps.map((step,i)=>`<section class="wd26-editstep" data-wf-row="${esc(step.id)}"><div class="row" style="justify-content:space-between"><b>순서 ${i+1}</b><div class="row"><button class="small" data-wf-up="${i}" ${i===0?'disabled':''}>위로</button><button class="small" data-wf-down="${i}" ${i===wf.steps.length-1?'disabled':''}>아래로</button><button class="small" data-wf-remove="${i}" ${wf.steps.length===1?'disabled':''}>삭제</button></div></div><label>단계 제목</label><input data-wf-title value="${esc(step.title)}"><label>스탭이 할 일 · 기록할 내용</label><textarea data-wf-instruction>${esc(step.instruction)}</textarea><label>작업 방법</label><textarea data-wf-method>${esc(guideDetail(step).method)}</textarea><label>기록·정리 형식</label><textarea data-wf-format>${esc(guideDetail(step).format)}</textarea><label>남길 자료·파일</label><textarea data-wf-evidence>${esc(guideDetail(step).evidence)}</textarea></section>`).join('')}</div><div class="actions"><button id="wfAdd">+ 단계 추가</button><button class="primary" id="wfSave">진행 단계 저장</button></div><p class="smallText">단계를 바꾸면 스탭이 새 안내를 다시 확인합니다. 기존 작성 내용과 제출 보고서는 보존됩니다.</p>`,'할 일별 진행 단계 설정');$('wfTask').onchange=e=>{let id=e.target.value;capture();selected=id;$('modalLayer').remove();paint()};$('wfType').onchange=e=>{drafts[selected].type=e.target.value};$('wfTemplate').onclick=()=>{drafts[selected]=makeWorkflow($('wfType').value);$('modalLayer').remove();paint()};document.querySelectorAll('[data-wf-up],[data-wf-down],[data-wf-remove]').forEach(button=>button.onclick=()=>{capture();let list=drafts[selected].steps;let index=Number(button.dataset.wfUp??button.dataset.wfDown??button.dataset.wfRemove);if(button.dataset.wfRemove!==undefined)list.splice(index,1);else{let dest=index+(button.dataset.wfUp!==undefined?-1:1);[list[index],list[dest]]=[list[dest],list[index]]}$('modalLayer').remove();paint()});$('wfAdd').onclick=()=>{capture();drafts[selected].steps.push({id:'custom_'+Date.now(),title:'',instruction:''});$('modalLayer').remove();paint()};$('wfSave').onclick=()=>{capture();if(Object.values(drafts).some(w=>!w.steps.length||w.steps.some(step=>!step.title||!step.instruction)))return notify('모든 단계의 제목과 안내 내용을 입력하세요');taskTodos(day).forEach(todo=>todo.workflow=JSON.parse(JSON.stringify(drafts[todo.id])));taskUnits(day);save();$('modalLayer').remove();render();notify('할 일별 진행 단계를 저장했습니다')};};paint()}

let activeStepUploads=0;
function stepAssets(t,id){t.stepAssets=t.stepAssets||{};return t.stepAssets[id]||(t.stepAssets[id]={files:[],links:[],linkDraft:''})}
function invalidateUnit(t,index){t.completedAt=null;t.completedSignature=null;if(t.reportFlow)t.reportFlow.confirmed=t.reportFlow.confirmed.slice(0,index)}
function isUnitComplete(t){let steps=workSteps(t);return !!t.completedAt&&t.completedSignature===t.workflowSignature&&steps.every((s,i)=>t.reportFlow?.confirmed[i]&&String(t.stepAnswers?.[s.id]||'').trim())}
function allUnitsComplete(day){let units=taskUnits(day);return units.length>0&&units.every(isUnitComplete)}
function flushStepLinks(t,id){let a=stepAssets(t,id),lines=a.linkDraft.split('\n').map(x=>x.trim()).filter(Boolean);if(lines.some(u=>{try{let url=new URL(u);return !['https:','http:'].includes(url.protocol)}catch{return true}})){notify('링크는 http:// 또는 https:// 주소로 입력하세요');return false}a.links=[...new Set([...a.links,...lines])];a.linkDraft='';return true}
function stepAttachmentHTML(t,id){let a=stepAssets(t,id);return `<details class="wd28-assets"><summary>이 단계의 파일 · 사진 · 링크 첨부하기</summary><label class="smallText">파일·사진 첨부 (여러 개 선택 가능)</label><input type="file" id="stagefiles" multiple><div class="smallText">선택하면 이 단계에 저장됩니다.${activeStepUploads?' 첨부 저장 중…':''}</div>${a.files.map((f,i)=>`<div class="mediaRow">${esc(f.name)} <button class="small" data-download="${esc(f.id)}">열기</button><button class="small" data-remove-stage-file="${i}">첨부 제외</button></div>`).join('')}<label for="stageLinks">관련 링크</label><textarea id="stageLinks" placeholder="https://… (한 줄에 하나)">${esc(a.linkDraft||'')}</textarea><button class="small" id="addStageLinks">링크 추가</button>${a.links.map((url,i)=>`<div class="mediaRow"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a> <button class="small" data-remove-stage-link="${i}">제외</button></div>`).join('')}</details>`}
function bindStepAttachments(t){let f=reportFlow(t),steps=workSteps(t);if(f.step>=steps.length)return;let index=f.step,id=steps[index].id,a=stepAssets(t,id);if($('stagefiles'))$('stagefiles').onchange=async()=>{activeStepUploads++;try{let files=await uploadFiles('stagefiles');if(files.length){a.files.push(...files);invalidateUnit(t,index);save()}}finally{activeStepUploads--;render()}};if($('stageLinks'))$('stageLinks').oninput=()=>{a.linkDraft=$('stageLinks').value;invalidateUnit(t,index);save()};if($('addStageLinks'))$('addStageLinks').onclick=()=>{if(flushStepLinks(t,id)){invalidateUnit(t,index);save();render()}};document.querySelectorAll('[data-remove-stage-file]').forEach(b=>b.onclick=()=>{a.files.splice(Number(b.dataset.removeStageFile),1);invalidateUnit(t,index);save();render()});document.querySelectorAll('[data-remove-stage-link]').forEach(b=>b.onclick=()=>{a.links.splice(Number(b.dataset.removeStageLink),1);invalidateUnit(t,index);save();render()})}
function dailyReport(day){return {formVersion:4,at:'제출 전',snapshot:{date:day.date,title:day.title,objective:day.objective,staffName:taskStaffName(day)},units:JSON.parse(JSON.stringify(taskUnits(day).map(u=>({id:u.id,title:u.title,order:u.order,workflow:u.workflow,stepAnswers:u.stepAnswers,stepAssets:u.stepAssets||{},issues:u.work.issues||'',completedAt:u.completedAt,completionVersion:u.completionVersion}))))}}
function dailyReportModal(day){if(activeStepUploads)return notify('첨부파일 저장이 끝난 뒤 확인해 주세요');if(!allUnitsComplete(day))return notify('오늘의 모든 할 일을 마친 뒤 보고서를 확인할 수 있습니다');let draft=dailyReport(day);showModal(`${reportDocument(day,draft)}<div class="actions"><button class="primary" id="submitDaily">업무보고서 제출</button></div>`,'업무보고서 제출 전 확인');document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.download));$('submitDaily').onclick=()=>{if(!allUnitsComplete(day)||activeStepUploads)return notify('모든 할 일과 첨부 저장 상태를 확인하세요');let current=dailyReport(day);if(JSON.stringify(current)!==JSON.stringify(draft))return notify('내용이 변경됐습니다. 창을 닫고 보고서를 다시 확인하세요');draft.at=now();day.reports.push(JSON.parse(JSON.stringify(draft)));save();$('modalLayer').remove();render();notify('오늘의 모든 할 일을 하나의 보고서로 제출했습니다')}}
function dailyFooter(day){let units=taskUnits(day),done=units.filter(isUnitComplete).length;return `<section class="card wd28-daily"><div><h2>오늘 업무보고</h2><p class="smallText">할 일 ${done}/${units.length}개 수행 완료 · 모든 할 일을 마친 뒤 하나의 보고서로 제출합니다.</p></div>${currentUser==='employee'?`<button class="primary" id="previewDaily" ${done!==units.length||!units.length||activeStepUploads?'disabled':''}>오늘 업무보고서 확인</button>`:''}${day.reports.length?`<details><summary>제출한 오늘 업무보고 (${day.reports.length}건)</summary>${reportList(day)}</details>`:''}</section>`}

function reportFlow(t){let steps=workSteps(t);if(!t.reportFlow)t.reportFlow={step:0,confirmed:[]};let f=t.reportFlow;f.confirmed=Array.isArray(f.confirmed)?f.confirmed:[];let first=steps.findIndex((_,i)=>!f.confirmed[i]);f.step=Math.max(0,Math.min(Number(f.step)||0,first<0?steps.length:first));return f}
function stageRail(t){let steps=workSteps(t),flow=reportFlow(t);return `<nav class="wd41-rail" aria-label="현재 할 일 안의 작업순서"><span class="wd41-raillabel">${t.order}번 할 일의 작업순서</span>${steps.map((item,i)=>`<button data-report-step="${i}" title="${esc(item.title)}" class="${i===(currentUser==='manager'&&Number.isInteger(t.guideView)?t.guideView:Math.min(flow.step,steps.length-1))?'active':''} ${flow.confirmed[i]?'done':''}" ${currentUser==='employee'&&i>flow.step&&!Array.from({length:i},(_,j)=>flow.confirmed[j]).every(Boolean)?'disabled':''} ${i===flow.step?'aria-current="step"':''}><span>${flow.confirmed[i]?'✓':i+1}</span><div><b>순서 ${i+1}</b><small>${esc(item.title)}</small></div></button>`).join('')}${currentUser==='manager'?'<button class="small" id="editTaskInline">업무지시 수정</button>':''}${currentUser==='manager'||t.feedback.length?`<button class="small wd41-feedback" id="openFeedback">피드백${t.feedback.length?' '+t.feedback.length+'건':''}</button>`:''}</nav>`}
function empMid(t){let steps=workSteps(t),flow=reportFlow(t),step=flow.step,ready=step===steps.length,active=steps[Math.min(step,steps.length-1)],detail=guideDetail(active),answers=t.stepAnswers||{};return `<section class="pane wd41-work"><div class="wd41-stagehead"><div><small>${ready?t.order+'번 할 일 완료':t.order+'번 할 일 · 작업순서 '+(step+1)+' / '+steps.length}</small><h2>${ready?'수행 기록이 저장됐습니다':esc(active.title)}</h2></div><div class="wd41-save"><button class="small" id="saveDraft">임시저장</button><div class="wd34-savestate" id="draftSaveStatus" role="status" aria-live="polite">${t.draftSavedAt?'자동저장됨 · '+esc(t.draftSavedAt):'입력하면 자동 저장됩니다.'}</div></div></div>${ready?`<div class="wd41-donebody"><div class="wd28-done"><p>${t.order}번 할 일을 마쳤습니다. 다음 할 일을 시작하려면 아래 버튼을 누르세요. 모든 할 일을 마친 뒤 상단에서 업무보고서를 제출합니다.</p><div class="actions wd35-readyactions"><button id="reportPrev">기록 다시 보기</button>${taskUnits(sel()).some(u=>u.order>t.order)?`<button class="primary wd35-complete" id="nextUnit">${t.order+1}번 할 일 시작 →</button>`:''}</div></div></div>`:`<div class="wd41-stagebody"><section class="wd41-guidance"><p class="wd41-purpose">${nl(active.instruction)}</p><h3>진행 방법</h3><p>${nl(detail.method)}</p><h3>정리 형식</h3><p>${nl(detail.format)}</p><h3>남길 자료 · 파일</h3><p>${nl(detail.evidence)}</p>${t.references?.length?`<h3>참고자료</h3>${refHtml(t)}`:''}</section><section class="wd41-record"><label for="stepAnswer">업무보고에 적을 내용</label><p class="smallText">${nl(detail.format)}</p><textarea id="stepAnswer" data-step-answer="${esc(active.id)}" aria-label="현재 단계 수행 기록" placeholder="${esc(recordOutline(active))}">${esc(answers[active.id]||'')}</textarea>${stepAttachmentHTML(t,active.id)}<div class="actions wd23-actions wd35-stepactions"><button id="reportPrev" ${step===0?'disabled':''}>이전 순서</button><button class="primary ${step===steps.length-1?'wd35-complete':''}" id="reportNext" ${activeStepUploads?'disabled':''}>${step===steps.length-1?t.order+'번 할 일 완료':'다음 순서 · '+esc(steps[step+1].title)}</button></div></section></div>`}${oldDraft(t)}${t.reports.length?`<details class="wd41-legacy"><summary>이전 개별 제출 기록</summary>${reportList(t)}</details>`:''}</section>`}
function bindReportFlow(t){let f=reportFlow(t),steps=workSteps(t);let go=step=>{if(activeStepUploads)return notify('첨부 저장이 끝난 뒤 이동하세요');f.step=step;t.guideView=null;save();render()};if($('reportPrev'))$('reportPrev').onclick=()=>go(Math.max(0,f.step-1));if($('reportNext'))$('reportNext').onclick=()=>{if(activeStepUploads)return notify('첨부 저장 중입니다');if(!t.ack)return notify('업무 내용을 먼저 확인하세요');let item=steps[f.step];if(!String(t.stepAnswers?.[item.id]||'').trim())return notify('이번 단계에서 수행한 내용을 기록하세요');if(!flushStepLinks(t,item.id))return;f.confirmed[f.step]=true;if(f.step===steps.length-1){t.completedAt=now();t.completionVersion=(t.completionVersion||0)+1;t.completedSignature=t.workflowSignature}go(f.step+1)};document.querySelectorAll('[data-report-step]').forEach(el=>el.onclick=()=>{let step=Number(el.dataset.reportStep);if(step<=f.step||Array.from({length:step},(_,j)=>f.confirmed[j]).every(Boolean))go(step)});document.querySelectorAll('[data-step-answer]').forEach(el=>el.oninput=()=>{t.stepAnswers=t.stepAnswers||{};t.stepAnswers[el.dataset.stepAnswer]=el.value;invalidateUnit(t,f.step);save()});document.querySelectorAll('[data-extra-note]').forEach(el=>el.oninput=()=>{t.work.issues=el.value;if(isUnitComplete(t))t.completionVersion=(t.completionVersion||0)+1;save()});bindStepAttachments(t)}
function fileSummary(r,prefix){return `<div class="smallText">${(r.files||[]).map(f=>`<div class="mediaRow"><span>📎 ${esc(f.name)}</span><button class="small" data-download="${esc(f.id)}">열기</button></div>`).join('')}${(r.links||[]).map(u=>`<div><a href="${esc(u)}" rel="noopener noreferrer" target="_blank">${esc(u)}</a></div>`).join('')}</div>`}
function feedbackHTML(t){const notes=t.feedback.filter(f=>!f.reviewedOnly);return notes.length?notes.map((f,i)=>`<div class="feedback"><b>${i+1}. ${f.decision==='approved'?'승인':f.decision==='revision'?'수정 요청':'추가 확인'} · ${esc(f.at)}</b><p>${nl(f.text)}</p>${fileSummary(f,'feedback')}</div>`).join(''):'<div class="empty">아직 등록된 피드백이 없습니다.</div>'}
function empRight(t){return `<div class="pane"><div class="paneHead"><small>STEP 03 · 검토 및 수정</small><h2>지점장 피드백</h2><p class="muted">업무별로 수정 의견이 번호순으로 누적됩니다.</p></div><div class="paneBody"><span class="pill">${status(t)}</span><h3>피드백 내역</h3>${feedbackHTML(t)}${t.feedback.length&&t.feedback.at(-1).decision==='revision'?'<div class="warn">수정 요청 내용을 반영해 가운데 업무보고를 재제출하세요.</div>':''}</div></div>`}
function mgrLeft(t){return empLeft(t)}
function mgrMid(t){let steps=workSteps(t),index=Math.max(0,Math.min(Number.isInteger(t.guideView)?t.guideView:reportFlow(t).step,steps.length-1)),step=steps[index],detail=guideDetail(step);return `<section class="pane wd41-work"><div class="wd41-stagehead"><div><small>${index+1} / ${steps.length}단계 · 스탭 수행 기록</small><h2>${esc(step.title)}</h2></div><span class="pill">${unitState(t)}</span></div><div class="wd41-stagebody"><section class="wd41-guidance"><p>${nl(step.instruction)}</p><h3>진행 방법</h3><p>${nl(detail.method)}</p><h3>정리 형식</h3><p>${nl(detail.format)}</p><h3>남길 자료 · 파일</h3><p>${nl(detail.evidence)}</p></section><section class="wd41-record"><h3>수행 내용 · 확인 결과</h3><p>${nl(t.stepAnswers?.[step.id]||'아직 작성한 내용이 없습니다.')}</p>${fileSummary(t.stepAssets?.[step.id]||{files:[],links:[]},'stage')}</section></div></section>`}
function mgrRight(t){return `<div class="pane"><div class="paneHead"><small>03 · 지점장 컨펌</small><h2>피드백 · 수정 요청</h2></div><div class="paneBody"><h3>이전 피드백</h3>${feedbackHTML(t)}<div class="divider"></div><label>평가 결과</label><select id="decision"><option value="revision">보완 요청</option><option value="approved">업무 완료</option><option value="review">추가 확인 필요</option></select><label>수정·평가 의견</label><textarea id="feedbackText" placeholder="예: 1. 비교 기준 보완 / 2. 사진 출처 추가 / 3. 제안 근거 확인"></textarea><h3>참고사진 · 파일 · 링크</h3>${attachmentArea('feedback','평가 참고자료','')}<button class="primary" id="sendFeedback" style="width:100%">피드백 등록</button></div></div>`}
function taskUnits(day){if(!day.workUnits)day.workUnits={};return taskTodos(day).map((todo,i)=>{let u=day.workUnits[todo.id];if(!u)u=day.workUnits[todo.id]={id:day.id+'__'+todo.id,parentId:day.id,todoId:todo.id,ack:day.startedAt||null,work:{},reports:[],feedback:[],todos:[]};applyWorkflow(u,todo.workflow||makeWorkflow(suggestWorkflowType(todo.text)));Object.assign(u,{staffId:taskStaffId(day),date:day.date,title:todo.text,objective:todo.text,guide:day.guide,references:day.references||[],dayTitle:day.title,order:i+1});return u})}
function allReportTasks(){return S.tasks.flatMap(day=>{taskUnits(day);return [day,...Object.values(day.workUnits)]})}
function reportTaskById(id){return allReportTasks().find(t=>t.id===id)}
function boardTask(day=sel()){let units=taskUnits(day);return units.find(x=>x.id===day.activeUnit)||units[0]}

const acknowledgedWork=new Set();

        <label for="employeeReportFiles">파일 첨부 (선택)</label><input id="employeeReportFiles" type="file" multiple>
        <div class="actions"><button type="submit" class="primary" id="employeeReportSubmit">보고서 제출</button></div></form>`:
        `<p class="smallText">${status(task)==='업무 완료'?'검토 완료':'보고서 검토 대기'}</p>`}

function bindEmployeeInstructions(){
  bindTaskReports();
  const form=$('employeeReportForm'),task=sel();
  if(!form||!task)return;
  form.onsubmit=async event=>{
    event.preventDefault();
    const button=$('employeeReportSubmit'),outcome=$('employeeReportText').value.trim();
    if(button.disabled||!['미제출','보완 요청'].includes(status(task)))return;
    if(!outcome)return notify('업무보고 내용을 입력하세요');
    button.disabled=true;activeStepUploads++;
    try{
      const files=await uploadFiles('employeeReportFiles');
      if($('employeeReportFiles')?.files?.length>files.length)return notify('첨부파일이 모두 저장됐는지 확인하세요');
      if($('employeeReportForm')!==form||currentUser!=='employee')return;
      const snapshot={date:task.date,title:task.title,staffName:taskStaffName(task)};
      task.reports.push({formVersion:5,at:now(),snapshot,outcome,files,links:[]});
      try{save();}catch(e){task.reports.pop();throw e;}
      render();notify('업무보고를 제출했습니다');
    }catch(e){notify('보고서를 저장하지 못했습니다');}
    finally{button.disabled=false;activeStepUploads--;}
  };
}

function completeEmployeeReview(task){
  if(!task||status(task)!=='보고서 제출'||!isEmployeeTask(task))return;
  task.feedback.push({id:'fb'+crypto.randomUUID(),at:now(),decision:'approved',totalReportCount:dayReportCount(task),reviewedOnly:true});
  try{save();}catch(e){task.feedback.pop();return notify('검토 완료를 저장하지 못했습니다');}
  render();notify('검토 완료로 기록했습니다');
}

function taskTodos(t){if(!Array.isArray(t.todos)){let lines=(t.guide||'').split(/\n|。|\.\s+/).map(x=>x.trim()).filter(Boolean);if(!lines.length)lines=['업무 내용을 확인하고 수행하기'];if(lines.length<2)lines.push('수행 결과와 참고자료 정리하기');if(lines.length<3)lines.push('업무보고 작성 및 제출하기');t.todos=lines.map((text,i)=>({id:'todo'+i,text,done:false}))}return t.todos}
function mergeTodos(t,text){let old=taskTodos(t);return [...old.filter(x=>x.sourceTask),...text.split('\n').map(x=>x.trim()).filter(Boolean).map((v,i)=>{let prior=old.find(x=>!x.sourceTask&&x.text===v);return prior||{id:'todo'+Date.now()+'_'+i,text:v,done:false}})]}
function syncFeedbackTodos(t){let next=S.tasks.filter(x=>taskStaffId(x)===taskStaffId(t)&&x.id!==t.id&&x.date>t.date).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!next)return;let pending=t.feedback.filter(f=>f.decision!=='approved'&&f.id);if(!pending.length)return;const prior=next.todos?JSON.parse(JSON.stringify(next.todos)):undefined;let todos=taskTodos(next);let related=pending.map(f=>f.id);let item=todos.find(x=>x.sourceTask===t.id);let text='지난 업무 피드백 보완 · '+t.title+'\n'+pending.map(f=>f.text).join('\n');if(item){if(item.text!==text)item.done=false;item.text=text;item.feedbackIds=related}else todos.unshift({id:'followup_'+t.id,text,done:false,sourceTask:t.id,feedbackIds:related});return ()=>{next.todos=prior}}

function reportDocumentFixed(t,r){if(r.formVersion!==2)return reportDocumentLegacy(t,r);let snap=r.snapshot||t;return `<article class="wd19-print"><div class="wd19-paperbrand">WD WAVE · WORK REPORT</div><h1>실무 업무보고서</h1><p>${esc(snap.date)} · ${esc(snap.staffName||taskStaffName(t))}<br><strong>${esc(snap.title)}</strong><br>제출: ${esc(r.at)}</p>${REPORT_FIELDS.map(([key,label],i)=>`<section class="record"><h2>${i+1}. ${label}</h2><p>${r[key]?nl(r[key]):'—'}</p></section>`).join('')}${previousWorkNotes({todos:snap.todos||[]},r)}<h2>결과물 · 참고자료</h2>${fileSummary(r,'report')}</article>`}

let lastDeletedMaterial=null;
function canManageMaterial(item){return currentUser==='manager'||currentUser==='employee'&&item.kind==='final'}
function materialTable(rows){return `<table class="wd51-table"><colgroup><col style="width:55px"><col style="width:125px"><col><col style="width:135px"><col style="width:265px"></colgroup><thead><tr><th>번호</th><th>분류</th><th>자료명</th><th>등록일</th><th>관리</th></tr></thead><tbody>${rows.length?rows.map((x,i)=>`<tr><td class="wd51-no">${i+1}</td><td class="wd51-category">${esc(MATERIAL_CATEGORIES[x.category]||'공통자료')}</td><td class="wd51-title"><b>${esc(x.title)}</b><small>${esc(x.file.name)} · ${Math.max(1,Math.round(x.file.size/1024))}KB</small>${x.note?`<p>${nl(x.note)}</p>`:''}</td><td class="wd51-date">${esc((x.at||'').split('오전')[0].split('오후')[0].trim())}</td><td class="wd51-actions"><div><button class="small" data-material-view="${esc(x.id)}">보기</button>${canManageMaterial(x)?`<button class="small" data-material-edit="${esc(x.id)}">수정</button>`:''}<button class="small" data-download="${esc(x.file.id)}">다운로드</button>${canManageMaterial(x)?`<button class="small wd51-delete" data-material-delete="${esc(x.id)}">삭제</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">등록된 자료가 없습니다.</div></td></tr>'}</tbody></table>${lastDeletedMaterial?'<div class="actions"><button class="small" id="undoMaterialDelete">방금 삭제한 자료 복구</button></div>':''}`}
function editMaterial(id){let item=(S.materials||[]).find(x=>x.id===id&&!x.deletedAt);if(!item||!canManageMaterial(item))return;showModal(`<label>자료 제목</label><input id="editMaterialTitle" value="${esc(item.title)}"><label>분류</label><select id="editMaterialCategory">${Object.entries(MATERIAL_CATEGORIES).map(([key,label])=>`<option value="${key}" ${item.category===key?'selected':''}>${label}</option>`).join('')}</select><label>자료 설명</label><textarea id="editMaterialNote">${esc(item.note||'')}</textarea><label>현재 파일</label><p class="smallText">${esc(item.file.name)}</p><label>파일 교체 (선택)</label><input type="file" id="replaceMaterialFile"><button class="primary" id="saveMaterialEdit" style="margin-top:18px">수정 저장</button>`,'자료 수정');$('saveMaterialEdit').onclick=async()=>{if(!canManageMaterial(item))return;let title=$('editMaterialTitle').value.trim();if(!title)return notify('자료 제목을 입력하세요');let category=$('editMaterialCategory').value,note=$('editMaterialNote').value;let file=null,button=$('saveMaterialEdit');button.disabled=true;activeMaterialUploads++;try{if($('replaceMaterialFile').files?.length){let result=await uploadFiles('replaceMaterialFile');if(!result.length){button.disabled=false;return}file=result[0]}item.previousVersions=item.previousVersions||[];item.previousVersions.push({title:item.title,category:item.category,note:item.note,file:JSON.parse(JSON.stringify(item.file)),at:item.updatedAt||item.at});Object.assign(item,{title,category,note,updatedAt:now()});if(file)item.file=file;save();$('modalLayer')?.remove();render();notify('자료를 수정했습니다')}catch(e){button.disabled=false;notify('수정 내용을 저장하지 못했습니다')}finally{activeMaterialUploads--}}}
function deleteMaterial(id){let item=(S.materials||[]).find(x=>x.id===id&&!x.deletedAt);if(!item||!canManageMaterial(item))return;item.deletedAt=now();lastDeletedMaterial=item.id;save();render();notify('자료실 목록에서 삭제했습니다')}
function undoMaterialDelete(){let item=(S.materials||[]).find(x=>x.id===lastDeletedMaterial);if(!item||!canManageMaterial(item))return;delete item.deletedAt;lastDeletedMaterial=null;save();render();notify('자료를 복구했습니다')}

function driveView(){let rows=materialRows(),shared=(S.materials||[]).filter(x=>!x.deletedAt&&x.kind==='shared').length,final=(S.materials||[]).filter(x=>!x.deletedAt&&x.kind==='final').length;return `<div class="titleRow"><div><div class="eyebrow">WD WAVE · MATERIALS</div><h1>자료실</h1><p class="muted">회사에서 공유한 자료와 확정된 완성자료를 확인하세요.</p></div></div>${currentUser==='manager'?'<section class="card drive-connection"><strong>Drive 폴더 연결 대기</strong><p class="smallText">회사 공유자료는 03_퍼스널브랜딩과 04_대표→스탭_업무공유파일, 스탭 완성자료는 06_스탭완성자료와 연결할 예정입니다. 아래 목록은 이 브라우저에 등록한 파일입니다.</p></section>':''}<div class="wd33-tabs"><button data-material-tab="shared" class="${materialTab==='shared'?'active':''}"><small>회사에서 제공한 자료</small><strong>회사 공유자료 <b>${shared}</b></strong><span>퍼스널브랜딩 · AI강의 · 공통자료</span></button><button data-material-tab="final" class="${materialTab==='final'?'active':''}"><small>완성된 결과물 보관</small><strong>스탭 완성자료 <b>${final}</b></strong><span>확정된 파일과 완성본</span></button></div><section class="card wd33-library"><div class="wd33-listhead"><div><h2>${materialTab==='shared'?'회사 공유자료':'스탭 완성자료'}</h2><p class="smallText">${materialTab==='shared'?'회사에서 등록한 파일을 열거나 다운로드할 수 있습니다.':'업무진행판의 작업 기록과 별도로, 최종 확정된 결과물만 등록하세요.'}</p></div>${currentUser==='manager'||materialTab==='final'?`<button class="primary" id="addMaterial">${materialTab==='shared'?'공유자료 등록':'완성자료 등록'}</button>`:''}</div><div class="wd33-filters"><select id="materialCategory" aria-label="자료 분류"><option value="all">전체 분류</option>${Object.entries(MATERIAL_CATEGORIES).map(([id,label])=>`<option value="${id}" ${materialCategory===id?'selected':''}>${label}</option>`).join('')}</select><input id="materialSearch" aria-label="자료 검색" placeholder="자료명 검색" value="${esc(materialSearch)}"><button id="searchMaterials">검색</button></div><div class="wd51-tablewrap">${materialTable(rows)}</div></section>`}
function bindMaterials(){document.querySelectorAll('[data-material-edit]').forEach(b=>b.onclick=()=>editMaterial(b.dataset.materialEdit));document.querySelectorAll('[data-material-delete]').forEach(b=>b.onclick=()=>deleteMaterial(b.dataset.materialDelete));if($('undoMaterialDelete'))$('undoMaterialDelete').onclick=undoMaterialDelete;document.querySelectorAll('[data-material-tab]').forEach(b=>b.onclick=()=>{materialTab=b.dataset.materialTab;materialCategory='all';materialSearch='';render()});if($('materialCategory'))$('materialCategory').onchange=()=>{materialCategory=$('materialCategory').value;render()};let search=()=>{materialSearch=$('materialSearch').value.trim();render()};if($('searchMaterials'))$('searchMaterials').onclick=search;if($('materialSearch'))$('materialSearch').onkeydown=e=>{if(e.key==='Enter')search()};if($('addMaterial'))$('addMaterial').onclick=()=>materialUploader(materialTab);document.querySelectorAll('[data-material-view]').forEach(b=>b.onclick=()=>previewMaterial(b.dataset.materialView))}
function materialUploader(kind){if(!['employee','manager'].includes(currentUser)||!['shared','final'].includes(kind))return;if(kind==='shared'&&currentUser!=='manager')return notify('회사 공유자료는 관리자가 등록합니다');showModal(`<p class="smallText">${kind==='shared'?'스탭에게 보여줄 자료를 파일로 등록하세요.':'확정된 완성본을 등록하세요. 진행 과정과 초안은 업무진행판에 남겨주세요.'}</p><label>자료 분류</label><select id="uploadMaterialCategory">${Object.entries(MATERIAL_CATEGORIES).map(([id,label])=>`<option value="${id}">${label}</option>`).join('')}</select><label>자료 제목 (선택)</label><input id="materialTitle" placeholder="비워두면 파일명으로 등록합니다"><label>자료 설명 (선택)</label><textarea id="materialNote"></textarea><label>파일 · 사진</label><input type="file" id="materialfiles" multiple><div class="smallText">여러 파일을 선택할 수 있습니다.</div><button class="primary" id="saveMaterial" style="margin-top:18px">${kind==='shared'?'공유자료 등록':'완성자료 등록'}</button>`,kind==='shared'?'회사 공유자료 등록':'스탭 완성자료 등록');$('saveMaterial').onclick=async()=>{if(kind==='shared'&&currentUser!=='manager')return;if(!$('materialfiles').files?.length)return notify('등록할 파일을 선택하세요');let title=$('materialTitle').value.trim(),note=$('materialNote').value.trim(),category=$('uploadMaterialCategory').value,button=$('saveMaterial');button.disabled=true;button.textContent='파일 저장 중…';activeMaterialUploads++;try{let files=await uploadFiles('materialfiles');if(!files.length){button.disabled=false;button.textContent='다시 등록';return}S.materials=S.materials||[];for(let [i,file] of files.entries())S.materials.unshift({id:'material_'+Date.now()+'_'+Math.random().toString(36).slice(2),kind,category,title:title?(files.length>1?title+' · '+file.name:title):file.name,note,file,at:now(),registeredBy:currentUser,staffId:kind==='final'?(activeStaffId||'manager'):undefined});save();$('modalLayer')?.remove();render();notify(kind==='shared'?'공유자료를 등록했습니다':'완성자료를 등록했습니다')}catch(e){button.disabled=false;button.textContent='다시 등록';notify('자료 저장에 실패했습니다. 다시 확인하세요')}finally{activeMaterialUploads--}}}
async function previewMaterial(id){if(!currentUser)return;let item=(S.materials||[]).find(x=>x.id===id&&!x.deletedAt);if(!item)return;try{let db=await openDB(),row=await new Promise((ok,bad)=>{let q=db.transaction('files','readonly').objectStore('files').get(item.file.id);q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)});db.close();if(!row)return notify('등록된 파일을 찾을 수 없습니다');let type=row.type||row.blob.type||'',url=URL.createObjectURL(row.blob);let visual=/^image\//.test(type)?`<img src="${url}" alt="${esc(item.title)}" style="max-width:100%;height:auto">`:type==='application/pdf'?`<iframe src="${url}" title="${esc(item.title)}" style="width:100%;height:65vh;border:0"></iframe>`:'<div class="empty">이 파일은 다운로드하여 확인할 수 있습니다.</div>';showModal(`<p class="smallText">${esc(item.file.name)}</p>${visual}<div class="actions"><button id="downloadMaterial">다운로드</button></div>`,item.title);$('downloadMaterial').onclick=()=>downloadFile(item.file.id);let layer=$('modalLayer'),close=$('closeModal'),cleanup=()=>{URL.revokeObjectURL(url);layer.remove()};close.onclick=cleanup;layer.onclick=e=>{if(e.target===layer)cleanup()}}catch(e){notify('자료를 열지 못했습니다. 파일을 확인하세요')}}


function reportsView(){let list=allReportTasks().filter(t=>t.reports.length);return `<div class="titleRow"><div><div class="eyebrow">SUBMISSIONS</div><h1>${currentUser==='manager'?'접수 업무보고':'제출 업무보고'}</h1><p class="muted">일일 업무보고와 이전 제출 이력을 확인합니다.</p></div></div>${list.map(t=>`<section class="card wd24-submission"><div class="eyebrow">${esc(t.date)} · ${t.parentId?'이전 개별 보고 · 할 일 '+t.order:t.reports.some(r=>r.formVersion===4)?'일일 업무보고':'이전 하루 전체 보고'}</div><h2>${esc(t.title)}</h2><span class="pill">${status(t)}</span>${reportList(t)}</section>`).join('')||'<div class="empty">제출된 업무보고가 없습니다.</div>'}` }
let activeNoteId=null,noteListOpen=false,noteSearch='',lastDeletedNote=null;
const NOTE_COLORS={yellow:{label:'노랑',bg:'#fff5b6',accent:'#ffe887',border:'#ead78b'},purple:{label:'연보라',bg:'#f0e7ff',accent:'#d9c3f6',border:'#d4c2e8'},blue:{label:'하늘',bg:'#e6f3ff',accent:'#bcdcf6',border:'#c0d9ed'},pink:{label:'분홍',bg:'#ffe8ef',accent:'#f7bfd2',border:'#ecc5d3'},peach:{label:'살구',bg:'#ffeddd',accent:'#ffd3ac',border:'#edceb2'},gray:{label:'연회색',bg:'#f0eff3',accent:'#d8d6df',border:'#d6d3dd'}};
function validNoteColor(color){return Object.hasOwn(NOTE_COLORS,color)?color:'yellow'}
function noteColorStyle(color){let c=NOTE_COLORS[validNoteColor(color)];return `--note-bg:${c.bg};--note-accent:${c.accent};--note-border:${c.border}`}
function notePalette(color){return `<div class="wd49-palette" role="group" aria-label="노트 색상 선택"><span>노트 색상</span>${Object.entries(NOTE_COLORS).map(([key,c])=>`<button data-note-color-choice="${key}" title="${c.label}" aria-label="${c.label} 노트" aria-pressed="${key===validNoteColor(color)}" style="background:${c.accent}"><span aria-hidden="true">${key===validNoteColor(color)?'✓':''}</span></button>`).join('')}</div>`}
function setNoteColor(color){color=validNoteColor(color);let note=normalizeNotes().find(n=>n.id===activeNoteId);if(note){note.color=color;note.updatedAt=now()}else S.stickyDraftColor=color;save();let dock=$('stickyDock');if(dock){dock.setAttribute('data-note-color',color);dock.setAttribute('style',noteColorStyle(color))}document.querySelectorAll('[data-note-color-choice]').forEach(b=>{let selected=b.dataset.noteColorChoice===color;b.setAttribute('aria-pressed',String(selected));b.querySelector('span').textContent=selected?'✓':''});renderNoteList();refreshNoteBoard()}
function normalizeNotes(){S.ideas=Array.isArray(S.ideas)?S.ideas:[];S.ideas.forEach((n,i)=>{if(!n.id)n.id='note_legacy_'+i+'_'+String(n.at||'').replace(/[^0-9]/g,'')});return S.ideas}
function noteText(n){if(!n)return S.stickyDraft||'';let body=String(n.desc||'');if(n.title&&body.split('\n')[0].trim().slice(0,60)!==n.title)body=n.title+(body?'\n'+body:'');if(n.url&&!body.includes(n.url))body+='\n'+n.url;return body}
function visibleNotes(){return normalizeNotes().filter(n=>!noteSearch||(n.title+' '+n.desc).toLowerCase().includes(noteSearch.toLowerCase()))}
function notePreview(n){let lines=String(n.desc||'').split('\n');return lines[0].trim().slice(0,60)===n.title?lines.slice(1).join('\n'):n.desc||''}
function noteCards(){let notes=visibleNotes();return notes.length?notes.map(n=>`<button class="wd48-note" data-note-id="${esc(n.id)}" data-note-color="${validNoteColor(n.color)}" style="${noteColorStyle(n.color)}"><h2>${esc(n.title||'제목 없는 메모')}</h2><p>${esc(notePreview(n))}</p><small>${esc(n.updatedAt||n.at)}</small></button>`).join(''):`<div class="empty wd48-empty">${noteSearch?'검색한 노트가 없습니다.':'새 노트에 메모를 남겨보세요.'}</div>`}
function ideasView(){return `<div class="titleRow"><div><div class="eyebrow">MY STICKY NOTES</div><h1>스티커노트</h1><p class="muted">노트를 선택해 이어 쓰고, 수정하거나 삭제하세요.</p></div><button class="primary" id="newBoardNote">+ 새 노트</button></div><div class="wd48-boardtools"><input id="noteBoardSearch" placeholder="메모 검색" aria-label="스티커노트 검색" value="${esc(noteSearch)}">${lastDeletedNote?'<button class="small" id="undoBoardDelete">삭제 취소</button>':''}</div><div class="wd48-notegrid" id="noteGrid">${noteCards()}</div>`}
function bindNoteCards(){document.querySelectorAll('[data-note-id]').forEach(b=>b.onclick=()=>openNote(b.dataset.noteId))}
function refreshNoteBoard(){if($('noteGrid')){$('noteGrid').innerHTML=noteCards();bindNoteCards()}}
function bindNotes(){if($('newBoardNote'))$('newBoardNote').onclick=()=>openNote(null);if($('noteBoardSearch'))$('noteBoardSearch').oninput=e=>{noteSearch=e.target.value;refreshNoteBoard()};if($('undoBoardDelete'))$('undoBoardDelete').onclick=undoNoteDelete;bindNoteCards()}
function closeNoteDock(){if($('stickyDock'))$('stickyDock').remove();if($('openSticky'))$('openSticky').setAttribute('aria-expanded','false')}
function noteListHTML(){let notes=normalizeNotes();return `<div class="wd48-listhead"><b>내 노트 ${notes.length}개</b></div><div class="wd48-listrows">${notes.map(n=>`<button data-dock-note="${esc(n.id)}" data-note-color="${validNoteColor(n.color)}" style="${noteColorStyle(n.color)}" class="${n.id===activeNoteId?'active':''}"><b>${esc(n.title||'제목 없는 메모')}</b><span>${esc(notePreview(n))}</span><small>${esc(n.updatedAt||n.at)}</small></button>`).join('')||'<p class="smallText">저장된 노트가 없습니다.</p>'}</div>${lastDeletedNote?'<button class="small wd48-undo" id="undoNoteDelete">삭제 취소</button>':''}`}
function renderNoteList(){if($('dockNoteList')){$('dockNoteList').innerHTML=noteListHTML();document.querySelectorAll('[data-dock-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.dockNote));if($('undoNoteDelete'))$('undoNoteDelete').onclick=undoNoteDelete}}
function saveNoteText(text){normalizeNotes();let n=S.ideas.find(x=>x.id===activeNoteId);if(!n&&!text.trim()){S.stickyDraft=text;save();return}if(!n){n={id:'note_'+Date.now()+'_'+Math.random().toString(36).slice(2),title:'',desc:'',url:'',at:now(),source:'스티커노트',color:validNoteColor(S.stickyDraftColor)};S.ideas.unshift(n);activeNoteId=n.id}n.desc=text;n.title=(text.split('\n').find(x=>x.trim())||'제목 없는 메모').trim().slice(0,60);n.updatedAt=now();S.stickyDraft='';save();if($('stickyHint'))$('stickyHint').textContent='자동저장됨 · '+n.updatedAt;if($('deleteSticky'))$('deleteSticky').disabled=false;renderNoteList();refreshNoteBoard()}
function deleteActiveNote(){let index=normalizeNotes().findIndex(n=>n.id===activeNoteId);if(index<0)return;lastDeletedNote={note:JSON.parse(JSON.stringify(S.ideas[index])),index};S.deletedNotes=Array.isArray(S.deletedNotes)?S.deletedNotes:[];S.deletedNotes.push(lastDeletedNote.note);S.ideas.splice(index,1);activeNoteId=null;S.stickyDraft='';save();noteListOpen=true;if(S.nav==='ideas')render();openNote(null)}
function undoNoteDelete(){if(!lastDeletedNote)return;let restored=lastDeletedNote.note;if(!normalizeNotes().some(n=>n.id===restored.id))S.ideas.splice(Math.min(lastDeletedNote.index,S.ideas.length),0,restored);S.deletedNotes=(S.deletedNotes||[]).filter(n=>n.id!==restored.id);lastDeletedNote=null;save();if(S.nav==='ideas')render();openNote(restored.id)}

function moveCalendarDay(day,amount){
  const date=new Date(day+'T12:00:00');
  date.setDate(date.getDate()+amount);
  return localDay(date);
}

function weeklyDays(day){
  const weekday=new Date(day+'T12:00:00').getDay();
  const monday=moveCalendarDay(day,-((weekday+6)%7));
  return Array.from({length:7},(_,i)=>moveCalendarDay(monday,i));
}

function bindEmployeeSchedule(){

  const date=$('myScheduleDate'),planned=$('mySchedulePlanned'),start=$('myScheduleStart'),end=$('myScheduleEnd');
  let month;

    const row=S.plannedWork.find(item=>item.day===date.value);

      '<span aria-hidden="true"></span>'.repeat(first.getDay())+
      Array.from({length:count},(_,index)=>{
        const day=month+'-'+String(index+1).padStart(2,'0');
        const scheduled=plans.has(day);
        return `<button type="button" data-schedule-day="${day}" data-planned="${scheduled}" aria-pressed="${date.value===day}" aria-label="${esc(attendanceDate(day))}${scheduled?' 출근 예정':''}" ${day<today?'disabled':''}>${index+1}${scheduled?'<small>예정</small>':''}</button>`;
      }).join('');

    if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||day<localDay()||!attendanceISO(day,'12:00'))return notify('오늘 또는 이후의 날짜를 선택하세요');
    if(hours&&(!attendanceISO(day,hours.start)||!attendanceISO(day,hours.end)||hours.end<=hours.start))return notify('예정 출근·퇴근 시간을 확인하세요');
    const manual=planned.checked;
    if(hours&&!manual)return notify('출근 예정에 체크한 뒤 시간을 저장하세요');
    const prior=S.plannedWork;
    S.plannedWork=prior.filter(row=>row.day!==day);
    if(manual)S.plannedWork.push({day,hours});
    S.plannedWork.sort((a,b)=>a.day.localeCompare(b.day));
    S.plannedWorkChange={day,manual,hours};
    try{save();}catch(e){S.plannedWork=prior;return notify('출근 예정 저장에 실패했습니다');}
    finally{delete S.plannedWorkChange;}
    dialog.close();render();$('editEmployeeSchedule')?.focus();notify('출근 예정을 저장했습니다');
  };
}

function monthCalendarDates(month){
  const first=new Date(month+'-01T12:00:00');
  const leading=(first.getDay()+6)%7;
  const count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const days=Array.from({length:count},(_,i)=>month+'-'+String(i+1).padStart(2,'0'));
  return {days,leading,trailing:(7-(leading+count)%7)%7};
}

function dayAttendance(day,profiles){
  const planned=new Set(S.workRoster?.[day]||[]);
  const start=row=>row.record?timeOnly(row.record.inAt):row.hours?.start||'99:99';
  return profiles.map(profile=>({profile,planned:planned.has(profile.id),hours:S.workSchedule?.[day]?.[profile.id],
    record:(S.staffData[profile.id]?.attendance||[]).find(row=>row.day===day&&row.inAt)}))
    .filter(row=>row.planned||row.record)
    .sort((a,b)=>start(a).localeCompare(start(b))||a.profile.name.localeCompare(b.profile.name,'ko'));
}

function staffBankInfo(profile){
  const stored=profile?.account||'';
  if(profile&&Object.hasOwn(profile,'bank'))return {bank:profile.bank,account:stored};
  const legacy=stored.match(/^(.+?)\s+([0-9][0-9 -]*)$/);
  return legacy?{bank:legacy[1],account:legacy[2]}:{bank:'',account:stored};
}

async function staffPinKey(pin,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new Uint8Array(salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

async function encryptStaffPin(pin){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},managerStaffPinKey,new TextEncoder().encode(pin));
  return {iv:Array.from(iv),cipher:Array.from(new Uint8Array(cipher))};
}

function confirmLegacyStaffPin(profile,reveal){
  showModal(`<p>이 스탭의 기존 비밀번호를 한 번 입력하면, 비밀번호 변경 없이 눈 버튼으로 확인할 수 있습니다.</p>

  $('legacyStaffPin').focus();
  form.onsubmit=async event=>{
    event.preventDefault();
    const pin=$('legacyStaffPin').value;
    if(button.disabled||!/^\d{6}$/.test(pin))return;
    button.disabled=true;
    try{
      if(await sha(pin)!==profile.pin)return notify('기존 비밀번호가 일치하지 않습니다');
      const cipher=await encryptStaffPin(pin);
      if($('legacyPinForm')!==form||currentUser!=='manager')return;
      profile.pinCipher=cipher;
      try{save()}catch(e){delete profile.pinCipher;throw e;}
      $('modalLayer').remove();reveal(pin);
    }catch(e){notify('비밀번호 확인 정보를 저장하지 못했습니다');}
    finally{button.disabled=false;}
  };
}

    };
    if(!profile.pinCipher)return confirmLegacyStaffPin(profile,reveal);
    button.disabled=true;
    try{
      const {iv,cipher}=profile.pinCipher;
      const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(iv)},managerStaffPinKey,new Uint8Array(cipher));
      reveal(new TextDecoder().decode(data));
    }catch(e){notify('비밀번호를 열 수 없습니다.');}
    finally{button.disabled=false;}
  };
}

    button.setAttribute('aria-label',visible?'비밀번호 숨기기':'비밀번호 보기');
    button.title=visible?'비밀번호 숨기기':'비밀번호 보기';

}

async function storePayslip(profile,month,input){
  if(!input.files?.length||currentUser!=='manager'||profile.archivedAt)return false;
  activeMaterialUploads++;
  try{
    const [file]=await uploadFiles(input.id);
    if(!file||staffById(profile.id)!==profile||profile.archivedAt)return false;
    const prior=profile.payslips;
    profile.payslips={...prior,[month]:file};
    try{save()}catch(e){profile.payslips=prior;throw e;}
    notify('급여명세서를 저장했습니다');
    return true;
  }catch(e){notify('급여명세서를 저장하지 못했습니다');return false;}
  finally{activeMaterialUploads--;input.value='';}
}

async function openPayslip(profile,month){
  const file=profile.payslips?.[month],dialog=$('staffPayslipDialog');
  if(!file||!dialog||dialog.open||currentUser!=='manager')return;
  const body=$('staffPayslipContent');
  body.innerHTML='<p class="smallText">파일을 불러오는 중입니다.</p>';
  let url;
  dialog.onclose=()=>{if(url)URL.revokeObjectURL(url);body.innerHTML='';};
  dialog.showModal();
  const download=$('downloadPayslip');
  download.onclick=()=>downloadFile(file.id);
  if(!profile.archivedAt){
    const input=$('replacePayslipFile'),replace=$('replacePayslip'),remove=$('deletePayslip');
    replace.onclick=()=>input.click();
    input.onchange=async()=>{
      replace.disabled=remove.disabled=true;
      const saved=await storePayslip(profile,month,input);
      if(saved&&$('staffPayslipDialog')===dialog){
        dialog.close();render();openPayslip(profile,month);
      }else{replace.disabled=remove.disabled=false;}
    };
    remove.onclick=()=>{
      if(!window.confirm('이 달의 명세서를 삭제할까요?'))return;
      const prior=profile.payslips,next={...prior};
      delete next[month];profile.payslips=next;
      try{save()}catch(e){profile.payslips=prior;return notify('명세서를 삭제하지 못했습니다');}
      dialog.close();render();notify('명세서를 삭제했습니다');
    };
  }
  try{
    const db=await openDB();
    let row;
    try{
      row=await new Promise((ok,bad)=>{
        const req=db.transaction('files','readonly').objectStore('files').get(file.id);
        req.onsuccess=()=>ok(req.result);req.onerror=()=>bad(req.error);
      });
    }finally{db.close();}
    if(!dialog.open||$('staffPayslipDialog')!==dialog)return;
    if(!row){body.textContent='저장된 파일을 찾을 수 없습니다.';return;}
    const type=row.type||row.blob.type;
    if(type==='application/pdf'||/^image\/(?:png|jpeg|webp|gif|bmp|avif)$/.test(type)){
      if(type==='application/pdf'&&await row.blob.slice(0,5).text()!=='%PDF-'){
        if(dialog.open)body.textContent='PDF 파일 형식을 확인할 수 없습니다. 다운로드하여 확인해 주세요.';
        return;
      }
      if(!dialog.open||$('staffPayslipDialog')!==dialog)return;
      url=URL.createObjectURL(new Blob([row.blob],{type}));
      body.innerHTML=type==='application/pdf'? `<iframe class="wd67-payslip-pdf" src="${url}" title="급여명세서"></iframe>`:
        `<img class="wd67-payslip-img" src="${url}" alt="급여명세서">`;
    }else{body.textContent='다운로드하여 파일 내용을 확인할 수 있습니다.';}
  }catch(e){if(dialog.open)body.textContent='파일을 열 수 없습니다.';}
}

function bindStaffPayroll(profile,month){
  const input=$('payslipFile'),upload=$('uploadPayslip'),view=$('viewPayslip'),deposit=$('toggleDeposit');
  if(view)view.onclick=()=>openPayslip(profile,month);
  if(upload){
    upload.onclick=()=>input.click();
    input.onchange=async()=>{
      upload.disabled=true;
      const saved=await storePayslip(profile,month,input);
      upload.disabled=false;
      if(saved&&$('payslipFile')===input)render();
    };
  }
  if(deposit)deposit.onclick=()=>{
    const prior=profile.payroll,paid=prior?.[month]!=='paid';
    profile.payroll={...prior,[month]:paid?'paid':'pending'};
    try{save()}catch(e){profile.payroll=prior;return notify('입금 상태를 저장하지 못했습니다');}
    deposit.setAttribute('aria-pressed',String(paid));
    deposit.textContent=paid?'입금 완료':'입금 미완료';
  };
}

function bindStaffManagement(){
  $('addStaff').onclick=()=>{managerStaffId=null;staffDetailOpen=true;editingStaff=true;render();$('staffName').focus();};
  document.querySelectorAll('[data-staff-profile]').forEach(button=>button.onclick=()=>{
    managerStaffId=button.dataset.staffProfile;staffDetailOpen=true;editingStaff=false;render();
  });
  document.querySelectorAll('[data-delete-staff]').forEach(button=>button.onclick=()=>{
    const profile=staffById(button.dataset.deleteStaff);
    if(!profile||profile.archivedAt||!window.confirm(profile.name+' 스탭을 삭제할까요? 로그인은 중지되고 업무와 근무내역은 보관됩니다.'))return;
    const {pin,pinCipher}=profile;
    profile.archivedAt=now();delete profile.pin;delete profile.pinCipher;
    try{save()}catch(e){delete profile.archivedAt;profile.pin=pin;profile.pinCipher=pinCipher;return notify('스탭 정보를 저장하지 못했습니다.');}
    if(managerStaffId===profile.id)editingStaff=false;
    render();notify('스탭을 삭제했습니다');
  });
  document.querySelectorAll('[data-hide-staff]').forEach(button=>button.onclick=()=>{
    const removed=staffById(button.dataset.hideStaff);
    if(!removed?.archivedAt||!window.confirm(removed.name+' 님을 삭제된 스탭 목록에서 제거할까요? 근무와 업무 기록은 보관됩니다.'))return;
    removed.hiddenAt=now();
    try{save()}catch(e){delete removed.hiddenAt;return notify('목록에서 제거하지 못했습니다.');}
    if(managerStaffId===removed.id){managerStaffId=null;staffDetailOpen=false;}
    render();notify('삭제된 스탭 목록에서 제거했습니다');
  });
  const profile=staffById(managerStaffId);
  bindStaffPinReveal(profile);
  if($('editStaff'))$('editStaff').onclick=()=>{editingStaff=true;render();$('staffName').focus();};
  if($('cancelStaffEdit'))$('cancelStaffEdit').onclick=()=>{editingStaff=false;staffDetailOpen=!!profile;render();};
  const form=$('staffProfileForm');
  if(form){
    passwordToggle('staffPin','showStaffPin');
    form.onsubmit=async event=>{
      event.preventDefault();
      const button=$('saveStaffProfile'),pin=$('staffPin').value;
      const fields={
        name:$('staffName').value.trim(),memo:$('staffMemo').value,role:$('staffRole').value.trim(),workType:$('staffWorkType').value,
        joinedOn:$('staffJoined').value,leftOn:$('staffLeft').value,contact:$('staffContact').value.trim(),
        bank:$('staffBank').value,account:$('staffAccount').value.trim()
      };
      if(!fields.name)return notify('이름을 입력하세요');
      if(!['employee','staff'].includes(fields.workType))return notify('직원 또는 스탭을 선택하세요');
      if(fields.joinedOn&&fields.leftOn&&fields.leftOn<fields.joinedOn)return notify('퇴사일을 입사일 이후로 입력하세요');
      if((pin||!profile?.pin)&&!/^\d{6}$/.test(pin))return notify('숫자 6자리 비밀번호를 입력하세요');
      button.disabled=true;
      try{
        const digest=pin?await sha(pin):profile.pin;
        if(currentUser!=='manager'||$('staffProfileForm')!==form)return;
        if(S.pins.manager===digest||S.staffProfiles.some(p=>p.id!==profile?.id&&!p.archivedAt&&p.pin===digest))return notify('이미 사용 중인 비밀번호입니다. 다른 숫자 6자리를 입력하세요');
        const pinCipher=pin?await encryptStaffPin(pin):profile.pinCipher;
        if(currentUser!=='manager'||$('staffProfileForm')!==form)return;
        const next={...profile,...fields,id:profile?.id||'staff_'+crypto.randomUUID(),pin:digest,pinCipher};
        const prior=S.staffProfiles;
        S.staffProfiles=profile?prior.map(p=>p.id===profile.id?next:p):[...prior,next];
        try{save()}catch(e){S.staffProfiles=prior;throw e;}
        managerStaffId=next.id;editingStaff=false;render();notify('직원·스탭 정보를 저장했습니다');
      }catch(e){notify('스탭 정보를 저장하지 못했습니다. 새로고침 후 다시 시도하세요.');}
      finally{button.disabled=false;}
    };
  }
  const picker=$('staffMonth');
  if(!picker)return;
  picker.onchange=()=>{
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(picker.value)){picker.value=staffSummaryMonth;return;}
    staffSummaryMonth=picker.value;
    render();
    $('staffMonth').focus();
  };
  bindStaffDetailDialog('staffWorkDetails','staffWorkRows');
  bindStaffDetailDialog('profileTasks','staffTaskRows');
  if($('assignFromStaff'))$('assignFromStaff').onclick=()=>{
    managerStaffId=profile.id;
    instructionDraftFor(profile.id,staffSummaryMonth===localDay().slice(0,7)?localDay():staffSummaryMonth+'-01');
    setNav('instructions',profile.id);$('instructionInput')?.focus();
  };
  bindStaffPayroll(profile,staffSummaryMonth);
}

function parseAnalysis(text) {
  const result={goal:'',items:[]};
  let item, step;
  const keys={'진행 방법':'method','업무보고에 적을 내용':'recordFormat','정리 형식':'recordFormat','남길 자료':'evidence'};
  for(const line of text.split(/\r?\n/)){
    const match=line.trim().match(/^(목표|할 일|단계|진행 방법|업무보고에 적을 내용|정리 형식|남길 자료)\s*[:：]\s*(.+)$/);
    if(!match) continue;
    const [,label,value]=match;
    if(label==='목표')result.goal=value;
    else if(label==='할 일'){item={text:value,workflow:{type:'general',steps:[]}};result.items.push(item);step=null;}
    else if(label==='단계'&&item){step={id:'custom'+item.workflow.steps.length,title:value};item.workflow.steps.push(step);}
    else if(step&&keys[label])step[keys[label]]=value;
  }
  if(!result.goal||!result.items.length||result.items.some(x=>!x.workflow.steps.length||x.workflow.steps.some(s=>!s.method||!s.recordFormat||!s.evidence)))return null;
  result.items.forEach(x=>x.workflow.steps.forEach(s=>s.instruction=s.method));
  return result;
}

function employeeInstructionPlan(raw){
  if(!raw.trim())return null;
  const named=raw.match(/^[ \t]*(?:업무명|업무 제목)[ \t]*[:：][ \t]*(.+)$/m)?.[1];
  const firstLine=raw.trim().split(/\r?\n/)[0];
  const goal=(named||firstLine).trim();
  return {goal:goal.length>64?goal.slice(0,63)+'…':goal,items:[{text:raw}]};
}

function instructionDraftFor(staffId,date=localDay()){
  if(!instructionDrafts.has(staffId))instructionDrafts.set(staffId,{staffId,raw:'',answer:'',analysis:null,date});
  return instructionDrafts.get(staffId);
}

function requestedInstructionSessions(raw){
  const match=raw.match(/총\s*(\d{1,2})\s*(?:회|번|일)/)||raw.match(/(\d{1,2})\s*(?:회(?:차)?|번)(?=\s*(?:출근|나오|근무|배정|이지시|지시|으로\s*나눠))/);
  return match?Number(match[1]):1;
}

function instructionSessionCount(d){
  return d.sessionCount?Number(d.sessionCount):requestedInstructionSessions(d.raw);
}

function scheduledInstruction(d,draft,count){
  if(count===1)return draft;
  if(draft.items.length!==count)return null;
  const mentionedMonth=d.raw.match(/(?:^|[^\d])(1[0-2]|[1-9])\s*월/);
  const base=d.date||localDay();
  const month=mentionedMonth?base.slice(0,4)+'-'+mentionedMonth[1].padStart(2,'0'):base.slice(0,7);
  const dates=instructionSchedule(d.staffId,month).filter(row=>row.planned).map(row=>row.date);
  d.scheduleSession=0;
  return {...draft,bySession:true,items:draft.items.map((item,i)=>({...item,date:dates.length===count?dates[i]:''}))};
}

function instructionSchedule(staffId,month){
  const days=new Map();
  const rowFor=date=>{
    if(!days.has(date))days.set(date,{date,tasks:[],planned:false,hours:S.workSchedule?.[date]?.[staffId]});
    return days.get(date);
  };
  for(const task of tasksForStaff(staffId))if(task.date.startsWith(month+'-'))rowFor(task.date).tasks.push(task);
  for(const [date,ids] of Object.entries(S.workRoster||{})){
    if(date.startsWith(month+'-')&&ids.includes(staffId))rowFor(date).planned=true;
  }
  return [...days.values()].sort((a,b)=>a.date.localeCompare(b.date));
}

function instructionGroups(d,plan=d.analysis){
  if(plan.bySession)return plan.items.map(item=>[item.date||'',[item]]);
  const groups=new Map();
  for(const item of plan.items){
    const date=item.date||d.date;
    if(!groups.has(date))groups.set(date,[]);
    groups.get(date).push(item);
  }
  return [...groups].sort(([a],[b])=>a.localeCompare(b));
}
