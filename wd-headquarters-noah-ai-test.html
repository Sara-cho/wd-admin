<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WD 본진 · 노아 AI TEST</title>
<style>
:root{
  --navy:#153a63;--navy2:#0f2e50;--line:#dfe6ee;--text:#17243a;--muted:#66758a;
  --bg:#f6f8fb;--white:#fff;--soft:#eef4fb;--gold:#e9c86d;--shadow:0 18px 55px rgba(19,43,72,.18);
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--text);background:var(--bg)}
#hq{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.noah-fab{position:fixed;right:22px;bottom:22px;z-index:30;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 18px;border:0;border-radius:18px;background:var(--navy);color:#fff;font:inherit;font-weight:850;box-shadow:0 14px 36px rgba(20,54,94,.3);cursor:pointer}
.noah-fab:hover{background:var(--navy2)}.noah-fab .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:12px;background:#ffffff18;color:#f4d98c;font-size:18px}
.noah-backdrop{position:fixed;inset:0;z-index:38;background:#10233b4f;opacity:0;pointer-events:none;transition:.18s}
.noah-backdrop.open{opacity:1;pointer-events:auto}
.noah-panel{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(460px,100vw);display:flex;flex-direction:column;background:#fbfcfe;box-shadow:var(--shadow);transform:translateX(104%);transition:transform .2s ease}
.noah-panel.open{transform:none}
.noah-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 16px 13px;background:#fff;border-bottom:1px solid var(--line)}
.noah-avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#183e69,#0e2c4d);color:#f2d680;font-weight:900}
.noah-head h1{margin:0;font-size:18px;letter-spacing:-.03em}.noah-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#5c6c80;font-size:21px;cursor:pointer}
.noah-status{display:flex;align-items:center;gap:7px;padding:8px 16px;border-bottom:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#aab4c0}.noah-status.ok .dot{background:#4e9b69}.noah-status.busy .dot{background:#d19d36;animation:pulse 1s infinite}.noah-status.err .dot{background:#c75b55}@keyframes pulse{50%{opacity:.35}}
.mode-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
.mode{min-height:40px;padding:7px 5px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#5e6e82;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.mode.active{color:#fff;background:var(--navy);border-color:var(--navy)}
.chat{flex:1;min-height:0;overflow:auto;padding:18px 15px 24px}
.welcome{margin:0 0 15px;padding:15px 16px;border:1px solid #dbe5ef;border-radius:16px;background:#fff}
.welcome strong{display:block;margin-bottom:5px;color:var(--navy)}.welcome p{margin:0;color:#607084;font-size:13px;line-height:1.6}
.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}
.msg.user .bubble{border-bottom-right-radius:5px;background:var(--navy);color:#fff}.msg.noah .bubble{border:1px solid var(--line);border-bottom-left-radius:5px;background:#fff;color:#27364a}
.meta{margin-top:5px;color:#8793a2;font-size:10px}
.composer{padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.input-wrap{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:end}
textarea{width:100%;min-height:48px;max-height:150px;padding:12px 13px;border:1px solid #cfd9e5;border-radius:14px;outline:none;resize:none;font:inherit;color:var(--text);background:#fff;line-height:1.5}
textarea:focus{border-color:#7aa4cf;box-shadow:0 0 0 3px #2e6da91c}.send{width:48px;height:48px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:18px;cursor:pointer}.send:disabled{opacity:.45;cursor:default}
.composer-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:#8a95a4;font-size:10.5px}.composer-foot button{border:0;background:transparent;color:#718197;font:inherit;font-size:10.5px;text-decoration:underline;cursor:pointer}
.test-badge{position:fixed;left:16px;bottom:14px;z-index:20;padding:6px 9px;border-radius:999px;background:#fff8e8e8;border:1px solid #ead6a6;color:#7d6229;font-size:10px;font-weight:850;backdrop-filter:blur(8px)}
@media(max-width:620px){.noah-fab{right:14px;bottom:16px;min-height:50px;padding:0 14px}.noah-fab .label{font-size:13px}.noah-panel{width:100vw}.mode-row{gap:5px;padding:10px}.mode{font-size:11px}.test-badge{display:none}}
</style>
</head>
<body>
<iframe id="hq" src="/" title="WD WAVE 본진"></iframe>
<div class="test-badge">TEST · 운영본 미변경</div>
<button class="noah-fab" id="noah-open" type="button"><span class="mark">N</span><span class="label">노아에게 말하기</span></button>
<div class="noah-backdrop" id="noah-backdrop"></div>
<aside class="noah-panel" id="noah-panel" aria-label="노아 AI 작업창">
  <header class="noah-head">
    <div class="noah-avatar">N</div>
    <div><h1>노아에게 말하기</h1><p>본진 TEST · GPT 연결</p></div>
    <button class="icon-btn" id="noah-close" type="button" aria-label="닫기">×</button>
  </header>
  <div class="noah-status" id="noah-status"><span class="dot"></span><span id="noah-status-text">대표 로그인 확인 전</span></div>
  <div class="mode-row" id="mode-row">
    <button class="mode active" data-mode="ask">묻기</button>
    <button class="mode" data-mode="task">일시키기</button>
    <button class="mode" data-mode="find">찾기</button>
    <button class="mode" data-mode="organize">정리하기</button>
  </div>
  <main class="chat" id="chat">
    <section class="welcome">
      <strong>대표님, 무엇을 도와드릴까요?</strong>
      <p>지금 TEST에서는 질문·정리·업무분류·작업초안까지만 합니다. 실제 발송·삭제·배포·비용집행은 실행하지 않습니다.</p>
    </section>
  </main>
  <footer class="composer">
    <div class="input-wrap">
      <textarea id="message" rows="1" placeholder="예: 오늘 본진에서 뭐부터 보면 돼?"></textarea>
      <button class="send" id="send" type="button" aria-label="보내기">➤</button>
    </div>
    <div class="composer-foot"><span>대화는 이 TEST 탭에서만 임시 유지됩니다.</span><button id="clear" type="button">대화 비우기</button></div>
  </footer>
</aside>
<script>
(() => {
  const PROJECT_REF = "mzftzadtoepcrwhnwdmn";
  const SUPABASE_URL = "https://mzftzadtoepcrwhnwdmn.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_rp4QHXzXMgnxKmKL0QERAw_cKX0dSgh";
  const FUNCTION_URL = SUPABASE_URL + "/functions/v1/noah-headquarters-test";

  const panel = document.getElementById("noah-panel");
  const backdrop = document.getElementById("noah-backdrop");
  const openBtn = document.getElementById("noah-open");
  const closeBtn = document.getElementById("noah-close");
  const chat = document.getElementById("chat");
  const input = document.getElementById("message");
  const send = document.getElementById("send");
  const clear = document.getElementById("clear");
  const status = document.getElementById("noah-status");
  const statusText = document.getElementById("noah-status-text");
  let mode = "ask";
  let history = [];

  function openPanel(){ panel.classList.add("open"); backdrop.classList.add("open"); setTimeout(()=>input.focus(),100); checkSession(); }
  function closePanel(){ panel.classList.remove("open"); backdrop.classList.remove("open"); }
  openBtn.addEventListener("click", openPanel); closeBtn.addEventListener("click", closePanel); backdrop.addEventListener("click", closePanel);
  document.addEventListener("keydown", e => { if(e.key==="Escape") closePanel(); });

  document.getElementById("mode-row").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]"); if(!b) return;
    mode = b.dataset.mode;
    document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));
    const ph = {
      ask:"예: 오늘 본진에서 뭐부터 보면 돼?",
      task:"예: 수진에게 전달할 업무를 정리해줘",
      find:"예: 이 일은 어느 센터에서 해야 해?",
      organize:"예: 이 내용을 핵심만 정리해줘"
    };
    input.placeholder = ph[mode] || ph.ask;
    input.focus();
  });

  function deepToken(value){
    if(!value) return "";
    if(typeof value === "string"){
      if(value.split(".").length===3 && value.length>100) return value;
      try { return deepToken(JSON.parse(value)); } catch(_) { return ""; }
    }
    if(Array.isArray(value)){ for(const v of value){ const t=deepToken(v); if(t) return t; } return ""; }
    if(typeof value === "object"){
      if(typeof value.access_token === "string" && value.access_token) return value.access_token;
      if(typeof value.accessToken === "string" && value.accessToken) return value.accessToken;
      const priority = ["session","currentSession","data","auth","user"];
      for(const k of priority){ if(value[k]){ const t=deepToken(value[k]); if(t) return t; } }
      for(const k of Object.keys(value)){ const t=deepToken(value[k]); if(t) return t; }
    }
    return "";
  }

  function findAccessToken(){
    const preferred = ["sb-"+PROJECT_REF+"-auth-token","wd-admin-auth-v1"];
    for(const key of preferred){
      try{ const raw=localStorage.getItem(key); const token=deepToken(raw); if(token) return token; }catch(_){}
    }
    try{
      for(let i=0;i<localStorage.length;i++){
        const key=localStorage.key(i)||"";
        if(!/auth|session|supabase|wd-admin/i.test(key)) continue;
        const token=deepToken(localStorage.getItem(key));
        if(token) return token;
      }
    }catch(_){}
    return "";
  }

  function setStatus(kind,text){
    status.className = "noah-status" + (kind ? " "+kind : "");
    statusText.textContent = text;
  }

  function checkSession(){
    const token = findAccessToken();
    if(token) setStatus("ok","대표 로그인 세션 확인됨 · GPT 준비");
    else setStatus("err","본진 대표 로그인 세션을 찾지 못했습니다");
    return token;
  }

  function addMessage(role,text,meta){
    const row=document.createElement("div"); row.className="msg "+(role==="user"?"user":"noah");
    const wrap=document.createElement("div"); wrap.className="bubble"; wrap.textContent=text;
    if(meta){ const m=document.createElement("div"); m.className="meta"; m.textContent=meta; wrap.appendChild(m); }
    row.appendChild(wrap); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
  }

  async function askNoah(){
    const message=input.value.trim(); if(!message || send.disabled) return;
    const token=checkSession();
    if(!token){
      addMessage("noah","대표님, 현재 TEST 페이지에서 본진 로그인 세션을 찾지 못했습니다. 본진에서 로그인한 뒤 이 TEST 주소를 다시 열어주세요.");
      return;
    }
    addMessage("user",message);
    input.value=""; resize();
    send.disabled=true; setStatus("busy","노아가 생각하고 있습니다…");
    const prior=history.slice(-10);
    try{
      const res=await fetch(FUNCTION_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":PUBLISHABLE_KEY,
          "Authorization":"Bearer "+token
        },
        body:JSON.stringify({message,mode,history:prior})
      });
      let body={}; try{ body=await res.json(); }catch(_){}
      if(!res.ok) throw new Error(body.message || ("요청 실패 ("+res.status+")"));
      const text=(body.text||"").trim();
      addMessage("noah",text,body.model ? "GPT · "+body.model : "GPT");
      history.push({role:"user",content:message},{role:"assistant",content:text});
      history=history.slice(-10);
      setStatus("ok","GPT 연결 정상 · 대표 로그인 확인됨");
    }catch(err){
      const msg=err && err.message ? err.message : "요청을 처리하지 못했습니다.";
      addMessage("noah","대표님, "+msg);
      setStatus("err","GPT 호출 확인 필요");
    }finally{ send.disabled=false; input.focus(); }
  }

  function resize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,150)+"px"; }
  input.addEventListener("input",resize);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); askNoah(); }});
  send.addEventListener("click",askNoah);
  clear.addEventListener("click",()=>{ history=[]; [...chat.querySelectorAll(".msg")].forEach(x=>x.remove()); setStatus(findAccessToken()?"ok":"err",findAccessToken()?"대표 로그인 세션 확인됨 · GPT 준비":"본진 대표 로그인 세션을 찾지 못했습니다"); });
  window.addEventListener("storage",checkSession);
})();
</script>
</body>
</html>
